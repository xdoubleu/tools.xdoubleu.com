# manual_trigger holds all Codecov notifications (statuses + PR comment) until
# ci-pass explicitly runs `codecovcli send-notifications`, once every test job has
# uploaded. Needed because the number of coverage uploads per commit is variable
# (1-3, gated by the `changes` path filter in main.yml), so Codecov must not post a
# status off the first upload with the others carried forward from an older commit —
# that stale status is what left ci-pass red in #403.
codecov:
  notify:
    manual_trigger: true

coverage:
  status:
    project:
      default:
        # Absorb small, nondeterministic coverage swings (the api suite's Hit
        # count varies run-to-run) so the project status doesn't flake red on
        # PRs that don't touch product code. patch stays strict below, so newly
        # added/changed lines must still be covered.
        threshold: 1%
    patch:
      default:
        # Pinned to match the 80% threshold `tools/diff_coverage_go.py`/
        # `tools/diff_coverage_ts.py` enforce locally (see root/api/web
        # CLAUDE.md's "run before pushing" guidance). Without an explicit
        # target here, Codecov falls back to "auto" — current project
        # coverage — which floats independently of the documented 80% and
        # silently makes this check stricter than what passes locally
        # (issue #1303: a PR passed the local check at 83% patch coverage
        # but failed codecov/patch, which required 85.5%).
        target: 80%

comment:
  require_changes: true

# menubar_darwin.go is pure AppKit/cgo status-bar code with no window server
# session under go test (see kobo-gateway/CLAUDE.md) — it's exercised
# manually, not by go test, so it's permanently 0% and shouldn't count
# against patch coverage on every kobo-gateway PR that touches it.
#
# api/gen and web/lib/gen are buf-generated ConnectRPC stubs — root CLAUDE.md
# already excludes them from every lint/fix tool and tells contributors not
# to even read them. Their protoc-gen-go accessor methods (GetFoo() sugar
# around the real reflection-based marshal/unmarshal path) are essentially
# never called directly by test code, so they sit at a permanent ~0%; a PR
# that adds enough new proto fields can single-handedly sink patch coverage
# below threshold for reasons unrelated to its own hand-written code (found
# while shipping issue #1217 — a new response message's getters alone
# dropped patch coverage from ~78% to ~74%).
ignore:
  - "kobo-gateway/cmd/kobo-gateway/menubar_darwin.go"
  - "api/gen/**"
  - "web/lib/gen/**"

flags:
  api:
    paths:
      - api/
    carryforward: true
  web:
    paths:
      - web/
    carryforward: true
  kobo_gateway:
    paths:
      - kobo-gateway/
    carryforward: true
  sentrytools:
    paths:
      - sentrytools/
    carryforward: true
