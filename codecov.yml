# manual_trigger holds all Codecov notifications (statuses + PR comment) until
# ci-pass explicitly runs `codecovcli send-notifications`, once every test job has
# uploaded. Needed because the number of coverage uploads per commit is variable
# (1-3, gated by the `changes` path filter in main.yml), so Codecov must not post a
# status off the first upload with the others carried forward from an older commit —
# that stale status is what left ci-pass red in #403.
codecov:
  notify:
    manual_trigger: true

coverage:
  status:
    project:
      default:
        # Absorb small, nondeterministic coverage swings (the api suite's Hit
        # count varies run-to-run) so the project status doesn't flake red on
        # PRs that don't touch product code. patch stays strict below, so newly
        # added/changed lines must still be covered.
        threshold: 1%
    patch:
      default:
        # Pinned to the 80% `tools/diff_coverage_{go,ts}.py` enforce locally;
        # otherwise Codecov uses "auto" (current project coverage), which can
        # be stricter than what passes locally.
        target: 80%

comment:
  require_changes: true

# menubar_darwin.go is pure AppKit/cgo status-bar code with no window server
# session under go test (see kobo-gateway/AGENTS.md) — it's exercised
# manually, not by go test, so it's permanently 0% and shouldn't count
# against patch coverage on every kobo-gateway PR that touches it.
#
# api/gen and web/lib/gen are generated stubs whose accessors tests rarely
# call directly, so new proto fields alone could sink patch coverage.
#
# go.mod/go.sum are dependency files, not code. They're updated by dependency
# bots like Renovate and don't need test coverage (the code that uses those
# dependencies is already covered). A dependency update PR should not fail
# coverage checks just because it added/changed go.mod/go.sum lines.
ignore:
  - "kobo-gateway/cmd/kobo-gateway/menubar_darwin.go"
  - "api/gen/**"
  - "web/lib/gen/**"
  - "api/go.mod"
  - "api/go.sum"

flags:
  api:
    paths:
      - api/
    carryforward: true
  web:
    paths:
      - web/
    carryforward: true
  kobo_gateway:
    paths:
      - kobo-gateway/
    carryforward: true
  sentrytools:
    paths:
      - sentrytools/
    carryforward: true
