version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - loggercheck
    - makezero
    - mirror
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 30
      package-average: 10
    # One rule per api/apps/<name>: nothing outside apps/<name>/** may import
    # apps/<name>/internal/... . dashboard and learningpaths hold live
    # references to other apps' exported top-level packages (e.g.
    # *games.Games, *books.Books) — that's fine and untouched by these rules,
    # which only ever match the "/internal" import path, never the app's
    # top-level package. See docs/adr-0007-dashboard-app-owns-public-sharing.md
    # and api/AGENTS.md's learningpaths section.
    depguard:
      rules:
        apps-books-internal:
          files:
            - "!**/apps/books/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/books/internal
              desc: apps/books/internal is private to the books app
        apps-dashboard-internal:
          files:
            - "!**/apps/dashboard/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/dashboard/internal
              desc: apps/dashboard/internal is private to the dashboard app
        apps-feeds-internal:
          files:
            - "!**/apps/feeds/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/feeds/internal
              desc: apps/feeds/internal is private to the feeds app
        apps-games-internal:
          files:
            - "!**/apps/games/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/games/internal
              desc: apps/games/internal is private to the games app
        apps-learningpaths-internal:
          files:
            - "!**/apps/learningpaths/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/learningpaths/internal
              desc: apps/learningpaths/internal is private to the learningpaths app
        apps-mealplans-internal:
          files:
            - "!**/apps/mealplans/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/mealplans/internal
              desc: apps/mealplans/internal is private to the mealplans app
        apps-recipes-internal:
          files:
            - "!**/apps/recipes/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/recipes/internal
              desc: apps/recipes/internal is private to the recipes app
        apps-shoppinglist-internal:
          files:
            - "!**/apps/shoppinglist/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/shoppinglist/internal
              desc: apps/shoppinglist/internal is private to the shoppinglist app
        apps-trains-internal:
          files:
            - "!**/apps/trains/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/trains/internal
              desc: apps/trains/internal is private to the trains app
        apps-watchparty-internal:
          files:
            - "!**/apps/watchparty/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/watchparty/internal
              desc: apps/watchparty/internal is private to the watchparty app
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - map
    exhaustruct:
      exclude:
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        - ^github.com/Shopify/sarama.Config$
        - ^github.com/Shopify/sarama.ProducerMessage$
        - ^github.com/mitchellh/mapstructure.DecoderConfig$
        - ^github.com/prometheus/client_golang/.+Opts$
        - ^github.com/spf13/cobra.Command$
        - ^github.com/spf13/cobra.CompletionOptions$
        - ^github.com/stretchr/testify/mock.Mock$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^golang.org/x/tools/go/analysis.Analyzer$
        - ^google.golang.org/protobuf/.+Options$
        - ^gopkg.in/yaml.v3.Node$
        - ^tools\.xdoubleu\.com/gen/.+$
        - ^crypto/tls.Config$
        - ^crypto/x509.Certificate$
        - ^crypto/x509/pkix.Name$
        - ^encoding/pem.Block$
        - ^github.com/getsentry/sentry-go.ClientOptions$
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    gomoddirectives:
      replace-local: true
    gomodguard_v2:
      blocked:
        - module: github.com/golang/protobuf
          recommendations:
            - google.golang.org/protobuf
          reason: see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
        - module: github.com/satori/go.uuid
          recommendations:
            - github.com/google/uuid
          reason: satori's package is not maintained
        - module: github.com/gofrs/uuid
          recommendations:
            - github.com/google/uuid
          reason: gofrs' package is not go module
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: true
    lll:
      line-length: 88
    mnd:
      ignored-functions:
        - os.Chmod
        - os.Mkdir
        - os.MkdirAll
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets
        - prometheus.ExponentialBucketsRange
        - prometheus.LinearBuckets
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
    rowserrcheck:
      packages:
        - github.com/jackc/pgx
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - godot
        source: (noinspection|TODO)
      - linters:
          - gocritic
        source: //noinspection
      # Apple's plist DOCTYPE line is fixed-format content inside a raw
      # string literal — a trailing //nolint would corrupt the string.
      - linters:
          - lll
        source: '<!DOCTYPE plist PUBLIC'
      - linters:
          - bodyclose
          - dupl
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gci
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(tools.xdoubleu.com)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)gen/
