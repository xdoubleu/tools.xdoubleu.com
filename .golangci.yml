version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - loggercheck
    - makezero
    - mirror
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 30
      package-average: 10
    # One rule per api/apps/<name>: nothing outside apps/<name>/** may import
    # apps/<name>/internal/... . dashboard and learningpaths hold live
    # references to other apps' exported top-level packages (e.g.
    # *games.Games, *books.Books) — that's fine and untouched by these rules,
    # which only ever match the "/internal" import path, never the app's
    # top-level package. See docs/adr-0007-dashboard-app-owns-public-sharing.md
    # and api/AGENTS.md's learningpaths section.
    depguard:
      rules:
        kit-tier:
          files:
            - "**/internal/kit/**"
            - "!**/internal/kit/testhelper/**"
          list-mode: lax
          deny:
            - pkg: tools.xdoubleu.com/internal
              desc: kit is the domain-free toolkit and imports no other tier
            - pkg: tools.xdoubleu.com/apps
              desc: kit is the domain-free toolkit and imports no other tier
          allow:
            - tools.xdoubleu.com/internal/kit
        # The identity core (agent accounts, the OAuth 2.1 server) imports only
        # kit and its own ports, so it can be extracted; adapters live in
        # identity/adapters and the connect/http subpackages.
        identity-core:
          files:
            - "**/internal/platform/identity/agentaccounts/**"
            - "**/internal/platform/identity/oauth2as/**"
            - "!**/internal/platform/identity/agentaccounts/connect/**"
            - "!**/internal/platform/identity/oauth2as/http/**"
            - "!**/*_test.go"
          list-mode: lax
          deny:
            - pkg: tools.xdoubleu.com/internal
              desc: the identity core imports only kit and its own ports
          allow:
            - tools.xdoubleu.com/internal/kit
        platform-tier:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: tools.xdoubleu.com/apps
              desc: platform may import only kit, never apps
        # Hexagonal apps (docs/convention-hexagonal-apps.md): adapters reach
        # persistence only through services; services stay transport-free.
        # Every converted app is listed by path.
        hexagonal-adapters:
          files:
            - "**/apps/shoppinglist/connect/**"
            - "**/apps/shoppinglist/mcp/**"
            - "**/apps/shoppinglist/http/**"
            - "**/apps/movies/connect/**"
            - "**/apps/movies/mcp/**"
            - "**/apps/movies/http/**"
            - "**/apps/feeds/connect/**"
            - "**/apps/feeds/mcp/**"
            - "**/apps/feeds/http/**"
            - "**/apps/taste/connect/**"
            - "**/apps/taste/mcp/**"
            - "**/apps/taste/http/**"
            - "**/apps/games/connect/**"
            - "**/apps/games/mcp/**"
            - "**/apps/books/connect/**"
            - "**/apps/books/mcp/**"
            - "**/apps/books/http/**"
            - "**/platform/factory/connect/**"
            - "**/platform/factory/mcp/**"
            - "**/platform/factory/http/**"
            - "!**/*_test.go"
          deny:
            - pkg: tools.xdoubleu.com/internal/platform/factory/internal/repositories
              desc: adapters call services, never repositories
            - pkg: tools.xdoubleu.com/apps/shoppinglist/internal/repositories
              desc: adapters call services, never repositories
            - pkg: tools.xdoubleu.com/apps/movies/internal/repositories
              desc: adapters call services, never repositories
            - pkg: tools.xdoubleu.com/apps/feeds/internal/repositories
              desc: adapters call services, never repositories
            - pkg: tools.xdoubleu.com/apps/taste/internal/repositories
              desc: adapters call services, never repositories
            - pkg: tools.xdoubleu.com/apps/games/internal/repositories
              desc: adapters call services, never repositories
            - pkg: tools.xdoubleu.com/apps/books/internal/repositories
              desc: adapters call services, never repositories
            - pkg: github.com/jackc/pgx
              desc: adapters do not touch the database
            - pkg: tools.xdoubleu.com/internal/kit/database/postgres
              desc: adapters do not touch the database
        hexagonal-services:
          files:
            - "**/apps/shoppinglist/internal/services/**"
            - "**/apps/movies/internal/services/**"
            - "**/apps/feeds/internal/services/**"
            - "**/apps/taste/internal/services/**"
            - "**/apps/games/internal/services/**"
            - "**/platform/factory/internal/services/**"
            - "**/apps/books/internal/services/**"
            - "!**/*_test.go"
          deny:
            - pkg: connectrpc.com/connect
              desc: services know no transport
            - pkg: tools.xdoubleu.com/gen
              desc: services use domain types, not generated protos
            - pkg: github.com/jackc/pgx
              desc: services reach storage through their own interfaces
            - pkg: net/http
              desc: services know no transport
        # The factory services import only kit and the factory's own models;
        # agent accounts, GitHub, Slack and auth reach them through ports that
        # the root wiring adapts, so the factory can be extracted.
        factory-core:
          files:
            - "**/platform/factory/internal/services/**"
            - "!**/*_test.go"
          list-mode: lax
          deny:
            - pkg: tools.xdoubleu.com/internal
              desc: factory services import only kit and the factory's models
            - pkg: tools.xdoubleu.com/apps
              desc: factory services import only kit and the factory's models
          allow:
            - tools.xdoubleu.com/internal/kit
            - tools.xdoubleu.com/internal/platform/factory/internal/models
        apps-books-internal:
          files:
            - "!**/apps/books/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/books/internal
              desc: apps/books/internal is private to the books app
        apps-dashboard-internal:
          files:
            - "!**/apps/dashboard/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/dashboard/internal
              desc: apps/dashboard/internal is private to the dashboard app
        apps-feeds-internal:
          files:
            - "!**/apps/feeds/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/feeds/internal
              desc: apps/feeds/internal is private to the feeds app
        apps-games-internal:
          files:
            - "!**/apps/games/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/games/internal
              desc: apps/games/internal is private to the games app
        apps-learningpaths-internal:
          files:
            - "!**/apps/learningpaths/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/learningpaths/internal
              desc: apps/learningpaths/internal is private to the learningpaths app
        apps-mealplans-internal:
          files:
            - "!**/apps/mealplans/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/mealplans/internal
              desc: apps/mealplans/internal is private to the mealplans app
        apps-movies-internal:
          files:
            - "!**/apps/movies/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/movies/internal
              desc: apps/movies/internal is private to the movies app
        apps-taste-internal:
          files:
            - "!**/apps/taste/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/taste/internal
              desc: apps/taste/internal is private to the taste app
        apps-recipes-internal:
          files:
            - "!**/apps/recipes/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/recipes/internal
              desc: apps/recipes/internal is private to the recipes app
        apps-shoppinglist-internal:
          files:
            - "!**/apps/shoppinglist/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/shoppinglist/internal
              desc: apps/shoppinglist/internal is private to the shoppinglist app
        apps-trains-internal:
          files:
            - "!**/apps/trains/**"
          deny:
            - pkg: tools.xdoubleu.com/apps/trains/internal
              desc: apps/trains/internal is private to the trains app
        services-domain-errors:
          files:
            - "**/internal/services/**"
          deny:
            - pkg: connectrpc.com/connect
              desc: services return domain errors; handlers map them with connecttools.MapError
        repositories-domain-errors:
          files:
            - "**/internal/platform/repositories/**"
            - "**/internal/platform/family/repository.go"
            - "**/internal/platform/oauthconn/repository.go"
            - "**/internal/platform/account/users.go"
            - "**/internal/platform/account/profile_shares.go"
          deny:
            - pkg: net/http
              desc: repositories return domain errors, not HTTP errors
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - mapliteral
    exhaustruct:
      exclude:
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        - ^github.com/Shopify/sarama.Config$
        - ^github.com/Shopify/sarama.ProducerMessage$
        - ^github.com/mitchellh/mapstructure.DecoderConfig$
        - ^github.com/prometheus/client_golang/.+Opts$
        - ^github.com/spf13/cobra.Command$
        - ^github.com/spf13/cobra.CompletionOptions$
        - ^github.com/stretchr/testify/mock.Mock$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^golang.org/x/tools/go/analysis.Analyzer$
        - ^google.golang.org/protobuf/.+Options$
        - ^gopkg.in/yaml.v3.Node$
        - ^tools\.xdoubleu\.com/gen/.+$
        - ^tools\.xdoubleu\.com/internal/kit/httpclient\.Config$
        - ^crypto/tls.Config$
        - ^crypto/x509.Certificate$
        - ^crypto/x509/pkix.Name$
        - ^encoding/pem.Block$
        - ^github.com/getsentry/sentry-go.ClientOptions$
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    gomoddirectives:
      replace-local: true
    gomodguard_v2:
      blocked:
        - module: github.com/golang/protobuf
          recommendations:
            - google.golang.org/protobuf
          reason: see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
        - module: github.com/satori/go.uuid
          recommendations:
            - github.com/google/uuid
          reason: satori's package is not maintained
        - module: github.com/gofrs/uuid
          recommendations:
            - github.com/google/uuid
          reason: gofrs' package is not go module
    govet:
      disable:
        - fieldalignment
      enable-all: true
      settings:
        shadow:
          strict: true
    lll:
      line-length: 88
    mnd:
      ignored-functions:
        - os.Chmod
        - os.Mkdir
        - os.MkdirAll
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets
        - prometheus.ExponentialBucketsRange
        - prometheus.LinearBuckets
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
    rowserrcheck:
      packages:
        - github.com/jackc/pgx
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - godot
        source: (noinspection|TODO)
      - linters:
          - gocritic
        source: //noinspection
      # resolveArticleImage's Clean + containment check blocks the path
      # traversal gosec's G703 taint analysis can't reason about
      # (conversion_epubbuild_xhtml.go).
      - linters:
          - gosec
        path: conversion_epubbuild_xhtml\.go
        text: G703
      # Apple's plist DOCTYPE line is fixed-format content inside a raw
      # string literal — a trailing //nolint would corrupt the string.
      - linters:
          - lll
        source: '<!DOCTYPE plist PUBLIC'
      - linters:
          - bodyclose
          - dupl
          - funlen
          - goconst
          - gosec
          - noctx
          - wrapcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gci
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(tools.xdoubleu.com)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)gen/
