syntax = "proto3";
package books.v1;
option go_package = "tools.xdoubleu.com/gen/books/v1;booksv1";

import "books/v1/library.proto";

message ImportBooksRequest { bytes csv_data = 1; }
message ImportBooksResponse { int32 imported_count = 1; }

message DuplicateGroup {
  // Entries judged the same book; entries[0] is the suggested one to keep.
  repeated UserBook entries = 1;
  // Strongest matching signal: "isbn13" | "isbn10" | "title+author"
  string reason = 2;
}

message FindDuplicatesRequest {}
message FindDuplicatesResponse { repeated DuplicateGroup groups = 1; }

message MergeBooksRequest {
  // book_id of the UserBook entry to keep.
  string winner_book_id = 1;
  // book_ids of UserBook entries to merge into the winner, then delete.
  repeated string loser_book_ids = 2;
  // Overwrites the winner's catalog metadata after merging (cover_url
  // excluded; see resolved_cover_source_book_id). Omit to keep it.
  optional Book resolved_metadata = 3;
  // book_id whose cover the winner takes. Omit to keep the winner's cover.
  optional string resolved_cover_source_book_id = 4;
  // Overrides the merged status/shelf. Omit for the automatic rule:
  // custom-shelf > read > currently-reading > to-read > dropped.
  optional string resolved_status = 5;
}
message MergeBooksResponse {
  // Always 1 — one group merged per call.
  uint32 merged_groups = 1;
  // Duplicate file rows removed (after format+checksum dedup).
  uint32 deleted_files = 2;
}

message StartResyncRequest {
  // Re-query every source for every book, ignoring the skip-if-known cache
  // (recovers books stuck after a rate limit or stale miss).
  bool force = 1;
}
message StartResyncResponse {}

// CancelResync stops a running resync scan (no-op if none). Processed books
// and proposals are left as is.
message CancelResyncRequest {}
message CancelResyncResponse {}

// SourceBook is one candidate metadata set: the library values (source "")
// or a provider's proposal ("unicat" | "hardcover").
message SourceBook {
  string source = 1;
  string cover_url = 2;
  string description = 3;
  int32 page_count = 4;
  string isbn13 = 5;
  string title = 6;
  repeated string authors = 7;
  // Fields differing from the library row; empty for the library itself.
  repeated string differs = 8;
  // 0-based ordinal among candidates of the same source; only a manual
  // override search yields more than one (up to 5).
  int32 index = 9;
}

// ResyncProposal is one catalog book differing from an external source.
message ResyncProposal {
  string book_id = 1;
  SourceBook library = 2;
  repeated SourceBook sources = 3;
}

message ListResyncProposalsRequest {}
message ListResyncProposalsResponse {
  repeated ResyncProposal proposals = 1;
}

message ApplyResyncChoiceRequest {
  string book_id = 1;
  // Winning source: "" keeps the library row (dismisses), or "unicat" |
  // "hardcover".
  string source = 2;
}
message ApplyResyncChoiceResponse {}

message SetBookISBNRequest {
  string book_id = 1;
  string isbn13 = 2;
}
message SetBookISBNResponse {}

// UpdateBook hand-corrects a catalog book's metadata.
message UpdateBookRequest {
  string book_id = 1;
  // Full replacement of catalog metadata. Empty cover_url clears the cover;
  // any other value is fetched and cached.
  Book metadata = 2;
}
message UpdateBookResponse { Book book = 1; }

// GetBookSources live-fetches any book's candidates from every source.
message GetBookSourcesRequest {
  string book_id = 1;
  // Replaces title/author in the search, skips strict match guards, and
  // forces search even for books with an ISBN.
  optional string override_title = 2;
  optional string override_author = 3;
}
message GetBookSourcesResponse {
  ResyncProposal proposal = 1;
}

// ApplyBookSource live-fetches the book's sources and applies the chosen one.
message ApplyBookSourceRequest {
  string book_id = 1;
  // "unicat" | "hardcover".
  string source = 2;
  // Must repeat GetBookSources' override so the re-fetch matches.
  optional string override_title = 3;
  optional string override_author = 4;
  // Candidate to apply, matching SourceBook.index.
  int32 index = 5;
}
message ApplyBookSourceResponse {}

// GetSourceStats reports per-source coverage over the catalog.
message GetSourceStatsRequest {}
message SourceStat {
  // "unicat" | "hardcover"
  string source = 1;
  // Books the last scan found in this source (coverage).
  int32 found_count = 2;
  // Books found ONLY in this source (found here, nowhere else).
  int32 unique_count = 3;
  // Books this source checked and missed (vs never scanned).
  int32 missed_count = 4;
}
// SourceComboStat counts books found by exactly this set of sources.
message SourceComboStat {
  // "unicat" | "hardcover", both entries.
  repeated string sources = 1;
  int32 count = 2;
}
message GetSourceStatsResponse {
  repeated SourceStat sources = 1;
  int32 total_books = 2;
  // Scanned, but no source found the book.
  int32 not_found_anywhere = 3;
  // Never processed by a scan (last_resync_at IS NULL).
  int32 never_scanned = 4;
  // The one two-source combo (both sources).
  repeated SourceComboStat overlaps = 5;
  // Books missed by exactly this set of sources and found by all others.
  repeated SourceComboStat missed_overlaps = 6;
}

// ListBooksInExactSources lists catalog books found by exactly the given
// sources, drilling into GetSourceStats.
message ListBooksInExactSourcesRequest {
  // "unicat" | "hardcover", 1 to 2 entries.
  repeated string sources = 1;
}
message ListBooksInExactSourcesResponse {
  repeated Book books = 1;
}

service CatalogService {
  rpc ImportBooks(ImportBooksRequest) returns (ImportBooksResponse);
  rpc FindDuplicates(FindDuplicatesRequest) returns (FindDuplicatesResponse);
  rpc MergeBooks(MergeBooksRequest) returns (MergeBooksResponse);
  rpc StartResync(StartResyncRequest) returns (StartResyncResponse);
  rpc CancelResync(CancelResyncRequest) returns (CancelResyncResponse);
  rpc ListResyncProposals(ListResyncProposalsRequest) returns (ListResyncProposalsResponse);
  rpc ApplyResyncChoice(ApplyResyncChoiceRequest) returns (ApplyResyncChoiceResponse);
  rpc SetBookISBN(SetBookISBNRequest) returns (SetBookISBNResponse);
  rpc UpdateBook(UpdateBookRequest) returns (UpdateBookResponse);
  rpc GetBookSources(GetBookSourcesRequest) returns (GetBookSourcesResponse);
  rpc ApplyBookSource(ApplyBookSourceRequest) returns (ApplyBookSourceResponse);
  rpc GetSourceStats(GetSourceStatsRequest) returns (GetSourceStatsResponse);
  rpc ListBooksInExactSources(ListBooksInExactSourcesRequest) returns (ListBooksInExactSourcesResponse);
}
