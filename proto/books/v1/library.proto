syntax = "proto3";
package books.v1;
option go_package = "tools.xdoubleu.com/gen/books/v1;booksv1";

message Book {
  string id = 1;
  string title = 2;
  repeated string authors = 3;
  string isbn13 = 4;
  string cover_url = 5;
  string description = 6;
  int32 page_count = 7;
  reserved 8, 9, 10;
  reserved "isbn10", "external_refs", "category";
  // Canonical origin URL for URL-ingested items; empty for books.
  string source_url = 11;
  // True once extracted in-app content is stored.
  bool has_content = 12;
}

message UserBook {
  string id = 1;
  string user_id = 2;
  string book_id = 3;
  Book book = 4;
  string status = 5;
  repeated string tags = 6;
  int32 rating = 7;
  reserved 8;
  repeated string finished_at = 9;
  string added_at = 10;
  string updated_at = 11;
  string progress_mode = 12;
  int32 current_page = 13;
  int32 progress_percent = 14;
  repeated string formats = 15;
  // Format (incl. kepub) -> version of the file GetBookFile serves; changes
  // when that file is replaced or reconverted.
  map<string, string> file_versions = 16;
}

message BookShelf {
  string name = 1;
  repeated UserBook books = 2;
}

message LibraryResponse {
  repeated UserBook reading = 1;
  repeated UserBook wishlist = 2;
  repeated UserBook finished = 3;
  repeated BookShelf shelves = 4;
  reserved 5;
  reserved "rss";
}

message BooksProgressResponse {
  repeated string labels = 1;
  repeated string values = 2;
  string date_start = 3;
  string date_end = 4;
}

message ExternalBookResult {
  string provider = 1;
  string provider_id = 2;
  string title = 3;
  repeated string authors = 4;
  string isbn13 = 5;
  string cover_url = 6;
  string description = 7;
}

// ReadingPosition is a format-neutral position: href + offset for EPUB/KEPUB,
// page for PDF.
message ReadingPosition {
  // Content document path as in the EPUB manifest, relative to the zip root.
  string href = 1;
  // Character offset into the section body's text.
  int32 offset = 2;
  // 1-based PDF page.
  int32 page = 3;
}

message BookReadingStateData {
  string source = 1;
  int32 percent = 2;
  string location = 3;
  string updated_at = 4;
  ReadingPosition position = 5;
  // When the reading device recorded the position (RFC3339); empty if unknown.
  string read_at = 6;
}

message GetLibraryRequest {}
message GetLibraryResponse { LibraryResponse library = 1; }

message GetBooksProgressRequest {
  string date_start = 1;
  string date_end = 2;
}
message GetBooksProgressResponse { BooksProgressResponse progress = 1; }

message SearchLibraryRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message SearchLibraryResponse {
  repeated UserBook books = 1;
  bool has_more = 2;
}

message SearchExternalRequest { string query = 1; }
message SearchExternalResponse { repeated ExternalBookResult results = 1; }

message GetExternalBookRequest { string provider = 1; string provider_id = 2; }
message GetExternalBookResponse { ExternalBookResult result = 1; }

message CreateBookRequest {
  string provider = 1;
  string provider_id = 2;
  string title = 3;
  string author = 4;
  string status = 5;
  string isbn13 = 6;
  string cover_url = 7;
  string description = 8;
  bool own_physical = 9;
  bool own_digital = 10;
}
message CreateBookResponse {}

message UpdateBookStatusRequest {
  string book_id = 1;
  string status = 2;
  bool favourite = 3;
  string rating = 4;
  reserved 5;
}
message UpdateBookStatusResponse {}

message ToggleTagRequest {
  string book_id = 1;
  string tag = 2;
}
message ToggleTagResponse {}

// SetBookTag adds (enabled) or removes a tag; repeating it changes nothing.
message SetBookTagRequest {
  string book_id = 1;
  string tag = 2;
  bool enabled = 3;
}
message SetBookTagResponse {}

// RemoveBook removes the book from the caller's library; an unreferenced
// catalog row and its R2 objects are deleted too.
message RemoveBookRequest { string book_id = 1; }
message RemoveBookResponse {}

message UpdateFinishedAtRequest {
  string book_id = 1;
  repeated string finished_at = 2;
}
message UpdateFinishedAtResponse {}

message UpdateProgressRequest {
  string book_id = 1;
  string progress_mode = 2;
  int32 current_page = 3;
  int32 progress_percent = 4;
}
message UpdateProgressResponse {}

// UpdateReadingProgress applies only if read_at (RFC3339, default now) is
// newer than the stored position's.
message UpdateReadingProgressRequest {
  string book_id = 1;
  string source = 2;
  int32 percent = 3;
  string location = 4;
  ReadingPosition position = 5;
  string read_at = 6;
}
message UpdateReadingProgressResponse {}

message GetReadingStateRequest { string book_id = 1; }
// For a PDF-sourced book the position carries both the page and its
// converted KEPUB's href + offset, when the server can translate it.
message GetReadingStateResponse { BookReadingStateData state = 1; }

// TranslateReadingPosition returns position with the forms GetReadingState
// adds, or unchanged.
message TranslateReadingPositionRequest {
  string book_id = 1;
  ReadingPosition position = 2;
}
message TranslateReadingPositionResponse { ReadingPosition position = 1; }

// GetBookContent returns a URL-ingested book's extracted body; html is empty
// when none was extracted.
message GetBookContentRequest { string book_id = 1; }
message GetBookContentResponse { string html = 1; }

message CreateShelfRequest { string name = 1; }
message CreateShelfResponse {}
message RenameShelfRequest { string old_name = 1; string new_name = 2; }
message RenameShelfResponse { uint32 moved = 1; }
// Reassign every book on `name` to `target_name`, after which `name` no longer exists.
message DeleteShelfRequest { string name = 1; string target_name = 2; }
message DeleteShelfResponse { uint32 moved = 1; }
message RenameTagRequest { string old_name = 1; string new_name = 2; }
message RenameTagResponse { uint32 affected = 1; }
message DeleteTagRequest { string name = 1; }
message DeleteTagResponse { uint32 affected = 1; }

service LibraryService {
  rpc GetLibrary(GetLibraryRequest) returns (GetLibraryResponse);
  rpc GetBooksProgress(GetBooksProgressRequest) returns (GetBooksProgressResponse);
  rpc SearchLibrary(SearchLibraryRequest) returns (SearchLibraryResponse);
  rpc SearchExternal(SearchExternalRequest) returns (SearchExternalResponse);
  rpc GetExternalBook(GetExternalBookRequest) returns (GetExternalBookResponse);
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);
  rpc UpdateBookStatus(UpdateBookStatusRequest) returns (UpdateBookStatusResponse);
  rpc UpdateFinishedAt(UpdateFinishedAtRequest) returns (UpdateFinishedAtResponse);
  rpc UpdateProgress(UpdateProgressRequest) returns (UpdateProgressResponse);
  rpc ToggleTag(ToggleTagRequest) returns (ToggleTagResponse);
  rpc SetBookTag(SetBookTagRequest) returns (SetBookTagResponse);
  rpc RemoveBook(RemoveBookRequest) returns (RemoveBookResponse);
  rpc UpdateReadingProgress(UpdateReadingProgressRequest) returns (UpdateReadingProgressResponse);
  rpc GetReadingState(GetReadingStateRequest) returns (GetReadingStateResponse);
  rpc TranslateReadingPosition(TranslateReadingPositionRequest) returns (TranslateReadingPositionResponse);
  rpc GetBookContent(GetBookContentRequest) returns (GetBookContentResponse);
  rpc CreateShelf(CreateShelfRequest) returns (CreateShelfResponse);
  rpc RenameShelf(RenameShelfRequest) returns (RenameShelfResponse);
  rpc DeleteShelf(DeleteShelfRequest) returns (DeleteShelfResponse);
  rpc RenameTag(RenameTagRequest) returns (RenameTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
}
