syntax = "proto3";
package feeds.v1;
option go_package = "tools.xdoubleu.com/gen/feeds/v1;feedsv1";

// Feed is an RSS/Atom, scrape or email-relay subscription.
message Feed {
  string id = 1;
  string url = 2;
  string title = 3;
  // RFC3339; empty when the feed has never been fetched.
  string last_fetched_at = 4;
  // The most recent poll failure; empty when the last poll succeeded.
  string last_error = 5;
  string created_at = 6;
  // "rss", "email" or "scrape". Email feeds are pushed via webhook (refresh
  // is a no-op); scrape feeds discover posts heuristically.
  string source_type = 7;
  // Subscription address for an email feed, returned only once by
  // CreateFeed (never stored in plaintext).
  string inbound_address = 8;
  // Conditional-GET validators; empty until fetched.
  string etag = 9;
  string last_modified = 10;
  // Unbroken poll failures since the last success.
  int32 consecutive_failures = 11;
  // RFC3339; set while a problem email is outstanding.
  string notified_at = 12;
}

message ListFeedsRequest {}
message ListFeedsResponse { repeated Feed feeds = 1; }

enum FeedKind {
  FEED_KIND_UNSPECIFIED = 0; // treated as RSS
  FEED_KIND_RSS = 1;
  FEED_KIND_EMAIL = 2;
  FEED_KIND_SCRAPE = 3;
}

// CreateFeed: RSS (default) validates the URL and imports in the background
// (poll the lists to see items land); EMAIL mints an inbound alias (url
// empty); SCRAPE heuristically discovers post links on a page with no feed.
message CreateFeedRequest {
  string url = 1;
  FeedKind kind = 2;
  // Only used for kind=EMAIL; RSS titles come from the feed.
  string title = 3;
}
message CreateFeedResponse { Feed feed = 1; }

message UpdateFeedRequest {
  string feed_id = 1;
  string title = 2;
}
message UpdateFeedResponse {}

// DeleteFeed removes the subscription and every item it ingested.
message DeleteFeedRequest { string feed_id = 1; }
message DeleteFeedResponse {}

// RefreshFeed polls the feed synchronously and ingests new items.
message RefreshFeedRequest { string feed_id = 1; }
message RefreshFeedResponse { int32 ingested = 1; }

// Item is one ingested feed entry; feeds and items are single-user.
message Item {
  string id = 1;
  string feed_id = 2;
  string title = 3;
  string source_url = 4;
  // Only populated by GetFeedItem; other RPCs set has_content instead.
  string content_html = 5;
  // RFC3339 publish date from the feed/email, not ingest time.
  string published_at = 6;
  // RFC3339; empty when unread.
  string read_at = 7;
  bool dismissed = 8;
  bool bookmarked = 9;
  // The most recent ingest failure for this item, if any.
  string ingest_error = 10;
  string created_at = 11;
  // Furthest scroll reached in the reader, 0-100; never lowered.
  int32 read_progress_pct = 12;
  // Whether an article body exists, distinguishing "no content" from "not
  // loaded".
  bool has_content = 13;
  // RSS <category> values or scraped card labels; empty when none.
  repeated string categories = 14;
  // RFC3339; set only while a filter rule hides the item.
  string filtered_at = 15;
  // The rule that filtered the item; unset when it was deleted or the item
  // isn't filtered. Its filtered_count is always 0 here.
  FilterRule filter_rule = 16;
  // RFC3339; set once the item was restored, which no rule filters again.
  string restored_at = 17;
}

message ListFeedItemsRequest {
  int32 limit = 1;
  int32 offset = 2;
  // When true, excludes read items.
  optional bool unread_only = 3;
  // Restricts results to one feed.
  optional string feed_id = 4;
  // When true, excludes unbookmarked items.
  optional bool bookmarked_only = 5;
  // When true, returns only filtered items, newest filtered_at first;
  // unread_only and bookmarked_only are ignored.
  optional bool filtered_only = 6;
}
message ListFeedItemsResponse {
  repeated Item items = 1;
  bool has_more = 2;
}

// GetFeedItem returns one item with content_html — the only RPC reading the
// article body.
message GetFeedItemRequest { string item_id = 1; }
message GetFeedItemResponse { Item item = 1; }

// UpdateItem applies only the fields set. read sets or clears read_at;
// read_progress_pct is clamped to [0,100] and only increases.
message UpdateItemRequest {
  string item_id = 1;
  optional bool read = 2;
  optional bool dismissed = 3;
  optional bool bookmarked = 4;
  optional int32 read_progress_pct = 5;
}
message UpdateItemResponse { Item item = 1; }

// FeedStats aggregates one feed's posting cadence and read metrics.
message FeedStats {
  string feed_id = 1;
  string feed_title = 2;
  int32 item_count = 3;
  // Mean hours between items; 0 below 2 items.
  double avg_interval_hours = 4;
  // Fraction (0-1) of items with read_at set.
  double read_rate = 5;
  // Mean furthest-scroll-reached across items (0-100).
  double avg_read_progress_pct = 6;
}

// DayCount is one day's ingested-item count.
message DayCount {
  // RFC3339 (midnight UTC).
  string day = 1;
  int32 count = 2;
}

message GetFeedStatsRequest {}
message GetFeedStatsResponse {
  repeated FeedStats stats = 1;
  // Trailing-90-day histogram across all of the caller's feeds.
  repeated DayCount items_per_day = 2;
}

// UnhealthyFeed is one feed whose most recent poll(s) have been failing.
message UnhealthyFeed {
  string title = 1;
  string url = 2;
  string last_error = 3;
  int32 consecutive_failures = 4;
}

// GetUnhealthyFeeds reports every user's failing feeds (admin-only).
message GetUnhealthyFeedsRequest {}
message GetUnhealthyFeedsResponse {
  repeated UnhealthyFeed feeds = 1;
}

enum FilterRuleKind {
  FILTER_RULE_KIND_UNSPECIFIED = 0; // rejected
  // Exact category match, ignoring case.
  FILTER_RULE_KIND_CATEGORY = 1;
  // Title substring match, ignoring case.
  FILTER_RULE_KIND_TITLE = 2;
}

// FilterRule hides matching items from the inbox, unread counts and stats.
message FilterRule {
  string id = 1;
  // Empty for a rule covering all of the caller's feeds.
  string feed_id = 2;
  FilterRuleKind kind = 3;
  string value = 4;
  string created_at = 5;
  // Items the rule has filtered, at ingest or retroactively.
  int32 filtered_count = 6;
}

message ListFilterRulesRequest {}
message ListFilterRulesResponse { repeated FilterRule rules = 1; }

// CreateFilterRule also filters the scope's existing unread,
// unbookmarked, undismissed items; rule.filtered_count is how many.
message CreateFilterRuleRequest {
  // Empty applies the rule to all of the caller's feeds.
  string feed_id = 1;
  FilterRuleKind kind = 2;
  string value = 3;
}
message CreateFilterRuleResponse { FilterRule rule = 1; }

// DeleteFilterRule stops future filtering; filtered items stay filtered.
message DeleteFilterRuleRequest { string rule_id = 1; }
message DeleteFilterRuleResponse {}

// RestoreFeedItem returns a filtered item to the inbox as unread, fetching
// its content when it has none; no rule filters it again.
message RestoreFeedItemRequest { string item_id = 1; }
message RestoreFeedItemResponse { Item item = 1; }

service FeedService {
  rpc ListFeeds(ListFeedsRequest) returns (ListFeedsResponse);
  rpc CreateFeed(CreateFeedRequest) returns (CreateFeedResponse);
  rpc UpdateFeed(UpdateFeedRequest) returns (UpdateFeedResponse);
  rpc DeleteFeed(DeleteFeedRequest) returns (DeleteFeedResponse);
  rpc RefreshFeed(RefreshFeedRequest) returns (RefreshFeedResponse);
  rpc ListFeedItems(ListFeedItemsRequest) returns (ListFeedItemsResponse);
  rpc GetFeedItem(GetFeedItemRequest) returns (GetFeedItemResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc GetFeedStats(GetFeedStatsRequest) returns (GetFeedStatsResponse);
  rpc GetUnhealthyFeeds(GetUnhealthyFeedsRequest)
      returns (GetUnhealthyFeedsResponse);
  rpc ListFilterRules(ListFilterRulesRequest)
      returns (ListFilterRulesResponse);
  rpc CreateFilterRule(CreateFilterRuleRequest)
      returns (CreateFilterRuleResponse);
  rpc DeleteFilterRule(DeleteFilterRuleRequest)
      returns (DeleteFilterRuleResponse);
  rpc RestoreFeedItem(RestoreFeedItemRequest)
      returns (RestoreFeedItemResponse);
}
