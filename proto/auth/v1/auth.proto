syntax = "proto3";
package auth.v1;
option go_package = "tools.xdoubleu.com/gen/auth/v1;authv1";

service AuthService {
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc MFAEnroll(MFAEnrollRequest) returns (MFAEnrollResponse);
  rpc MFAEnrollVerify(MFAEnrollVerifyRequest) returns (MFAEnrollVerifyResponse);
  rpc MFAEnrollSkip(MFAEnrollSkipRequest) returns (MFAEnrollSkipResponse);
  rpc MFAChallenge(MFAChallengeRequest) returns (MFAChallengeResponse);
  rpc MFAUnenroll(MFAUnenrollRequest) returns (MFAUnenrollResponse);
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);
  rpc SetTabPins(SetTabPinsRequest) returns (SetTabPinsResponse);
  rpc RecordAppOpen(RecordAppOpenRequest) returns (RecordAppOpenResponse);
}

message SignInRequest {
  string email = 1;
  string password = 2;
  bool remember_me = 3;
  string redirect = 4;
}

message SignInResponse {
  bool needs_mfa = 1;
  bool enroll_mfa = 2;
}

message MFAEnrollRequest {}

message MFAEnrollResponse {
  string qr_svg = 1;
  string secret = 2;
  string factor_id = 3;
}

message MFAEnrollVerifyRequest {
  string factor_id = 1;
  string code = 2;
}

message MFAEnrollVerifyResponse {
  // Set only when TOTP enrollment first completes; shown once.
  repeated string recovery_codes = 1;
}

message MFAEnrollSkipRequest {}

message MFAEnrollSkipResponse {}

message MFAUnenrollRequest {
  // A current TOTP code or an unused recovery code.
  string code = 1;
}

message MFAUnenrollResponse {}

message MFAChallengeRequest {
  string code = 1;
}

message MFAChallengeResponse {}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {}

message ExchangeTokenRequest {
  string access_token = 1;
  string refresh_token = 2;
}

message ExchangeTokenResponse {
  bool needs_mfa = 1;
}

message UpdatePasswordRequest {
  string new_password = 1;
  string current_password = 2;
}

message UpdatePasswordResponse {}

message SignOutRequest {}

message SignOutResponse {}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  string role = 1;
  repeated string app_access = 2;
  bool has_mfa = 3;
  // Public profile display name; empty when unset (required for share
  // links).
  string display_name = 4;
  // Stable user id, used as the PostHog distinct_id.
  string user_id = 5;
  // Apps pinned to the phone tab bar, in order. Only meaningful when
  // tab_pins_customised is set; otherwise the web uses its default pins.
  repeated string tab_pins = 6;
  bool tab_pins_customised = 7;
  // Apps the user opened most over the last 30 whole days, most first: the
  // default pins for someone who never chose, and "Reset to most used".
  // Empty with no history.
  repeated string suggested_pins = 8;
}

message RecordAppOpenRequest {
  string app = 1;
}

message RecordAppOpenResponse {}

message SetTabPinsRequest {
  // At most three distinct app ids the user can open; empty means no pins.
  repeated string tab_pins = 1;
}

message SetTabPinsResponse {}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

message RegenerateRecoveryCodesRequest {
  // A current TOTP code or an unused recovery code.
  string code = 1;
}

message RegenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}
