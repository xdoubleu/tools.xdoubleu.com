syntax = "proto3";
package reading.v1;
option go_package = "tools.xdoubleu.com/gen/reading/v1;readingv1";

// Feed is an RSS/Atom subscription. Its items are ingested into the library
// as regular catalog entries with category "rss".
message Feed {
  string id = 1;
  string url = 2;
  string title = 3;
  reserved 4; // was: bool kobo_sync (RSS never syncs to Kobo, #640)
  reserved "kobo_sync";
  // RFC3339; empty when the feed has never been fetched.
  string last_fetched_at = 5;
  // The most recent poll failure; empty when the last poll succeeded.
  string last_error = 6;
  string created_at = 7;
  // "rss" or "email". Email feeds (issue #595) are populated by a Resend
  // inbound-webhook push, not polling — RefreshFeed is a no-op for them.
  string source_type = 8;
  // The address to give the newsletter as its subscription address. Only
  // set once, on the CreateFeedResponse for a newly created email feed —
  // it is never persisted in plaintext, so it cannot be shown again later
  // and is never returned by ListFeeds.
  string inbound_address = 9;
}

message ListFeedsRequest {}
message ListFeedsResponse { repeated Feed feeds = 1; }

enum FeedKind {
  FEED_KIND_UNSPECIFIED = 0; // treated as RSS
  FEED_KIND_RSS = 1;
  FEED_KIND_EMAIL = 2;
}

// CreateFeed with kind RSS (the default) validates the URL by fetching and
// parsing it, then imports the feed's current contents (newest first,
// capped) as a first batch in the background — the import can take longer
// than the request, so it is not reflected in the response; poll
// ListFeeds/GetLibrary to see new items land.
//
// CreateFeed with kind EMAIL mints a per-feed inbound email alias instead
// (url must be empty); items land as mail arrives via the Resend webhook.
message CreateFeedRequest {
  string url = 1;
  reserved 2; // was: bool kobo_sync (RSS never syncs to Kobo, #640)
  reserved "kobo_sync";
  FeedKind kind = 3;
  // Optional; only used for kind=EMAIL. Ignored for RSS, whose title is
  // parsed from the feed itself.
  string title = 4;
}
message CreateFeedResponse {
  Feed feed = 1;
  reserved 2; // was: int32 ingested (import moved to the background, #430)
}

message UpdateFeedRequest {
  string feed_id = 1;
  string title = 2;
  reserved 3; // was: bool kobo_sync (RSS never syncs to Kobo, #640)
  reserved "kobo_sync";
}
message UpdateFeedResponse {}

// DeleteFeed removes the subscription and its seen-item records, and also
// removes the library items it ingested — except any the user engaged with
// (marked read or favourited), which are kept.
message DeleteFeedRequest { string feed_id = 1; }
message DeleteFeedResponse {}

// RefreshFeed polls the feed synchronously and ingests new items.
message RefreshFeedRequest { string feed_id = 1; }
message RefreshFeedResponse { int32 ingested = 1; }

// FeedItemBook links a library book to the feed it was ingested from, for
// labeling the ad hoc feed-reader view. Omitted for rss items whose feed was
// later deleted (kept because the user engaged with them).
message FeedItemBook {
  string book_id = 1;
  string feed_id = 2;
  string feed_title = 3;
}

message ListFeedItemsRequest {}
message ListFeedItemsResponse { repeated FeedItemBook items = 1; }

service FeedService {
  rpc ListFeeds(ListFeedsRequest) returns (ListFeedsResponse);
  rpc CreateFeed(CreateFeedRequest) returns (CreateFeedResponse);
  rpc UpdateFeed(UpdateFeedRequest) returns (UpdateFeedResponse);
  rpc DeleteFeed(DeleteFeedRequest) returns (DeleteFeedResponse);
  rpc RefreshFeed(RefreshFeedRequest) returns (RefreshFeedResponse);
  rpc ListFeedItems(ListFeedItemsRequest) returns (ListFeedItemsResponse);
}
