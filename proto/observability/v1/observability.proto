syntax = "proto3";
package observability.v1;
option go_package = "tools.xdoubleu.com/gen/observability/v1;observabilityv1";

service ObservabilityService {
  rpc GetJobStats(GetJobStatsRequest) returns (GetJobStatsResponse);
  rpc GetUsageStats(GetUsageStatsRequest) returns (GetUsageStatsResponse);
  rpc GetStorageStats(GetStorageStatsRequest) returns (GetStorageStatsResponse);
  rpc TriggerStorageScan(TriggerStorageScanRequest)
      returns (TriggerStorageScanResponse);
  rpc GetDatabaseStats(GetDatabaseStatsRequest)
      returns (GetDatabaseStatsResponse);
  rpc GetFailingPullRequests(GetFailingPullRequestsRequest)
      returns (GetFailingPullRequestsResponse);
  rpc GetWorkflowRuns(GetWorkflowRunsRequest) returns (GetWorkflowRunsResponse);
  rpc GetSecurityAlerts(GetSecurityAlertsRequest)
      returns (GetSecurityAlertsResponse);
  rpc DismissSecurityAlert(DismissSecurityAlertRequest)
      returns (DismissSecurityAlertResponse);
  rpc GetProjectIssuesByStatus(GetProjectIssuesByStatusRequest)
      returns (GetProjectIssuesByStatusResponse);
  rpc GetSentryIssues(GetSentryIssuesRequest) returns (GetSentryIssuesResponse);
  rpc ResolveSentryIssue(ResolveSentryIssueRequest)
      returns (ResolveSentryIssueResponse);
  rpc GetSlowTransactions(GetSlowTransactionsRequest)
      returns (GetSlowTransactionsResponse);
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
  rpc GetHealthOverview(GetHealthOverviewRequest)
      returns (GetHealthOverviewResponse);
  rpc ListOAuthConnections(ListOAuthConnectionsRequest)
      returns (ListOAuthConnectionsResponse);
  rpc DisconnectOAuthConnection(DisconnectOAuthConnectionRequest)
      returns (DisconnectOAuthConnectionResponse);
  rpc GetProviderOptions(GetProviderOptionsRequest)
      returns (GetProviderOptionsResponse);
  rpc SetProviderConfig(SetProviderConfigRequest)
      returns (SetProviderConfigResponse);
  rpc GetNotificationSettings(GetNotificationSettingsRequest)
      returns (GetNotificationSettingsResponse);
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest)
      returns (UpdateNotificationSettingsResponse);
  rpc OpenAutomatedAction(OpenAutomatedActionRequest)
      returns (OpenAutomatedActionResponse);
  rpc CloseAutomatedAction(CloseAutomatedActionRequest)
      returns (CloseAutomatedActionResponse);
  rpc GetAutomatedActions(GetAutomatedActionsRequest)
      returns (GetAutomatedActionsResponse);
}

message JobStat {
  string job_id = 1;
  int64 total_runs = 2;
  int64 failed_runs = 3;
  int64 avg_duration_ms = 4;
  string last_run_at = 5;  // RFC3339
}

message JobRun {
  string job_id = 1;
  string started_at = 2;  // RFC3339
  int64 duration_ms = 3;
  bool success = 4;
  string error = 5;
}

message GetJobStatsRequest {
  int32 window_days = 1;
}

message GetJobStatsResponse {
  repeated JobStat stats = 1;
  repeated JobRun recent_runs = 2;
}

message UsageDay {
  string day = 1;  // YYYY-MM-DD
  string app = 2;
  string endpoint = 3;
  int64 count = 4;
  // Response body bytes served; a proxy for database reads, not egress.
  int64 bytes = 5;
}

message GetUsageStatsRequest {
  int32 window_days = 1;
}

message GetUsageStatsResponse {
  repeated UsageDay entries = 1;
  // Registered apps with no usage rows in the requested window.
  repeated string unused_apps = 2;
}

message PrefixStat {
  string prefix = 1;
  int64 size_bytes = 2;
  int64 count = 3;
}

message StorageSnapshot {
  string scanned_at = 1;  // RFC3339
  int64 total_size_bytes = 2;
  int64 object_count = 3;
  int64 orphan_size_bytes = 4;
  int64 orphan_count = 5;
  int64 stale_upload_size_bytes = 6;
  int64 stale_upload_count = 7;
  repeated PrefixStat prefix_breakdown = 8;
  // Capped sample of orphaned keys; orphan_count counts all of them.
  repeated string orphan_keys = 9;
  // Orphans this scan deleted (past a grace period); a subset of
  // orphan_size_bytes/orphan_count.
  int64 deleted_orphan_size_bytes = 10;
  int64 deleted_orphan_count = 11;
}

message GetStorageStatsRequest {}

message GetStorageStatsResponse {
  StorageSnapshot latest = 1;
  repeated StorageSnapshot history = 2;
}

message TriggerStorageScanRequest {}

message TriggerStorageScanResponse {}

message SchemaStat {
  string name = 1;
  int64 size_bytes = 2;
  int64 table_count = 3;
}

message GetDatabaseStatsRequest {}

// GetDatabaseStatsResponse is a live size snapshot; history lives in Grafana.
message GetDatabaseStatsResponse {
  int64 total_size_bytes = 1;
  repeated SchemaStat schemas = 2;
}

// FailingCheck is a non-passing CI check on a pull request's head commit.
message FailingCheck {
  string name = 1;
  string conclusion = 2;  // "failure" | "timed_out" | "cancelled" | "action_required"
  string url = 3;
}

// FailingPullRequest is an open pull request with at least one failing check.
message FailingPullRequest {
  int64 number = 1;
  string title = 2;
  string url = 3;
  string author = 4;
  string updated_at = 5;  // RFC3339
  repeated FailingCheck failing_checks = 6;
}

message GetFailingPullRequestsRequest {}

// GetFailingPullRequestsResponse: configured is false without a GitHub
// token/repo (degraded, not failed).
message GetFailingPullRequestsResponse {
  repeated FailingPullRequest pull_requests = 1;
  bool configured = 2;
  int32 failing_count = 3;
}

// ProjectIssue is an open issue on a GitHub Projects (v2) board, with its
// Status value.
message ProjectIssue {
  int64 number = 1;
  string title = 2;
  string url = 3;
  string status = 4;
}

// GetProjectIssuesByStatusRequest finds issues on the owner's Projects (v2)
// board project_number whose Status matches status (case-insensitive).
message GetProjectIssuesByStatusRequest {
  int32 project_number = 1;
  string status = 2;
}

// GetProjectIssuesByStatusResponse: configured is false without a GitHub
// token/repo (degraded, not failed).
message GetProjectIssuesByStatusResponse {
  repeated ProjectIssue issues = 1;
  bool configured = 2;
}

// WorkflowRun is one GitHub Actions run from a PR or a default-branch push.
// duration_ms is zero until completed. failed_jobs is populated only for
// failed pushes to main.
message WorkflowRun {
  int64 id = 1;
  string name = 2;
  string event = 3;  // "pull_request" | "push"
  string branch = 4;
  string status = 5;
  string conclusion = 6;
  string url = 7;
  string started_at = 8;  // RFC3339
  int64 duration_ms = 9;
  repeated string failed_jobs = 10;
}

message GetWorkflowRunsRequest {}

// GetWorkflowRunsResponse carries recent PR and push runs. configured is
// false without a GitHub token/repo (degraded, not failed).
message GetWorkflowRunsResponse {
  repeated WorkflowRun runs = 1;
  bool configured = 2;
}

enum SecurityAlertType {
  SECURITY_ALERT_TYPE_UNSPECIFIED = 0;
  SECURITY_ALERT_TYPE_DEPENDABOT = 1;
  SECURITY_ALERT_TYPE_CODE_SCANNING = 2;
  SECURITY_ALERT_TYPE_SECRET_SCANNING = 3;
}

// SecurityAlert is one open alert. package_name/ecosystem are Dependabot-only,
// rule_id/file_path/line code-scanning-only, secret_type secret-scanning-only.
message SecurityAlert {
  int64 number = 1;
  string package_name = 2;
  string ecosystem = 3;
  string severity = 4;  // "low" | "medium" | "high" | "critical"
  string summary = 5;
  string url = 6;
  string created_at = 7;  // RFC3339
  SecurityAlertType alert_type = 8;
  string rule_id = 9;
  string file_path = 10;
  int32 line = 11;
  string secret_type = 12;
}

message GetSecurityAlertsRequest {}

// GetSecurityAlertsResponse: configured is false without a GitHub token/repo
// (degraded, not failed).
message GetSecurityAlertsResponse {
  repeated SecurityAlert alerts = 1;
  bool configured = 2;
  int32 alert_count = 3;
}

// SentryIssue is an unresolved issue on a configured project.
message SentryIssue {
  string id = 1;
  string title = 2;
  string culprit = 3;
  string permalink = 4;
  int64 count = 5;  // number of events
  string last_seen = 6;  // RFC3339
  string level = 7;
  string project = 8;  // which configured project this issue came from
}

// DismissSecurityAlertRequest dismisses one alert. reason must be a value
// GitHub accepts for alert_type: dependabot "fix_started"|"inaccurate"|
// "no_bandwidth"|"not_used"|"tolerable_risk"; code_scanning "false positive"|
// "won't fix"|"used in tests"; secret_scanning "false_positive"|"wont_fix"|
// "revoked"|"used_in_tests"|"pattern_deleted".
message DismissSecurityAlertRequest {
  SecurityAlertType alert_type = 1;
  int64 alert_number = 2;
  string reason = 3;
}

message DismissSecurityAlertResponse {}

message GetSentryIssuesRequest {}

// GetSentryIssuesResponse: configured is false without Sentry settings.
message GetSentryIssuesResponse {
  repeated SentryIssue issues = 1;
  bool configured = 2;
  int32 unresolved_count = 3;
}

message ResolveSentryIssueRequest {
  string issue_id = 1;
}

message ResolveSentryIssueResponse {}

// SlowTransaction is one endpoint's or page's live 24h p95 and count.
message SlowTransaction {
  string transaction = 1;
  string project = 2;
  double p95_duration_ms = 3;
  int64 request_count = 4;
}

// TransactionTrend flags a regressing p95: averages over two adjacent
// windows and the pct_change between them.
message TransactionTrend {
  string transaction = 1;
  string project = 2;
  double prior_avg_p95_ms = 3;
  double recent_avg_p95_ms = 4;
  double pct_change = 5;
}

message GetSlowTransactionsRequest {}

// GetSlowTransactionsResponse: current is live from Sentry (empty when not
// configured); trending comes from stored history regardless.
message GetSlowTransactionsResponse {
  repeated SlowTransaction current = 1;
  bool configured = 2;
  repeated TransactionTrend trending = 3;
}

// LogEntry is one application log line forwarded from api or web.
message LogEntry {
  string occurred_at = 1;  // RFC3339
  string source = 2;       // "api" | "web"
  string level = 3;
  string message = 4;
  string attrs_json = 5;  // opaque JSON, empty if there were no attrs
}

// GetLogsRequest filters global.log_entries; empty source/min_level means
// any.
message GetLogsRequest {
  string source = 1;
  string min_level = 2;
  string since = 3;  // RFC3339
}

message GetLogsResponse {
  repeated LogEntry entries = 1;
}

message GetHealthOverviewRequest {}

// GetHealthOverviewResponse rolls up external signals, each degrading
// independently.
message GetHealthOverviewResponse {
  GetSentryIssuesResponse sentry = 2;
}

message GithubConfig {
  string repo = 1;  // "owner/name"
}

message SentryConfig {
  string org = 1;
  repeated string projects = 2;
}

// ProviderConfig is the admin-picked identifier(s) for a connected provider.
message ProviderConfig {
  oneof config {
    GithubConfig github = 1;
    SentryConfig sentry = 2;
  }
}

// OAuthConnectionStatus is a provider's OAuth connection status (no token).
message OAuthConnectionStatus {
  string provider = 1;  // "github" | "sentry"
  bool connected = 2;
  string connected_by = 3;  // email, empty if not connected
  string connected_at = 4;  // RFC3339, empty if not connected
  string expires_at = 5;    // RFC3339, empty if non-expiring or not connected
  ProviderConfig config = 6;  // unset if connected but not yet configured
  // Always populated. `connected` is judged against requested_scope;
  // granted_scope is the provider's echo and may omit subsumed scopes.
  string requested_scope = 7;  // space-separated, empty if never recorded
  string granted_scope = 8;    // as returned by the provider, empty if none
  string required_scope = 9;   // space-separated, what is asked for today
}

message ListOAuthConnectionsRequest {}

message ListOAuthConnectionsResponse {
  repeated OAuthConnectionStatus connections = 1;
}

message DisconnectOAuthConnectionRequest {
  string provider = 1;
}

message DisconnectOAuthConnectionResponse {}

// GetProviderOptionsRequest lists a provider's pickable identifiers. For
// Sentry, empty sentry_org lists orgs; set lists that org's projects.
message GetProviderOptionsRequest {
  string provider = 1;
  string sentry_org = 2;
}

message GetProviderOptionsResponse {
  repeated string repos = 1;
  repeated string sentry_orgs = 2;
  repeated string sentry_projects = 3;
}

message SetProviderConfigRequest {
  string provider = 1;
  ProviderConfig config = 2;
}

message SetProviderConfigResponse {}

// NotificationSetting is one email-notifying source and whether it may
// currently email an admin.
message NotificationSetting {
  string source_key = 1;
  bool enabled = 2;
}

message GetNotificationSettingsRequest {}

message GetNotificationSettingsResponse {
  repeated NotificationSetting settings = 1;
  string admin_email = 2;
}

message UpdateNotificationSettingsRequest {
  string source_key = 1;
  bool enabled = 2;
}

message UpdateNotificationSettingsResponse {}

// AutomatedAction is one run of an out-of-process routine, recorded via
// Open/CloseAutomatedAction by the routine or its workflow. finished_at,
// outcome, pr_url, error and metrics are unset while open.
message AutomatedAction {
  int64 id = 1;
  string fired_at = 2;  // RFC3339
  string trigger_source = 3;  // "schedule" | "api" | "manual" | "ci"
  string routine_name = 4;
  string finished_at = 5;  // RFC3339, empty while open
  string outcome = 6;  // "succeeded" | "failed" | "no_action_needed", empty while open
  string pr_url = 7;
  string error = 8;
  RunMetrics metrics = 9;  // unset unless closed with metrics
}

// RunMetrics is what a routine run cost, measured from its agent transcript.
// cost_usd is the agent's estimate, not the provider's bill.
message RunMetrics {
  int32 requests = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  int64 reasoning_tokens = 4;
  int64 cache_read_tokens = 5;
  double cost_usd = 6;
  double duration_seconds = 7;
  int32 tool_calls = 8;
  int32 tool_errors = 9;
  int32 repeated_tool_calls = 10;
}

// OpenAutomatedActionRequest records that routine_name started; returns the
// row id.
message OpenAutomatedActionRequest {
  string trigger_source = 1;
  string routine_name = 2;
}

message OpenAutomatedActionResponse {
  int64 id = 1;
}

// CloseAutomatedActionRequest closes the row; pr_url, error and metrics are
// optional.
message CloseAutomatedActionRequest {
  int64 id = 1;
  string outcome = 2;
  string pr_url = 3;
  string error = 4;
  RunMetrics metrics = 5;
}

message CloseAutomatedActionResponse {}

message GetAutomatedActionsRequest {
  int32 window_days = 1;
}

message GetAutomatedActionsResponse {
  repeated AutomatedAction actions = 1;
}
