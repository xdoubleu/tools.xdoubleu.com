syntax = "proto3";
package dashboard.v1;
option go_package = "tools.xdoubleu.com/gen/dashboard/v1;dashboardv1";

// DashboardService manages the owner's public dashboard share links and
// display name. Each dashboard (games, reading) has its own independent
// share token, gating the corresponding public read-only dashboard RPCs
// (dashboard.v1.PublicGamesDashboardService,
// dashboard.v1.PublicReadingDashboardService).
service DashboardService {
  rpc GetDashboardShare(GetDashboardShareRequest) returns (GetDashboardShareResponse);
  rpc CreateDashboardShare(CreateDashboardShareRequest) returns (CreateDashboardShareResponse);
  rpc DeleteDashboardShare(DeleteDashboardShareRequest) returns (DeleteDashboardShareResponse);
  rpc SetDisplayName(SetDisplayNameRequest) returns (SetDisplayNameResponse);
}

enum DashboardKind {
  DASHBOARD_KIND_UNSPECIFIED = 0;
  DASHBOARD_KIND_GAMES = 1;
  DASHBOARD_KIND_READING = 2;
}

message DashboardShare {
  string token = 1;
  string created_at = 2;
}

message GetDashboardShareRequest { DashboardKind kind = 1; }
message GetDashboardShareResponse {
  // Unset when the user has no active share link for this dashboard.
  optional DashboardShare share = 1;
}

// CreateDashboardShare generates a new share token for the given dashboard,
// replacing any existing one for it (the old link stops working
// immediately). Fails with FailedPrecondition when the owner has not set a
// display name yet.
message CreateDashboardShareRequest { DashboardKind kind = 1; }
message CreateDashboardShareResponse { DashboardShare share = 1; }

message DeleteDashboardShareRequest { DashboardKind kind = 1; }
message DeleteDashboardShareResponse {}

message SetDisplayNameRequest { string display_name = 1; }
message SetDisplayNameResponse {}
