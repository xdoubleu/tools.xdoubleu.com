syntax = "proto3";
package dashboard.v1;
option go_package = "tools.xdoubleu.com/gen/dashboard/v1;dashboardv1";

import "books/v1/library.proto";

// PublicReadingDashboardService serves the read-only shareable reading
// dashboard — the books library plus a feeds summary (issue #737). It is
// registered WITHOUT auth middleware: requests are authorized solely by the
// opaque dashboard share token (see dashboard.v1.DashboardService), which
// resolves to the owning user. Unknown tokens return CodeNotFound.
service PublicReadingDashboardService {
  rpc GetSharedLibrary(GetSharedLibraryRequest) returns (GetSharedLibraryResponse);
  rpc GetSharedBooksProgress(GetSharedBooksProgressRequest) returns (GetSharedBooksProgressResponse);
  rpc GetSharedFeedsSummary(GetSharedFeedsSummaryRequest) returns (GetSharedFeedsSummaryResponse);
}

message GetSharedLibraryRequest { string token = 1; }
message GetSharedLibraryResponse {
  books.v1.LibraryResponse library = 1;
  // Most recent Kobo device sync (max last_seen_at); empty when the owner
  // has no Kobo devices. Kobo sync is the books equivalent of a refresh.
  string last_synced_at = 2;
  // The owner's public profile display name.
  string display_name = 3;
}

message GetSharedBooksProgressRequest {
  string token = 1;
  string date_start = 2;
  string date_end = 3;
}
message GetSharedBooksProgressResponse { books.v1.BooksProgressResponse progress = 1; }

message GetSharedFeedsSummaryRequest { string token = 1; }

// SharedFeed is a lightweight, read-only projection of one feeds.v1.Feed for
// the reading dashboard's feeds widget — just the subscription's name and
// public URL, not read state or any of feeds.v1.Feed's private fields
// (last_error, notified_at, inbound_address, ...), which are not meaningful
// to a visitor of a shared profile.
message SharedFeed {
  string title = 1;
  // Empty for feed kinds with no public URL (e.g. email).
  string url = 2;
}
message GetSharedFeedsSummaryResponse { repeated SharedFeed feeds = 1; }
