syntax = "proto3";
package dashboard.v1;
option go_package = "tools.xdoubleu.com/gen/dashboard/v1;dashboardv1";

import "books/v1/library.proto";

// PublicReadingDashboardService serves the shareable reading dashboard
// (library plus feeds) without auth; the share token alone authorizes.
// Unknown tokens are CodeNotFound.
service PublicReadingDashboardService {
  rpc GetSharedLibrary(GetSharedLibraryRequest) returns (GetSharedLibraryResponse);
  rpc GetSharedBooksProgress(GetSharedBooksProgressRequest) returns (GetSharedBooksProgressResponse);
  rpc GetSharedFeedsSummary(GetSharedFeedsSummaryRequest) returns (GetSharedFeedsSummaryResponse);
}

message GetSharedLibraryRequest { string token = 1; }
message GetSharedLibraryResponse {
  books.v1.LibraryResponse library = 1;
  // Latest Kobo device sync (the books refresh); empty with no devices.
  string last_synced_at = 2;
  // The owner's public profile display name.
  string display_name = 3;
}

message GetSharedBooksProgressRequest {
  string token = 1;
  string date_start = 2;
  string date_end = 3;
}
message GetSharedBooksProgressResponse { books.v1.BooksProgressResponse progress = 1; }

message GetSharedFeedsSummaryRequest { string token = 1; }

// SharedFeed is a feed's public name and URL, without private fields.
message SharedFeed {
  string title = 1;
  // Empty for feed kinds with no public URL (e.g. email).
  string url = 2;
}
message GetSharedFeedsSummaryResponse { repeated SharedFeed feeds = 1; }
