syntax = "proto3";
package factory.v1;
option go_package = "tools.xdoubleu.com/gen/factory/v1;factoryv1";

message AgentAccount {
  string id = 1;
  string name = 2;
  // The user the account's tokens act as; actors appear on the board as
  // "agent:<user_id>".
  string user_id = 3;
  string client_id = 4;
  string created_by = 5;
  // RFC3339.
  string created_at = 6;
  // RFC3339; empty while the account is active.
  string revoked_at = 7;
  // The apps the agent holds, and the part of them at the write level. Set by
  // ListAgentAccounts only.
  repeated string app_access = 8;
  repeated string write_access = 9;
}

message ListAgentAccountsRequest {}
message ListAgentAccountsResponse {
  repeated AgentAccount accounts = 1;
}

// totp_code is the step-up check: a current TOTP or an unused recovery code.
message CreateAgentAccountRequest {
  string name = 1;
  string totp_code = 2;
}
message CreateAgentAccountResponse {
  AgentAccount account = 1;
  // Shown once; only its hash is stored.
  string client_secret = 2;
}

// Deletes the account's client, which ends its tokens at once. The account
// stays listed as revoked.
message RevokeAgentAccountRequest {
  string id = 1;
}
message RevokeAgentAccountResponse {
  AgentAccount account = 1;
}

// Issues a new client secret. The old one keeps working for 24 hours, so the
// agent's stored credential can be swapped without downtime. totp_code is the
// same step-up as for create.
message RotateAgentAccountSecretRequest {
  string id = 1;
  string totp_code = 2;
}
message RotateAgentAccountSecretResponse {
  AgentAccount account = 1;
  // Shown once; only its hash is stored.
  string client_secret = 2;
}

// Puts the standing account in the signed-in admin's family, in place of its
// own family-of-one, so it shares what the admin's family shares (only for the
// apps it holds). It joins without an invite, since an agent can't accept one.
// totp_code is the step-up check, as for create: joining exposes family data.
message AddAgentAccountToFamilyRequest {
  string id = 1;
  string totp_code = 2;
}
message AddAgentAccountToFamilyResponse {
  AgentAccount account = 1;
}

// Takes the account out of whichever family it is in.
message RemoveAgentAccountFromFamilyRequest {
  string id = 1;
}
message RemoveAgentAccountFromFamilyResponse {
  AgentAccount account = 1;
}

service AgentAccountService {
  rpc ListAgentAccounts(ListAgentAccountsRequest) returns (ListAgentAccountsResponse);
  rpc CreateAgentAccount(CreateAgentAccountRequest) returns (CreateAgentAccountResponse);
  rpc RevokeAgentAccount(RevokeAgentAccountRequest) returns (RevokeAgentAccountResponse);
  rpc RotateAgentAccountSecret(RotateAgentAccountSecretRequest) returns (RotateAgentAccountSecretResponse);
  rpc AddAgentAccountToFamily(AddAgentAccountToFamilyRequest) returns (AddAgentAccountToFamilyResponse);
  rpc RemoveAgentAccountFromFamily(RemoveAgentAccountFromFamilyRequest) returns (RemoveAgentAccountFromFamilyResponse);
}
