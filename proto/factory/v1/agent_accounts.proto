syntax = "proto3";
package factory.v1;
option go_package = "tools.xdoubleu.com/gen/factory/v1;factoryv1";

message AgentAccount {
  string id = 1;
  string name = 2;
  // The user the account's tokens act as; actors appear on the board as
  // "agent:<user_id>".
  string user_id = 3;
  string client_id = 4;
  string created_by = 5;
  // RFC3339.
  string created_at = 6;
  // RFC3339; empty while the account is active.
  string revoked_at = 7;
}

message ListAgentAccountsRequest {}
message ListAgentAccountsResponse {
  repeated AgentAccount accounts = 1;
}

// totp_code is the step-up check: a current TOTP or an unused recovery code.
message CreateAgentAccountRequest {
  string name = 1;
  string totp_code = 2;
}
message CreateAgentAccountResponse {
  AgentAccount account = 1;
  // Shown once; only its hash is stored.
  string client_secret = 2;
}

// Deletes the account's client, which ends its tokens at once. The account
// stays listed as revoked.
message RevokeAgentAccountRequest {
  string id = 1;
}
message RevokeAgentAccountResponse {
  AgentAccount account = 1;
}

service AgentAccountService {
  rpc ListAgentAccounts(ListAgentAccountsRequest) returns (ListAgentAccountsResponse);
  rpc CreateAgentAccount(CreateAgentAccountRequest) returns (CreateAgentAccountResponse);
  rpc RevokeAgentAccount(RevokeAgentAccountRequest) returns (RevokeAgentAccountResponse);
}
