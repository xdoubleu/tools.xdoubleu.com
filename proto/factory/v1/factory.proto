syntax = "proto3";
package factory.v1;
option go_package = "tools.xdoubleu.com/gen/factory/v1;factoryv1";

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_BACKLOG = 1;
  TASK_STATUS_READY = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_IN_REVIEW = 4;
  TASK_STATUS_NEEDS_YOU = 5;
  TASK_STATUS_DONE = 6;
}

enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_P0 = 1;
  TASK_PRIORITY_P1 = 2;
  TASK_PRIORITY_P2 = 3;
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_OPENCODE = 2;
}

message Task {
  string id = 1;
  string title = 2;
  string body = 3;
  TaskStatus status = 4;
  TaskPriority priority = 5;
  repeated string labels = 6;
  // Actor that created the task, as "<kind>:<id>".
  string created_by = 7;
  // RFC3339.
  string created_at = 8;
  string updated_at = 9;
  int32 comment_count = 10;
  string repo_id = 11;
}

message Comment {
  string id = 1;
  // Actor as "<kind>:<id>".
  string author = 2;
  string body = 3;
  // RFC3339.
  string created_at = 4;
}

message ListTasksRequest {}
message ListTasksResponse {
  repeated Task tasks = 1;
}

message GetTaskRequest {
  string id = 1;
}
message GetTaskResponse {
  Task task = 1;
  repeated Comment comments = 2;
}

// New tasks always start in Backlog. The repo can't change afterwards.
message CreateTaskRequest {
  string title = 1;
  string body = 2;
  TaskPriority priority = 3;
  repeated string labels = 4;
  string repo_id = 5;
}
message CreateTaskResponse {
  Task task = 1;
}

// Replaces title, body, priority and labels; status changes go through
// MoveTask.
message UpdateTaskRequest {
  string id = 1;
  string title = 2;
  string body = 3;
  TaskPriority priority = 4;
  repeated string labels = 5;
}
message UpdateTaskResponse {
  Task task = 1;
}

// Moving into Ready needs a human admin in a browser session.
message MoveTaskRequest {
  string id = 1;
  TaskStatus status = 2;
}
message MoveTaskResponse {
  Task task = 1;
}

message AddCommentRequest {
  string task_id = 1;
  string body = 2;
}
message AddCommentResponse {
  Comment comment = 1;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
  // A running job that stopped checking in.
  JOB_STATUS_LOST = 6;
}

// One run of a harness on a task, on the runner's Mac.
message Job {
  string id = 1;
  string task_id = 2;
  JobStatus status = 3;
  // The agent/<task-id>-<slug> branch the job commits to in the Mac's clone.
  string branch = 4;
  // RFC3339.
  string created_at = 5;
}

// Queues a job for the task and moves it to In progress. A human admin in a
// browser session only: running an agent is the approval Ready stands for.
message RunTaskRequest {
  string task_id = 1;
  // Added to the prompt after the task; optional.
  string text = 2;
}
message RunTaskResponse {
  Job job = 1;
}

service TaskService {
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
}

message Repo {
  string id = 1;
  string owner = 2;
  string name = 3;
  string default_branch = 4;
  Harness default_harness = 5;
  // Free text, run in the sandbox before the agent.
  string setup_commands = 6;
  // Free text added to every prompt for this repo.
  string agent_instructions = 7;
  int32 time_limit_minutes = 8;
}

message ListReposRequest {}
message ListReposResponse {
  repeated Repo repos = 1;
}

// The id is ignored on create.
message CreateRepoRequest {
  Repo repo = 1;
}
message CreateRepoResponse {
  Repo repo = 1;
}

// Replaces every field except the id.
message UpdateRepoRequest {
  Repo repo = 1;
}
message UpdateRepoResponse {
  Repo repo = 1;
}

service RepoService {
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
}
