syntax = "proto3";
package factory.v1;
option go_package = "tools.xdoubleu.com/gen/factory/v1;factoryv1";

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_BACKLOG = 1;
  TASK_STATUS_READY = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_IN_REVIEW = 4;
  TASK_STATUS_NEEDS_YOU = 5;
  TASK_STATUS_DONE = 6;
  TASK_STATUS_TESTING = 7;
}

enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_P0 = 1;
  TASK_PRIORITY_P1 = 2;
  TASK_PRIORITY_P2 = 3;
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_OPENCODE = 2;
}

message Task {
  string id = 1;
  string title = 2;
  string body = 3;
  TaskStatus status = 4;
  TaskPriority priority = 5;
  repeated string labels = 6;
  // Actor that created the task, as "<kind>:<id>".
  string created_by = 7;
  // RFC3339.
  string created_at = 8;
  string updated_at = 9;
  int32 comment_count = 10;
  string repo_id = 11;
  // The task's open pull request, else its newest, among those its jobs opened and
  // those linking it in their body, as last read from GitHub; all empty when it
  // has none. Same values as Job.pr_*.
  string pr_url = 12;
  string pr_state = 13;
  string pr_ci = 14;
  string pr_review = 15;
  // The pull request's mergeable state; same values as PullRequest.mergeable.
  string pr_mergeable = 19;
  // Whether a human approved this Ready task's text for auto pickup: set when it
  // is moved to Ready (or saved while Ready) from a browser, so false for a Ready
  // task whose body an agent last edited. Always false outside Ready.
  bool pickup_approved = 16;
  // Why auto pickup skipped this Ready task (bad repo settings); empty when it
  // can be picked up. It stays in Ready, not "needs you", while this is set.
  string pickup_block_reason = 17;
  // Whether the merged change is live: "deployed", or "pending" while the running
  // release lacks the merge commit, "unknown" when it can't be told; empty when
  // unmerged or old.
  string deploy_state = 18;
  // Why deploy_state is "unknown" (it is then the only state with a reason).
  string deploy_reason = 20;
}

message Comment {
  string id = 1;
  // Actor as "<kind>:<id>".
  string author = 2;
  string body = 3;
  // RFC3339.
  string created_at = 4;
}

message ListTasksRequest {}
message ListTasksResponse {
  repeated Task tasks = 1;
  // Whether auto pickup is paused for the whole board.
  bool pickup_paused = 2;
  // While a job's Claude usage limit is still to lift: when (RFC3339); else empty.
  string claude_limited_until = 3;
  // Whether a job has been queued for 15 minutes with no job running.
  bool queue_stalled = 4;
}

// Pauses or resumes auto pickup for the whole board. A human admin in a browser
// session only.
message SetPickupPausedRequest {
  bool paused = 1;
}
message SetPickupPausedResponse {
  bool paused = 1;
}

message GetTaskRequest {
  string id = 1;
}
message GetTaskResponse {
  Task task = 1;
  repeated Comment comments = 2;
  // The task's jobs, newest first.
  repeated Job jobs = 3;
  // Every pull request that belongs to the task: those its jobs opened and those
  // that link it in their body. Left out by the MCP tool.
  repeated PullRequest pull_requests = 4;
}

// A pull request of a task, as the server last read it from GitHub.
message PullRequest {
  string url = 1;
  // "open", "merged" or "closed"; empty until it has been read.
  string state = 2;
  // The head commit's checks while it is open: "pending", "passing" or "failing".
  string ci = 3;
  // The standing review while it is open: "approved" or "changes_requested".
  string review = 4;
  // "conflicting" or "behind" while it is open and auto-merge is armed but it
  // can't merge; empty otherwise.
  string mergeable = 5;
}

// The repo can't change afterwards.
message CreateTaskRequest {
  string title = 1;
  string body = 2;
  TaskPriority priority = 3;
  repeated string labels = 4;
  string repo_id = 5;
  // Backlog or Ready; unspecified lets the labels decide.
  TaskStatus status = 6;
}
message CreateTaskResponse {
  Task task = 1;
}

// Replaces title, body, priority and labels; status changes go through
// MoveTask.
message UpdateTaskRequest {
  string id = 1;
  string title = 2;
  string body = 3;
  TaskPriority priority = 4;
  repeated string labels = 5;
}
message UpdateTaskResponse {
  Task task = 1;
}

// Moving into Ready is allowed for a human admin or an agent account; the actor is recorded.
message MoveTaskRequest {
  string id = 1;
  TaskStatus status = 2;
}
message MoveTaskResponse {
  Task task = 1;
}

message AddCommentRequest {
  string task_id = 1;
  string body = 2;
}
message AddCommentResponse {
  Comment comment = 1;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
  // A running job that stopped checking in.
  JOB_STATUS_LOST = 6;
}

// One run of a harness on a task, on the runner's Mac.
message Job {
  string id = 1;
  string task_id = 2;
  JobStatus status = 3;
  // The agent/<task-id>-<slug> branch the job commits to in the Mac's clone.
  string branch = 4;
  // RFC3339.
  string created_at = 5;
  // The pull request the job opened; empty if it opened none.
  string pr_url = 6;
  // Where that pull request stands, as the server last read it from GitHub:
  // "open", "merged" or "closed"; empty until it has been read.
  string pr_state = 7;
  // The head commit's checks while it is open: "pending", "passing" or "failing";
  // empty when there are none.
  string pr_ci = 8;
  // The standing review while it is open: "approved" or "changes_requested".
  string pr_review = 9;
  // What ran it, as the runner reported on claiming: the harness, and for OpenCode
  // its OpenRouter model. Unspecified and empty while the job is queued.
  Harness harness = 10;
  string model = 11;
  // The provider's usage limit stopped it; RFC3339 reset time, empty if unknown.
  bool limited = 12;
  string limit_resets_at = 13;
  // The routine a task-less job runs; empty for a task's job, which sets task_id.
  string routine = 14;
  // How the job ended, as the agent wrote it, or why it failed, was lost or was
  // stopped; empty while it runs. Truncated.
  string outcome = 15;
  // The harness and model that finished the job when it continued on the fallback
  // after the first hit its usage limit; unspecified and empty otherwise.
  Harness finished_harness = 16;
  string finished_model = 17;
}

// One event of a job's log: a line of the harness's stream-json output.
message JobEvent {
  // 1, 2, 3, … per job.
  int32 seq = 1;
  // The event's `type` ("assistant", "user", "system", "result", …) or "raw".
  string kind = 2;
  // The JSON line, credential values removed.
  string payload = 3;
  // RFC3339.
  string created_at = 4;
}

// A job's log after seq `after_seq` (0 for all), oldest first, at most 500.
// Human admin, browser session only: the log can hold code and file contents.
message ListJobEventsRequest {
  string job_id = 1;
  int32 after_seq = 2;
}
message ListJobEventsResponse {
  repeated JobEvent events = 1;
}

// A job with the tail of its log, oldest first. Returned by the MCP tool
// factory_get_job to agents with factory read access: the events have credential
// values removed but can hold code and file contents of the job's repo.
message GetJobResponse {
  Job job = 1;
  repeated JobEvent events = 2;
}

// Queues a job for the task and moves it to In progress. A human admin in a
// browser session only: running an agent is the approval Ready stands for.
message RunTaskRequest {
  string task_id = 1;
  // The Mac's config picks the harness and model.
  reserved 2, 3, 4;
  reserved "text", "harness", "model";
}
message RunTaskResponse {
  Job job = 1;
}

// Stops the task's queued or running job; the runner sees it on its next
// check-in. Human admin, browser session only, like Run.
message StopJobRequest {
  string task_id = 1;
}
message StopJobResponse {
  Job job = 1;
}

// A named job the server queues on a schedule, with no task. Only a human admin in
// a browser session changes one: enabling it is the approval for it to run.
message Routine {
  string name = 1;
  string repo_id = 2;
  bool enabled = 3;
  // Minutes between scheduled runs; 0 runs it by hand only.
  int32 interval_minutes = 4;
  // The routine's newest job; unset until it has run.
  Job last_job = 5;
}

message ListRoutinesRequest {}
message ListRoutinesResponse {
  repeated Routine routines = 1;
}

// Creates the routine or changes its repo, flag and interval.
message SaveRoutineRequest {
  string name = 1;
  string repo_id = 2;
  bool enabled = 3;
  int32 interval_minutes = 4;
}
message SaveRoutineResponse {
  Routine routine = 1;
}

// Queues a job for the routine now, even when it is disabled.
message RunRoutineRequest {
  string name = 1;
}
message RunRoutineResponse {
  Job job = 1;
}

// Stops the routine's queued or running job.
message StopRoutineRequest {
  string name = 1;
}
message StopRoutineResponse {
  Job job = 1;
}

// Deletes the routine. Its past jobs stay, with their routine name.
message DeleteRoutineRequest {
  string name = 1;
}
message DeleteRoutineResponse {}

service TaskService {
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc SetPickupPaused(SetPickupPausedRequest) returns (SetPickupPausedResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
  rpc StopJob(StopJobRequest) returns (StopJobResponse);
  rpc ListJobEvents(ListJobEventsRequest) returns (ListJobEventsResponse);
  rpc ListRoutines(ListRoutinesRequest) returns (ListRoutinesResponse);
  rpc SaveRoutine(SaveRoutineRequest) returns (SaveRoutineResponse);
  rpc RunRoutine(RunRoutineRequest) returns (RunRoutineResponse);
  rpc StopRoutine(StopRoutineRequest) returns (StopRoutineResponse);
  rpc DeleteRoutine(DeleteRoutineRequest) returns (DeleteRoutineResponse);
}

message Repo {
  // The harness and model are the runner's Mac's choice, not the repo's.
  reserved 5, 6, 7, 9;
  reserved "default_harness", "default_model", "setup_commands", "agent_instructions";
  string id = 1;
  string owner = 2;
  string name = 3;
  string default_branch = 4;
  int32 time_limit_minutes = 8;
  // Lets the runner take this repo's Ready tasks without a press of Run, as the
  // human approved them at the Ready move. Off by default.
  bool auto_pickup = 10;
  // The Sentry project slug whose issues belong to this repo, shown on
  // /monitoring; empty for none.
  string sentry_project = 11;
  // Which open PRs count as red for this repo: those with this label or whose
  // head branch starts with the prefix. Empty turns a rule off. Create and
  // update store what is sent, so a client that omits them clears both.
  string red_pr_label = 12;
  string red_pr_branch_prefix = 13;
}

message ListReposRequest {}
message ListReposResponse {
  repeated Repo repos = 1;
}

// The id is ignored on create.
message CreateRepoRequest {
  Repo repo = 1;
}
message CreateRepoResponse {
  Repo repo = 1;
}

// Replaces every field except the id.
message UpdateRepoRequest {
  Repo repo = 1;
}
message UpdateRepoResponse {
  Repo repo = 1;
}

service RepoService {
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
}

// A chat session: a person talking to a harness on one runner. Its transcript
// streams over the WebSocket at /factory/chats/{id}/ws.
message Chat {
  string id = 1;
  string repo_id = 2;
  // Empty for a chat about no task.
  string task_id = 3;
  Harness harness = 4;
  string runner_id = 5;
  // idle, working, asking, paused or stopped.
  string state = 6;
  string branch = 7;
  // What the session left behind when it stopped.
  string report = 8;
  int32 last_seq = 9;
  string created_by = 10;
  string created_at = 11;
  string updated_at = 12;
  string stopped_at = 13;
  // The person's newest message, cut short.
  string last_message = 14;
}

message StartChatRequest {
  string repo_id = 1;
  string task_id = 2;
  Harness harness = 3;
  string runner_id = 4;
}
message StartChatResponse {
  Chat chat = 1;
}

// Hands the harness a message while the chat is idle.
message SendChatMessageRequest {
  string id = 1;
  string text = 2;
}
message SendChatMessageResponse {}

// Replies to a question the harness asked. With ask_id (the seq of an `ask`
// event) it answers that question card; without, a question asked in prose.
message AnswerChatRequest {
  string id = 1;
  string text = 2;
  int32 ask_id = 3;
}
message AnswerChatResponse {}

message StopChatRequest {
  string id = 1;
  string report = 2;
  // Posted as a comment on the chat's task when it has one.
  string summary = 3;
}
message StopChatResponse {
  Chat chat = 1;
}

// Newest first.
message ListChatsRequest {
  bool active_only = 1;
}
message ListChatsResponse {
  repeated Chat chats = 1;
}

service ChatService {
  rpc StartChat(StartChatRequest) returns (StartChatResponse);
  rpc SendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse);
  rpc AnswerChat(AnswerChatRequest) returns (AnswerChatResponse);
  rpc StopChat(StopChatRequest) returns (StopChatResponse);
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
}
