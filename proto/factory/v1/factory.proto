syntax = "proto3";
package factory.v1;
option go_package = "tools.xdoubleu.com/gen/factory/v1;factoryv1";

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_BACKLOG = 1;
  TASK_STATUS_READY = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_IN_REVIEW = 4;
  TASK_STATUS_NEEDS_YOU = 5;
  TASK_STATUS_DONE = 6;
  TASK_STATUS_TESTING = 7;
}

enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_P0 = 1;
  TASK_PRIORITY_P1 = 2;
  TASK_PRIORITY_P2 = 3;
}

enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_OPENCODE = 2;
}

message Task {
  string id = 1;
  string title = 2;
  string body = 3;
  TaskStatus status = 4;
  TaskPriority priority = 5;
  repeated string labels = 6;
  // Actor that created the task, as "<kind>:<id>".
  string created_by = 7;
  // RFC3339.
  string created_at = 8;
  string updated_at = 9;
  int32 comment_count = 10;
  string repo_id = 11;
  // The task's open pull request, else its newest, among those its jobs opened and
  // those linking it in their body, as last read from GitHub; all empty when it
  // has none. Same values as Job.pr_*.
  string pr_url = 12;
  string pr_state = 13;
  string pr_ci = 14;
  string pr_review = 15;
  // The pull request's mergeable state; same values as PullRequest.mergeable.
  string pr_mergeable = 19;
  // Whether a human approved this Ready task's text for auto pickup: set when it
  // is moved to Ready (or saved while Ready) from a browser, so false for a Ready
  // task whose body an agent last edited. Always false outside Ready.
  bool pickup_approved = 16;
  // Why auto pickup skipped this Ready task (bad repo settings); empty when it
  // can be picked up. It stays in Ready, not "needs you", while this is set.
  string pickup_block_reason = 17;
  // Whether the merged change is live: "deployed", or "pending" while the running
  // release lacks the merge commit; empty when unmerged, old, or unknown.
  string deploy_state = 18;
}

message Comment {
  string id = 1;
  // Actor as "<kind>:<id>".
  string author = 2;
  string body = 3;
  // RFC3339.
  string created_at = 4;
}

message ListTasksRequest {}
message ListTasksResponse {
  repeated Task tasks = 1;
  // Whether auto pickup is paused for the whole board.
  bool pickup_paused = 2;
  // While a job's Claude usage limit is still to lift: when (RFC3339); else empty.
  string claude_limited_until = 3;
}

// Pauses or resumes auto pickup for the whole board. A human admin in a browser
// session only.
message SetPickupPausedRequest {
  bool paused = 1;
}
message SetPickupPausedResponse {
  bool paused = 1;
}

message GetTaskRequest {
  string id = 1;
}
message GetTaskResponse {
  Task task = 1;
  repeated Comment comments = 2;
  // The task's jobs, newest first. Left out by the MCP tool.
  repeated Job jobs = 3;
  // Every pull request that belongs to the task: those its jobs opened and those
  // that link it in their body. Left out by the MCP tool.
  repeated PullRequest pull_requests = 4;
}

// A pull request of a task, as the server last read it from GitHub.
message PullRequest {
  string url = 1;
  // "open", "merged" or "closed"; empty until it has been read.
  string state = 2;
  // The head commit's checks while it is open: "pending", "passing" or "failing".
  string ci = 3;
  // The standing review while it is open: "approved" or "changes_requested".
  string review = 4;
  // "conflicting" or "behind" while it is open and auto-merge is armed but it
  // can't merge; empty otherwise.
  string mergeable = 5;
}

// New tasks always start in Backlog. The repo can't change afterwards.
message CreateTaskRequest {
  string title = 1;
  string body = 2;
  TaskPriority priority = 3;
  repeated string labels = 4;
  string repo_id = 5;
}
message CreateTaskResponse {
  Task task = 1;
}

// Replaces title, body, priority and labels; status changes go through
// MoveTask.
message UpdateTaskRequest {
  string id = 1;
  string title = 2;
  string body = 3;
  TaskPriority priority = 4;
  repeated string labels = 5;
}
message UpdateTaskResponse {
  Task task = 1;
}

// Moving into Ready needs a human admin in a browser session.
message MoveTaskRequest {
  string id = 1;
  TaskStatus status = 2;
}
message MoveTaskResponse {
  Task task = 1;
}

message AddCommentRequest {
  string task_id = 1;
  string body = 2;
}
message AddCommentResponse {
  Comment comment = 1;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
  // A running job that stopped checking in.
  JOB_STATUS_LOST = 6;
}

// One run of a harness on a task, on the runner's Mac.
message Job {
  string id = 1;
  string task_id = 2;
  JobStatus status = 3;
  // The agent/<task-id>-<slug> branch the job commits to in the Mac's clone.
  string branch = 4;
  // RFC3339.
  string created_at = 5;
  // The pull request the job opened; empty if it opened none.
  string pr_url = 6;
  // Where that pull request stands, as the server last read it from GitHub:
  // "open", "merged" or "closed"; empty until it has been read.
  string pr_state = 7;
  // The head commit's checks while it is open: "pending", "passing" or "failing";
  // empty when there are none.
  string pr_ci = 8;
  // The standing review while it is open: "approved" or "changes_requested".
  string pr_review = 9;
  // What ran it: the harness, and for OpenCode its OpenRouter model.
  Harness harness = 10;
  string model = 11;
  // The provider's usage limit stopped it; RFC3339 reset time, empty if unknown.
  bool limited = 12;
  string limit_resets_at = 13;
}

// One event of a job's log: a line of the harness's stream-json output.
message JobEvent {
  // 1, 2, 3, … per job.
  int32 seq = 1;
  // The event's `type` ("assistant", "user", "system", "result", …) or "raw".
  string kind = 2;
  // The JSON line, credential values removed.
  string payload = 3;
  // RFC3339.
  string created_at = 4;
}

// A job's log after seq `after_seq` (0 for all), oldest first, at most 500.
// Human admin, browser session only: the log can hold code and file contents.
message ListJobEventsRequest {
  string job_id = 1;
  int32 after_seq = 2;
}
message ListJobEventsResponse {
  repeated JobEvent events = 1;
}

// Queues a job for the task and moves it to In progress. A human admin in a
// browser session only: running an agent is the approval Ready stands for.
message RunTaskRequest {
  string task_id = 1;
  // Added to the prompt after the task; optional.
  string text = 2;
  // Overrides the repo's default harness for this job; unspecified keeps it.
  Harness harness = 3;
  // The OpenRouter model for an OpenCode job; empty uses the repo's default.
  string model = 4;
}
message RunTaskResponse {
  Job job = 1;
}

message ReplyTaskRequest {
  string task_id = 1;
  // The follow-up prompt for the task's last job's session; required.
  string text = 2;
}
message ReplyTaskResponse {
  Job job = 1;
}

// Stops the task's queued or running job; the runner sees it on its next
// check-in. Human admin, browser session only, like Run.
message StopJobRequest {
  string task_id = 1;
}
message StopJobResponse {
  Job job = 1;
}

service TaskService {
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc SetPickupPaused(SetPickupPausedRequest) returns (SetPickupPausedResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
  rpc ReplyTask(ReplyTaskRequest) returns (ReplyTaskResponse);
  rpc StopJob(StopJobRequest) returns (StopJobResponse);
  rpc ListJobEvents(ListJobEventsRequest) returns (ListJobEventsResponse);
}

message Repo {
  string id = 1;
  string owner = 2;
  string name = 3;
  string default_branch = 4;
  Harness default_harness = 5;
  // Free text, run in the sandbox before the agent.
  string setup_commands = 6;
  // Free text added to every prompt for this repo.
  string agent_instructions = 7;
  int32 time_limit_minutes = 8;
  // The OpenRouter model OpenCode runs on, "vendor/model"; required when the
  // default harness is OpenCode, empty for Claude Code.
  string default_model = 9;
  // Lets the runner take this repo's Ready tasks without a press of Run, as the
  // human approved them at the Ready move. Off by default.
  bool auto_pickup = 10;
}

message ListReposRequest {}
message ListReposResponse {
  repeated Repo repos = 1;
}

// The id is ignored on create.
message CreateRepoRequest {
  Repo repo = 1;
}
message CreateRepoResponse {
  Repo repo = 1;
}

// Replaces every field except the id.
message UpdateRepoRequest {
  Repo repo = 1;
}
message UpdateRepoResponse {
  Repo repo = 1;
}

// The OpenRouter models OpenCode jobs can run on, for a picker. A call from a
// client with no fetched list gets an empty response.
message ListOpenRouterModelsRequest {}
message ListOpenRouterModelsResponse {
  // Model ids, "vendor/model", sorted.
  repeated string model_ids = 1;
}

service RepoService {
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  rpc ListOpenRouterModels(ListOpenRouterModelsRequest)
      returns (ListOpenRouterModelsResponse);
}
