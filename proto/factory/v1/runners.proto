syntax = "proto3";
package factory.v1;
option go_package = "tools.xdoubleu.com/gen/factory/v1;factoryv1";

import "factory/v1/factory.proto";

message Runner {
  string id = 1;
  string name = 2;
  // RFC3339; empty until the runner has paired.
  string paired_at = 3;
  // RFC3339; empty until the first heartbeat.
  string last_seen = 4;
  string version = 5;
  // RFC3339; empty while the runner is active.
  string revoked_at = 6;
  // RFC3339; set while the pairing code is still valid.
  string pairing_expires_at = 7;
  // Paired, not revoked, and heard from recently.
  bool online = 8;
}

message ListRunnersRequest {}
message ListRunnersResponse {
  repeated Runner runners = 1;
}

// Only one runner can be active at a time: revoke the current one first.
// totp_code is the step-up check: a current TOTP or an unused recovery code.
message CreateRunnerRequest {
  string name = 1;
  string totp_code = 2;
}
message CreateRunnerResponse {
  Runner runner = 1;
  // Single use, valid for ten minutes, shown once; only its hash is stored.
  string pairing_code = 2;
}

// Ends a runner's device token at once. It stays listed as revoked.
message RevokeRunnerRequest {
  string id = 1;
}
message RevokeRunnerResponse {
  Runner runner = 1;
}

// Admin side of pairing, behind the browser session.
service RunnerAdminService {
  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse);
  rpc CreateRunner(CreateRunnerRequest) returns (CreateRunnerResponse);
  rpc RevokeRunner(RevokeRunnerRequest) returns (RevokeRunnerResponse);
}

message PairRequest {
  string code = 1;
  string version = 2;
}
message PairResponse {
  // Sent as a bearer token on every later call; shown once, only its hash is
  // stored.
  string device_token = 1;
  string runner_name = 2;
}

message HeartbeatRequest {
  string version = 1;
}
message HeartbeatResponse {}

// What the runner needs to run one job. The prompt is the frozen task part; the
// runner adds its own preamble, and validates repo, branch and base itself.
message ClaimedJob {
  string id = 1;
  string task_id = 2;
  string repo_owner = 3;
  string repo_name = 4;
  string default_branch = 5;
  Harness harness = 6;
  string prompt = 7;
  string branch = 8;
  // Free text, run in the sandbox before the agent.
  string setup_commands = 9;
  int32 time_limit_minutes = 10;
}

message ClaimJobRequest {}
message ClaimJobResponse {
  // Unset when no job was queued within the hold.
  ClaimedJob job = 1;
}

message CheckInRequest {
  string job_id = 1;
  // The harness's session id once it has one.
  string session_id = 2;
}
message CheckInResponse {
  // True when the job is no longer running (lost or cancelled): stop it.
  bool stop = 1;
}

message CompleteJobRequest {
  string job_id = 1;
  bool succeeded = 2;
  // What the agent wrote, or why it failed. Posted on the task as a comment.
  string outcome = 3;
  string session_id = 4;
}
message CompleteJobResponse {}

// The runner's own calls. Pair is authenticated by the pairing code, the rest
// by the device token; none takes a cookie or MCP token, and nothing here
// reaches TaskService.
service RunnerService {
  rpc Pair(PairRequest) returns (PairResponse);
  // Held open for up to 20 seconds, then answered; the runner calls again.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Held open for up to 20 seconds waiting for the oldest queued job.
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  // Every 30 seconds while a job runs; 5 minutes of silence marks it lost.
  rpc CheckIn(CheckInRequest) returns (CheckInResponse);
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse);
}
