syntax = "proto3";
package podcasts.v1;
option go_package = "tools.xdoubleu.com/gen/podcasts/v1;podcastsv1";

message SearchResult {
  // iTunes collection ID.
  int64 itunes_id = 1;
  string title = 2;
  string author = 3;
  string artwork_url = 4;
  // Already in the caller's favourites.
  bool favourite = 5;
}

message Favourite {
  string id = 1;
  int64 itunes_id = 2;
  string title = 3;
  string author = 4;
  string artwork_url = 5;
  string apple_url = 6;
  // RFC3339.
  string added_at = 7;
  // The last feed fetch's error; empty when it succeeded or hasn't run.
  string fetch_error = 8;
}

message SearchShowsRequest {
  string query = 1;
}
message SearchShowsResponse {
  repeated SearchResult results = 1;
}

message ListFavouritesRequest {}
message ListFavouritesResponse {
  repeated Favourite favourites = 1;
}

// Adding an already-favourite show returns the existing favourite.
message AddFavouriteRequest {
  int64 itunes_id = 1;
}
message AddFavouriteResponse {
  Favourite favourite = 1;
}

message RemoveFavouriteRequest {
  string id = 1;
}
message RemoveFavouriteResponse {}

message Episode {
  string id = 1;
  string show_id = 2;
  string show_title = 3;
  // The show's artwork and Apple Podcasts page.
  string artwork_url = 4;
  string apple_url = 5;
  string title = 6;
  // Plain text, shortened.
  string summary = 7;
  string link = 8;
  string audio_url = 9;
  optional int32 duration_seconds = 10;
  // RFC3339; empty when the feed gave no date.
  string published_at = 11;
}

// An empty show_id lists the episodes of every favourite, newest first.
message ListEpisodesRequest {
  string show_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListEpisodesResponse {
  repeated Episode episodes = 1;
  bool has_more = 2;
}

service PodcastsService {
  rpc SearchShows(SearchShowsRequest) returns (SearchShowsResponse);
  rpc ListFavourites(ListFavouritesRequest) returns (ListFavouritesResponse);
  rpc AddFavourite(AddFavouriteRequest) returns (AddFavouriteResponse);
  rpc RemoveFavourite(RemoveFavouriteRequest) returns (RemoveFavouriteResponse);
  rpc ListEpisodes(ListEpisodesRequest) returns (ListEpisodesResponse);
}
