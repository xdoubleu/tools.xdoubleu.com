syntax = "proto3";
package movies.v1;
option go_package = "tools.xdoubleu.com/gen/movies/v1;moviesv1";

// media_type is "movie" or "series"; status is "want", "watching",
// "watched" or "dropped".

message SearchResult {
  string media_type = 1;
  int64 tmdb_id = 2;
  string title = 3;
  string original_title = 4;
  // YYYY-MM-DD; empty when TMDB has no date.
  string release_date = 5;
  string poster_path = 6;
  // The caller's status when the title is already in their backlog.
  optional string status = 7;
}

message BacklogEntry {
  string id = 1;
  string media_type = 2;
  int64 tmdb_id = 3;
  string title = 4;
  string original_title = 5;
  string release_date = 6;
  string poster_path = 7;
  repeated string genres = 8;
  // Minutes; movies only.
  optional int32 runtime = 9;
  // Series only.
  optional int32 season_count = 10;
  string status = 11;
  // RFC3339; an empty string is a watch with an unknown date.
  repeated string watched_at = 12;
  string added_at = 13;
  string updated_at = 14;
  // 1-5 stars; unset when unrated.
  optional int32 rating = 15;
  // A watched series with an aired season not yet ticked.
  bool has_new_season = 16;
}

message GetStatsRequest {}
message MonthWatches {
  // YYYY-MM, in Europe/Brussels.
  string month = 1;
  int32 movies = 2;
  int32 seasons = 3;
}
message GenreCount {
  string genre = 1;
  int32 count = 2;
}
// A title counts as watched once it has any watch: a movie watch, or a
// ticked season (specials excluded).
message GetStatsResponse {
  // This month and the 11 before it, oldest first; dated watches only,
  // rewatches included.
  repeated MonthWatches months = 1;
  // Top 10 across watched titles, each title once.
  repeated GenreCount genres = 2;
  // Rated titles per star; index 0 is 1 star.
  repeated int32 ratings = 3;
  int32 movies_watched = 4;
  // Series whose status is watched.
  int32 series_watched = 5;
  int32 seasons_watched = 6;
}

message SearchTitlesRequest { string query = 1; }
message SearchTitlesResponse { repeated SearchResult results = 1; }

message AddTitleRequest {
  string media_type = 1;
  int64 tmdb_id = 2;
  // "want" or "watched".
  string status = 3;
  // Date new watches unknown instead of now: the movie's, or each aired
  // season's when a series is added as watched.
  bool unknown_date = 4;
}
message AddTitleResponse { BacklogEntry entry = 1; }

message SetStatusRequest {
  string id = 1;
  string status = 2;
  // As AddTitleRequest.unknown_date; "watched" on a series ticks its aired
  // seasons.
  bool unknown_date = 3;
}
message SetStatusResponse { BacklogEntry entry = 1; }

message SetRatingRequest {
  string id = 1;
  // 1-5 stars; unset clears the rating.
  optional int32 rating = 2;
}
message SetRatingResponse { BacklogEntry entry = 1; }

message RemoveTitleRequest { string id = 1; }
message RemoveTitleResponse {}

message ListBacklogRequest {
  // Empty means every status.
  string status = 1;
  // Empty means both media types.
  string media_type = 2;
  // "added" (default, newest first), "title", "release" (newest first) or
  // "rating" (highest first, unrated last).
  string sort = 3;
  int32 limit = 4;
  int32 offset = 5;
  // Only entries with has_new_season.
  bool new_season = 6;
}
message ListBacklogResponse {
  repeated BacklogEntry entries = 1;
  bool has_more = 2;
}

// A series season; number 0 is TMDB's "Specials", which never counts toward
// the series status.
message Season {
  int32 number = 1;
  string name = 2;
  // YYYY-MM-DD; empty when TMDB has no date.
  string air_date = 3;
  int32 episode_count = 4;
  // RFC3339; an empty string is a watch with an unknown date. Ticked when
  // non-empty.
  repeated string watched_at = 5;
  bool aired = 6;
}

message GetTitleRequest { string id = 1; }
message GetTitleResponse {
  BacklogEntry entry = 1;
  string overview = 2;
  // Series only, in season order.
  repeated Season seasons = 3;
}

// Ticking adds one watch (now, or unknown); unticking clears the season's
// watches. Either re-derives the series status unless it is dropped.
message SetSeasonWatchedRequest {
  string id = 1;
  int32 season_number = 2;
  bool watched = 3;
  bool unknown_date = 4;
}
message SetSeasonWatchedResponse {
  BacklogEntry entry = 1;
  repeated Season seasons = 2;
}

// Watch-date edits target the entry's own watches (movies) or, with
// season_number set, a season's. date is YYYY-MM-DD; empty means unknown.
message AddWatchDateRequest {
  string id = 1;
  optional int32 season_number = 2;
  string date = 3;
}
message AddWatchDateResponse {
  BacklogEntry entry = 1;
  repeated Season seasons = 2;
}

message EditWatchDateRequest {
  string id = 1;
  optional int32 season_number = 2;
  int32 index = 3;
  string date = 4;
}
message EditWatchDateResponse {
  BacklogEntry entry = 1;
  repeated Season seasons = 2;
}

message RemoveWatchDateRequest {
  string id = 1;
  optional int32 season_number = 2;
  int32 index = 3;
}
message RemoveWatchDateResponse {
  BacklogEntry entry = 1;
  repeated Season seasons = 2;
}

service MoviesService {
  rpc SearchTitles(SearchTitlesRequest) returns (SearchTitlesResponse);
  rpc AddTitle(AddTitleRequest) returns (AddTitleResponse);
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);
  rpc SetRating(SetRatingRequest) returns (SetRatingResponse);
  rpc RemoveTitle(RemoveTitleRequest) returns (RemoveTitleResponse);
  rpc ListBacklog(ListBacklogRequest) returns (ListBacklogResponse);
  rpc GetTitle(GetTitleRequest) returns (GetTitleResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc SetSeasonWatched(SetSeasonWatchedRequest) returns (SetSeasonWatchedResponse);
  rpc AddWatchDate(AddWatchDateRequest) returns (AddWatchDateResponse);
  rpc EditWatchDate(EditWatchDateRequest) returns (EditWatchDateResponse);
  rpc RemoveWatchDate(RemoveWatchDateRequest) returns (RemoveWatchDateResponse);
}
