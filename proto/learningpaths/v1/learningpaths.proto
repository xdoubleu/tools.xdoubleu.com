syntax = "proto3";
package learningpaths.v1;
option go_package = "tools.xdoubleu.com/gen/learningpaths/v1;learningpathsv1";

// LearningPath is a nested tree (path -> modules -> items), not recipes'
// parallel-array shape; Create/Update round-trip the whole tree in one call.

message Item {
  string id = 1;
  string module_id = 2;
  // Freeform (e.g. "read", "study", "do", "checkpoint").
  string type = 3;
  string description = 4;
  int32 sort_order = 5;
  // completed is ignored for book-linked items — it is derived on read from
  // the linked book at 100% progress.
  bool completed = 6;
  // When set, the item is book-linked: completion derives from the book's
  // progress and the manual toggle is hidden. Read-only resolved state is in
  // linked_book.
  optional string linked_book_id = 7;
  // linked_book is the resolved state of a book-linked item, set on read when
  // it still resolves; ignored on Create/Update.
  LinkedBook linked_book = 8;
  // external_book links a book not yet in the caller's library: on
  // Create/Update it is added to the "To Learn" shelf (an owned book keeps its
  // shelf) and becomes linked_book_id. Ignored when linked_book_id is set;
  // never returned.
  ExternalBookRef external_book = 9;
  // due is the item's Todoist due string (e.g. "every day at 20:00"), used
  // for its reminder task; empty leaves the task undated.
  string due = 10;
}

// ExternalBookRef is a books external search result (provider, provider_id).
message ExternalBookRef {
  string provider = 1;
  string provider_id = 2;
}

// QuizQuestion is one multiple-choice item in a module's quiz. One quiz per
// module; the terminal checkpoint item carries it (see the authoring guide).
message QuizQuestion {
  string prompt = 1;
  repeated string options = 2;
  int32 correct_answer_index = 3;
}

message Module {
  string id = 1;
  string learning_path_id = 2;
  string title = 3;
  int32 sort_order = 4;
  repeated Item items = 5;
  // Quiz carried by the module's terminal checkpoint item.
  repeated QuizQuestion quiz = 6;
}

// LinkedBook is the read-only resolved state of a resource's linked books
// entry, set on reads when it still resolves; ignored on Create/Update.
message LinkedBook {
  string title = 1;
  string status = 2;
  int32 progress_percent = 3;
  string cover_url = 4;
}

// LinkedFeedItem is the feeds counterpart to LinkedBook.
message LinkedFeedItem {
  string title = 1;
  string source_url = 2;
  bool read = 3;
  bool bookmarked = 4;
}

// Resource is freeform text, optionally linked to a books entry or feeds
// item via linked_book_id/linked_feed_item_id; text then acts as a caption.
message Resource {
  string id = 1;
  string learning_path_id = 2;
  string text = 3;
  int32 sort_order = 4;
  optional string linked_book_id = 5;
  optional string linked_feed_item_id = 6;
  LinkedBook linked_book = 7;
  LinkedFeedItem linked_feed_item = 8;
}

message LearningPath {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string goal = 4;
  // Freeform recurring routine (e.g. "30 min every weekday morning").
  string routine = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated Module modules = 8;
  repeated Resource resources = 9;
  // reminder_schedules maps an item type (e.g. "read") to the Todoist due
  // string (e.g. "every day at 20:00") of its reminder tasks; an item's own
  // due overrides it.
  map<string, string> reminder_schedules = 10;
  // paused stops the path's Todoist reminders. Read-only: set it with
  // SetLearningPathPaused.
  bool paused = 11;
}

message ListLearningPathsRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListLearningPathsResponse {
  repeated LearningPath learning_paths = 1;
  bool has_more = 2;
}

message GetLearningPathRequest {
  string id = 1;
}
message GetLearningPathResponse {
  LearningPath learning_path = 1;
}

message CreateLearningPathRequest {
  string title = 1;
  string goal = 2;
  string routine = 3;
  repeated Module modules = 4;
  repeated Resource resources = 5;
  map<string, string> reminder_schedules = 6;
}
message CreateLearningPathResponse {
  LearningPath learning_path = 1;
}

message UpdateLearningPathRequest {
  string id = 1;
  string title = 2;
  string goal = 3;
  string routine = 4;
  repeated Module modules = 5;
  repeated Resource resources = 6;
  map<string, string> reminder_schedules = 7;
}
message UpdateLearningPathResponse {
  LearningPath learning_path = 1;
}

message DeleteLearningPathRequest {
  string id = 1;
}
message DeleteLearningPathResponse {}

// RecordItemProgress toggles one item's completion without resending the
// tree.
message RecordItemProgressRequest {
  string item_id = 1;
  bool completed = 2;
}
message RecordItemProgressResponse {}

// SetLearningPathPaused pausing deletes the path's Todoist tasks, and resuming
// recreates the active module's tasks.
message SetLearningPathPausedRequest {
  string id = 1;
  bool paused = 2;
}
message SetLearningPathPausedResponse {
  LearningPath learning_path = 1;
}

// ModuleProgress is one module's completion count.
message ModuleProgress {
  string id = 1;
  string title = 2;
  int32 total_items = 3;
  int32 completed_items = 4;
}

message GetLearningPathProgressRequest {
  string id = 1;
}

// GetLearningPathProgressResponse reports server-derived completion counts,
// overall and per module.
message GetLearningPathProgressResponse {
  string learning_path_id = 1;
  string title = 2;
  int32 total_items = 3;
  int32 completed_items = 4;
  repeated ModuleProgress modules = 5;
}

service LearningPathsService {
  rpc ListLearningPaths(ListLearningPathsRequest) returns (ListLearningPathsResponse);
  rpc GetLearningPath(GetLearningPathRequest) returns (GetLearningPathResponse);
  rpc CreateLearningPath(CreateLearningPathRequest) returns (CreateLearningPathResponse);
  rpc UpdateLearningPath(UpdateLearningPathRequest) returns (UpdateLearningPathResponse);
  rpc DeleteLearningPath(DeleteLearningPathRequest) returns (DeleteLearningPathResponse);
  rpc RecordItemProgress(RecordItemProgressRequest) returns (RecordItemProgressResponse);
  rpc SetLearningPathPaused(SetLearningPathPausedRequest) returns (SetLearningPathPausedResponse);
  rpc GetLearningPathProgress(GetLearningPathProgressRequest) returns (GetLearningPathProgressResponse);
}

// TodoistService connects a user's own Todoist account and sends single
// items to it as tasks, one-way (completing a task never flips `completed`).
message ConnectTodoistRequest {}
message ConnectTodoistResponse {
  // Where to send the browser to start Todoist's OAuth2 flow; the callback
  // is a plain HTTP route (routes.go).
  string authorize_url = 1;
}

message DisconnectTodoistRequest {}
message DisconnectTodoistResponse {}

message GetTodoistConnectionStatusRequest {}
message GetTodoistConnectionStatusResponse {
  bool connected = 1;
  // connected_at is RFC3339, empty when not connected.
  string connected_at = 2;
  // needs_reconnect: connected, but authorized with fewer scopes than
  // reminders need; reminders are paused until the user reconnects.
  bool needs_reconnect = 3;
}

message GetTodoistSyncStateRequest {
  string learning_path_id = 1;
}

// TodoistItemState is one item's reminder state.
message TodoistItemState {
  string item_id = 1;
  string description = 2;
  string due = 3;
  bool completed = 4;
  // todoist_task_id is empty when the item has no task.
  string todoist_task_id = 5;
}

// GetTodoistSyncStateResponse is a path's Todoist state as stored, without
// calling Todoist: items of the active module plus any other item with a task.
message GetTodoistSyncStateResponse {
  bool connected = 1;
  bool needs_reconnect = 2;
  string requested_scope = 3;
  // todoist_project_id is empty until the first successful sync.
  string todoist_project_id = 4;
  // active_module is empty when every module is complete or the path is
  // paused.
  string active_module = 5;
  repeated TodoistItemState items = 6;
  bool paused = 7;
}

service TodoistService {
  rpc ConnectTodoist(ConnectTodoistRequest) returns (ConnectTodoistResponse);
  rpc DisconnectTodoist(DisconnectTodoistRequest) returns (DisconnectTodoistResponse);
  rpc GetTodoistConnectionStatus(GetTodoistConnectionStatusRequest) returns (GetTodoistConnectionStatusResponse);
  rpc GetTodoistSyncState(GetTodoistSyncStateRequest) returns (GetTodoistSyncStateResponse);
}
