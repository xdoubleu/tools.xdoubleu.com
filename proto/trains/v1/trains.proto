syntax = "proto3";
package trains.v1;
option go_package = "tools.xdoubleu.com/gen/trains/v1;trainsv1";

// Leg is one boarded train, board to alight. trip_id churns daily and is
// never exposed; trip_short_name/route_short_name identify the train.
message Leg {
  string trip_short_name = 1;
  string route_short_name = 2;
  string headsign = 3;
  string board_stop_id = 4;
  string board_stop_name = 5;
  string board_platform = 6;
  string board_time = 7;
  string alight_stop_id = 8;
  string alight_stop_name = 9;
  string alight_platform = 10;
  string alight_time = 11;
}

// Journey is one ordered itinerary from origin to destination.
message Journey {
  repeated Leg legs = 1;
  string departure_time = 2;
  string arrival_time = 3;
  int32 transfers = 4;
  // Opaque, stateless id decodable into GetJourneyDetailRequest; never a raw
  // trip_id.
  string journey_id = 5;
}

// Alert is a decoded GTFS-RT service alert attached to a leg of a journey.
message Alert {
  string id = 1;
  string header_text = 2;
  string description_text = 3;
}

// StopCall is one stop's scheduled and live state on a journey detail leg.
message StopCall {
  string stop_id = 1;
  string stop_name = 2;
  string platform = 3;
  // RFC3339, empty at the leg's origin stop.
  string scheduled_arrival = 4;
  // RFC3339, empty at the leg's terminus stop.
  string scheduled_departure = 5;
  // "on_time", "delayed", "unknown", "skipped" or "cancelled".
  // "unknown" must never be rendered as "on_time".
  string status = 6;
  // Only meaningful when status is "delayed"; seconds, positive = late.
  int32 delay_seconds = 7;
  bool is_board_stop = 8;
  bool is_alight_stop = 9;
}

// LegDetail is one boarded train's live state: every stop from board to
// alight, plus alerts.
message LegDetail {
  string trip_short_name = 1;
  string route_short_name = 2;
  string headsign = 3;
  // Whole-trip cancellation, unlike a StopCall's "skipped".
  bool cancelled = 4;
  repeated StopCall stops = 5;
  repeated Alert alerts = 6;
}

// JourneyAlternative is a re-plan from the next reachable station at its live
// time, surfaced only on a positive realtime signal that the journey broke
// (missed connection, cancellation, skipped stop, or arrival slipping too
// far); never on missing live data.
message JourneyAlternative {
  // Passenger-facing reason, e.g. "You'll miss the 17:42 at Mechelen by 4 min".
  string reason = 1;
  // Name of the station the alternative departs from.
  string from_stop_name = 2;
  // The re-planned itinerary; unset when none was found (reason still
  // applies).
  Journey journey = 3;
}

// JourneyDetail is the live state of a searched journey, kept fresh over a
// websocket.
message JourneyDetail {
  string journey_id = 1;
  repeated LegDetail legs = 2;
  string departure_time = 3;
  string arrival_time = 4;
  // Set only when realtime data shows the planned journey is broken.
  JourneyAlternative alternative = 5;
}

message GetJourneyDetailRequest {
  string journey_id = 1;
}

message GetJourneyDetailResponse {
  JourneyDetail journey = 1;
}

message SearchJourneysRequest {
  // A station (all its platforms) or a specific platform.
  string origin_stop_id = 1;
  string destination_stop_id = 2;
  // RFC3339; a departure time unless arrive_by is set.
  string time = 3;
  bool arrive_by = 4;
}

message SearchJourneysResponse {
  // Pareto set over (arrival, transfers) for a window around the time.
  repeated Journey journeys = 1;
}

// Station is a location_type=1 stop, never a platform.
message Station {
  string stop_id = 1;
  string name_nl = 2;
  string name_fr = 3;
  string name_en = 4;
  // The canonical label: every known full-language name, deduped and joined.
  string display_name = 5;
}

message SearchStationsRequest {
  // Case-insensitive substring match on any language's name; empty returns
  // an alphabetical page.
  string query = 1;
}

message SearchStationsResponse {
  repeated Station stations = 1;
}

message GetFeedInfoRequest {}

message GetFeedInfoResponse {
  // Empty when the static feed has never been imported yet.
  string feed_version = 1;
  // RFC3339 time of the import that produced the stored feed; empty if none.
  // The only signal of timetable staleness, since unchanged feeds no-op.
  string imported_at = 2;
  // How much of translations.txt was applied; distinguishes missing,
  // unmatched and monolingual translations.
  TranslationCoverage translations = 3;
}

// TranslationCoverage reports what an import made of translations.txt.
message TranslationCoverage {
  // Stops named from translations.txt rather than the primary stop_name.
  int32 translated_stops_nl = 1;
  int32 translated_stops_fr = 2;
  int32 translated_stops_en = 3;
  // Usable stop_name rows read; 0 when the file is absent.
  int32 rows = 4;
  // Rows identifying a stop this feed's stops.txt does not contain.
  int32 rows_unmatched = 5;
}

// SavedCommute is a user's named station pair for one-tap searches. Stations
// are keyed by S-prefixed UIC parent-station id, never a trip_id.
message SavedCommute {
  string id = 1;
  string label = 2;
  Station origin = 3;
  Station destination = 4;
  // Ascending sort order within the signed-in user's list.
  int32 position = 5;
}

message ListSavedCommutesRequest {}

message ListSavedCommutesResponse {
  repeated SavedCommute saved_commutes = 1;
}

message CreateSavedCommuteRequest {
  string label = 1;
  string origin_stop_id = 2;
  string destination_stop_id = 3;
}

message CreateSavedCommuteResponse {
  SavedCommute saved_commute = 1;
}

message UpdateSavedCommuteRequest {
  string id = 1;
  string label = 2;
  int32 position = 3;
}

message UpdateSavedCommuteResponse {
  SavedCommute saved_commute = 1;
}

message DeleteSavedCommuteRequest {
  string id = 1;
}

message DeleteSavedCommuteResponse {}

service TrainService {
  rpc SearchJourneys(SearchJourneysRequest) returns (SearchJourneysResponse);
  rpc SearchStations(SearchStationsRequest) returns (SearchStationsResponse);
  rpc GetFeedInfo(GetFeedInfoRequest) returns (GetFeedInfoResponse);
  // GetJourneyDetail fetches a searched journey's live state and ensures its
  // /trains/api/journeys/live websocket topic exists.
  rpc GetJourneyDetail(GetJourneyDetailRequest) returns (GetJourneyDetailResponse);
  // Saved-commute CRUD, scoped to the signed-in user.
  rpc ListSavedCommutes(ListSavedCommutesRequest) returns (ListSavedCommutesResponse);
  rpc CreateSavedCommute(CreateSavedCommuteRequest) returns (CreateSavedCommuteResponse);
  rpc UpdateSavedCommute(UpdateSavedCommuteRequest) returns (UpdateSavedCommuteResponse);
  rpc DeleteSavedCommute(DeleteSavedCommuteRequest) returns (DeleteSavedCommuteResponse);
}
