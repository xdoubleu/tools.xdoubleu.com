# Prometheus alerting rules (issue #1468), replacing the host/CI/storage
# rules `internal/observability/jobs/threshold_alert.go` used to hand-roll
# against DB-stored samples. Grafana is configured (via its own contact
# point, config/deploy.grafana.yml's GF_SMTP_* env — see docs/adr-00XX) to
# alert off these same Prometheus rules, so the rule definitions live here,
# diffable and PR-reviewed, same spirit as the old typed Go slice but in
# Prometheus's own native format.
#
# Thresholds/sustain windows mirror the removed Go rules exactly:
#   host_cpu_high / host_memory_high: 80%/85%, sustained 15m (`for: 15m`)
#   host_disk_high: 85%, instant (no `for:`, matching instantHostMetricEvaluator)
#
# NOT reimplemented here (see the ADR's "what got removed" section):
#   - r2_usage_high: R2 storage usage lives only in Postgres
#     (global.storage_snapshots, written by apps/books' own scan job) —
#     Prometheus has no exporter for it. GetStorageStats/OrphanedStorageCard
#     on /monitoring still surface it, just without a threshold alert.
#   - ci_duration_high / failing_main_ci: GitHub Actions run data isn't
#     scraped by Prometheus at all (no exporter). GetWorkflowRuns/
#     WorkflowRunsCard and GetFailingPullRequests on /monitoring still
#     surface CI health live from the GitHub API.
#
# Deployed by mounting this file into the Prometheus container
# (infra/prometheus-compose.yml) and referencing it from
# infra/prometheus.yml's `rule_files:`.
groups:
  - name: host
    rules:
      - alert: HostCPUHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage above 80% for 15 minutes"
          description: "{{ $value | printf \"%.1f\" }}% CPU usage on {{ $labels.instance }}."

      - alert: HostMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 85% for 15 minutes"
          description: "{{ $value | printf \"%.1f\" }}% memory usage on {{ $labels.instance }}."

      - alert: HostDiskHigh
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        labels:
          severity: critical
        annotations:
          summary: "Host disk usage above 85%"
          description: "{{ $value | printf \"%.1f\" }}% disk usage on {{ $labels.instance }} ({{ $labels.mountpoint }})."

  - name: api
    rules:
      - alert: APIDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "api's /metrics endpoint is unreachable"
          description: "Prometheus has failed to scrape api for 2 minutes."

  - name: postgres
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "postgres_exporter is unreachable"
          description: "Prometheus has failed to scrape postgres_exporter for 2 minutes — this may mean Postgres itself is down."
