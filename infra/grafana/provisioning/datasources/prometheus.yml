# Grafana datasource provisioning, baked into the image by
# infra/grafana.Dockerfile at the default /etc/grafana/provisioning path.
#
# Prometheus has no published port (infra/prometheus-compose.yml); Grafana
# reaches it by service name on the shared `kamal` network, same URL as
# api/cmd/api/mcp_prom_query.go.
apiVersion: 1

datasources:
  - name: Prometheus
    # Referenced by uid (not name) from every dashboard JSON so a rename
    # here never breaks a panel.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches infra/prometheus.yml's scrape_interval.
      timeInterval: 30s
