# GitHub + Sentry datasources (plugins installed via GF_INSTALL_PLUGINS in
# infra/grafana.Dockerfile), baked into the image like prometheus.yml. Only
# the Sentry signal is queried from here; the GitHub datasource is for ad-hoc
# use, its signals stay Prometheus gauges.
#
# Tokens come from Kamal env.secret (config/deploy.grafana.yml) via $__env{}.
# scripts/verify_grafana_image.sh exports dummy values so provisioning loads
# in CI (datasource health checks are lazy).
apiVersion: 1

datasources:
  # Referenced by uid (not name) from the sentry/overview dashboards and the
  # service-health alert group, so a rename here never breaks a panel.
  - name: GitHub
    uid: github
    type: grafana-github-datasource
    access: proxy
    editable: false
    jsonData:
      selectedAuthType: personal-access-token
    secureJsonData:
      accessToken: $__env{GRAFANA_GITHUB_DATASOURCE_TOKEN}

  - name: Sentry
    uid: sentry
    type: grafana-sentry-datasource
    access: proxy
    editable: false
    jsonData:
      url: https://sentry.io
      orgSlug: xdoubleu
    secureJsonData:
      authToken: $__env{GRAFANA_SENTRY_DATASOURCE_TOKEN}
