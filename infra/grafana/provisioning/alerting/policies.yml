# Grafana notification policy (issue #1528, moved to Slack in #1592) — a
# single flat policy routing every alert to the one 'slack' contact point.
# There is deliberately no per-severity routing tree: this is a one-admin
# deployment, and the alert's own severity label plus its summary carry
# that signal in the Slack message.
apiVersion: 1

policies:
  - orgId: 1
    receiver: slack
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
