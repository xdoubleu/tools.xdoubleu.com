# Grafana notification policy. Only notify=slack alerts (outage-class, see
# rules.yml) post to Slack. The rest are muted around the clock and surface
# in the nightly sweep: muting only stops delivery, get_grafana_alerts still
# sees them firing.
apiVersion: 1

muteTimes:
  - orgId: 1
    name: always
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'

policies:
  - orgId: 1
    receiver: slack
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: slack
        matchers:
          - notify = slack
      - receiver: slack
        matchers:
          - notify != slack
        mute_time_intervals:
          - always
