# Grafana notification policy. Every alert reaches the top-level 'slack'
# receiver (one-admin deployment; no per-severity routing tree).
#
# Exception: trigger=immediate alerts (bug/security-class, see rules.yml) ALSO
# fire the "routine-fire" webhook. The first child route's continue:true is
# what delivers them to BOTH contact points. CI/dependency-class problems are
# deliberately not in this group.
apiVersion: 1

policies:
  - orgId: 1
    receiver: slack
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: slack
        matchers:
          - trigger = immediate
        continue: true
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      - receiver: routine-fire
        matchers:
          - trigger = immediate
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
