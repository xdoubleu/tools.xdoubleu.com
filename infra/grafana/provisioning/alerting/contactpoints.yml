# Grafana alerting contact point (issue #1528, moved to Slack in #1592).
# Grafana — not Prometheus — evaluates and routes every alert now;
# Prometheus only collects. Alerts post to a Slack Incoming Webhook whose
# URL is $__env{GRAFANA_SLACK_WEBHOOK_URL} — $__env{} interpolation in a
# provisioning file works with any env var name, not just GF_-prefixed ones.
# scripts/verify_grafana_image.sh exports a dummy value for that env so
# provisioning loads cleanly in CI.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-alerts
        type: slack
        settings:
          url: $__env{GRAFANA_SLACK_WEBHOOK_URL}
