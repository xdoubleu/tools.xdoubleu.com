# Grafana alerting contact points. Grafana evaluates and routes every alert;
# Prometheus only collects. $__env{} here accepts any env var name, not just
# GF_-prefixed ones; scripts/verify_grafana_image.sh exports a dummy value so
# provisioning loads in CI.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-alerts
        type: slack
        settings:
          url: $__env{GRAFANA_SLACK_WEBHOOK_URL}
