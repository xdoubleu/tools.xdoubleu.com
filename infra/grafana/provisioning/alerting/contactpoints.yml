# Grafana alerting contact point (issue #1528). Grafana — not Prometheus —
# evaluates and routes every alert now; Prometheus only collects. This
# reuses Grafana's own SMTP client (the GF_SMTP_* env in
# config/deploy.grafana.yml, itself the Resend account api's mailer uses),
# so no new mail credential is introduced. Alerts are mailed TO
# $__env{NOTIFY_EMAIL_TO} — the admin recipient api's own mailer uses for
# its notification emails (api/internal/config, cfg.NotifyEmailTo) — while
# GF_SMTP_FROM_ADDRESS (the EMAIL_FROM repo secret) stays the sender/from
# address. $__env{} interpolation in a provisioning file works with any env
# var name, not just GF_-prefixed ones. scripts/verify_grafana_image.sh
# exports a dummy value for that env so provisioning loads cleanly in CI.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email-admin
        type: email
        settings:
          addresses: $__env{NOTIFY_EMAIL_TO}
          singleEmail: true
