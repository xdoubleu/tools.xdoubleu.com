# Grafana-managed alert rules (issue #1528). Grafana evaluates and routes
# every alert now — Prometheus only collects. This file replaces the old
# infra/prometheus/alert-rules.yml, whose rules fired into Prometheus's
# ALERTS{} series and were delivered nowhere (no Alertmanager was ever
# wired). All rules route to the single 'email' contact point via the
# default notification policy (policies.yml).
#
# Each rule keeps its threshold inside the PromQL query (refId A, instant)
# and uses a trivial "> 0" threshold expression (refId C) as the alerting
# condition: A returns a 1-valued series only while the condition holds and
# an empty result otherwise, so noDataState=OK means "not breaching".
#
# Thresholds / sustain windows for the migrated host+up rules mirror the
# removed Prometheus rules exactly. The three p95 rules are new and read the
# histograms added in this same issue:
#   http_request_duration_seconds  (api/internal/middleware/metrics.go)
#   job_duration_seconds           (api/internal/observability/trackedjob.go)
#   web_vitals_seconds             (web/lib/server/metrics.ts)
#
# The service-health group (issue #1540) reads the gauges the issue-signal
# collector exports (api/internal/observability/jobs/issue_signal_collector.go,
# #1539): github_failing_pull_requests, github_workflow_run_failed{branch},
# github_open_security_alerts{severity}, sentry_unresolved_issues,
# r2_orphaned_objects, r2_storage_bytes. This closed the r2_usage_high and
# failing_main_ci gaps. IssueSentryUnresolved briefly queried the Sentry API
# directly through the grafana-sentry-datasource plugin instead of a gauge
# (issue #1570) — reverted in #1726 once that turned out to never evaluate
# (no Grafana SSE expression can consume the Sentry Issues endpoint's
# wide-series response); the plugin/datasource itself stays provisioned for
# the read-only panel on the sentry dashboard.
# AutomatedActionStalled (issue #1443) reads
# automated_action_oldest_open_age_seconds, also exported by the issue-signal
# collector: the age of the longest-open global.automated_actions row, 0 when
# none are open. Its 3-hour threshold is well above any run duration observed
# in #1438's spike (routines complete in minutes) but still same-day — the
# self-healing routines this catches run a few times a day in batches, so a
# multi-hour gap with one left open is already abnormal. AutomatedRoutineMissed
# (issue #1723) is the complementary check: it reads
# automated_action_seconds_since_last_open{routine}, one series per known
# routine (issue_signal_collector.go's knownRoutines), and catches a routine
# whose claude.ai scheduled trigger never fired at all — no
# automated_actions row is ever opened in that case, so
# AutomatedActionStalled (which only ever looks at an opened-but-unclosed
# row) can't see it.
#
# Still NOT reimplemented: ci_duration_high — Prometheus has no exporter for
# workflow durations. /monitoring still surfaces it live from its own source.
apiVersion: 1

groups:
  - orgId: 1
    name: host
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      - uid: host-cpu-high
        title: HostCPUHigh
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage above 80% for 15 minutes
          description: "{{ $values.A }}% CPU usage on the VPS."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: host-memory-high
        title: HostMemoryHigh
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host memory usage above 85% for 15 minutes
          description: "{{ $values.A }}% memory usage on the VPS."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: host-disk-high
        title: HostDiskHigh
        condition: C
        labels:
          severity: critical
        annotations:
          summary: Host disk usage above 85%
          description: "{{ $values.A }}% disk usage on the VPS."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: availability
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      # One multi-dimensional rule covering every scrape target, replacing the
      # per-job APIDown/PostgresDown rules (issue #1554). `up == 0` returns one
      # series per failing target, so Grafana raises a separate alert instance
      # per job/instance and a new scrape target is covered the moment it is
      # added — no rule to remember to write.
      #
      # noDataState is OK here, unlike every other rule in this file: an empty
      # result means no target is down, which is the healthy case. Alerting on
      # NoData would page continuously whenever everything is fine.
      - uid: target-down
        title: TargetDown
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
          description: >-
            Target {{ $labels.instance }} (job {{ $labels.job }}) has failed to
            scrape for 2 minutes.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # TargetDown above cannot catch a target that does not exist at all: a
      # job whose service discovery yields nothing produces no `up` series, so
      # `up == 0` matches nothing and stays silent. That is precisely the shape
      # of the bug in #1554 — api and web were never scraped for months and the
      # only reason anything could have noticed was that the old static_configs
      # still created a (failing) target.
      #
      # With docker_sd_configs there is no such consolation prize: a bad label,
      # a renamed network, or an unreadable Docker socket all yield zero
      # targets and total silence. absent() is the guard — it returns a series
      # exactly when its argument has none.
      - uid: target-missing
        title: TargetMissing
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No scrape target exists for {{ $labels.job }}"
          description: >-
            Prometheus has discovered no target at all for job
            {{ $labels.job }}. Service discovery is broken (infra/prometheus.yml
            docker_sd_configs), not merely the target — check that the Kamal
            container carries its `service` label, is on the `kamal` network,
            and that Prometheus can read the Docker socket.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: absent(up{job="api"}) or absent(up{job="web"}) or absent(up{job="grafana"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: latency
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      - uid: request-p95-high
        title: RequestP95High
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API request p95 latency above 5s
          description: "p95 request latency is {{ $values.A }}s over the last 10m."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[10m]))) > 5
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: job-p95-high
        title: JobP95High
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Background job p95 duration above 60s
          description: "p95 job duration is {{ $values.A }}s over the last 30m."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(job_duration_seconds_bucket[30m]))) > 60
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: frontend-p95-high
        title: FrontendP95High
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Frontend TTFB p95 above 5s
          description: "p95 browser TTFB is {{ $values.A }}s over the last 30m."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(web_vitals_seconds_bucket{metric="TTFB"}[30m]))) > 5
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: service-health
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      - uid: issue-failing-prs
        title: IssueFailingPRs
        condition: C
        labels:
          severity: warning
        annotations:
          summary: One or more open pull requests have failing CI
          description: "{{ $values.A }} open pull request(s) with failing checks."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: github_failing_pull_requests > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Reads sentry_unresolved_issues, a Prometheus gauge
      # IssueSignalCollectorJob populates from sentryapi.Client.
      # ListUnresolvedIssues (issue #1726) — the same shape as every other
      # rule in this group. This rule previously (issue #1570) queried the
      # Sentry API directly through the grafana-sentry-datasource plugin's
      # "issues" queryType, to avoid staleness from the gauge's poll
      # interval; that never actually evaluated. The Sentry Issues endpoint
      # returns one row per issue with several numeric columns (Count,
      # UserCount, ...) — a "wide series" — and Grafana's SSE engine fails
      # converting that response for *any* downstream expression with
      # "input data must be a wide series but got type long"
      # (grafana/sentry-datasource#266, filed 2024, still unresolved
      # upstream) before the expression itself (reduce, threshold, or
      # classic_conditions — all three were tried, across #1608 and #1703)
      # ever runs. The `sentry` datasource/plugin stays provisioned for the
      # read-only table panel on the sentry dashboard, where "wide series"
      # is not a constraint — only alert *evaluation* hits it.
      - uid: issue-sentry-unresolved
        title: IssueSentryUnresolved
        condition: C
        labels:
          severity: warning
          # Routes to the "routine-fire" contact point too (policies.yml,
          # issue #1444) — a bug-class alert can trigger a self-healing
          # routine immediately, rather than waiting on a human to notice
          # the Slack message.
          trigger: immediate
        annotations:
          summary: Unresolved Sentry issues present
          description: "{{ $values.A }} unresolved Sentry issue(s)."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sentry_unresolved_issues > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: issue-security-alerts
        title: IssueSecurityAlerts
        condition: C
        labels:
          severity: critical
          # See issue-sentry-unresolved's trigger label comment above.
          trigger: immediate
        annotations:
          summary: Open security alerts present
          description: "{{ $values.A }} open security alert(s) across all severities."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(github_open_security_alerts) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: issue-main-ci-red
        title: IssueMainCIRed
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: CI on the main branch is failing
          description: "{{ $values.A }} failed workflow run(s) on main."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(github_workflow_run_failed{branch="main"}) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: issue-orphaned-storage
        title: IssueOrphanedStorage
        condition: C
        labels:
          severity: warning
        annotations:
          summary: Orphaned R2 objects present
          description: "{{ $values.A }} orphaned object(s) in R2 storage."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: r2_orphaned_objects > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: r2-usage-high
        title: R2UsageHigh
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: R2 storage usage above 9 GiB
          description: "R2 storage is {{ $values.A }} bytes, above the 9 GiB (9663676416) budget; R2 free tier is 10 GB."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: r2_storage_bytes > 9663676416
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: automated-action-stalled
        title: AutomatedActionStalled
        condition: C
        labels:
          severity: critical
          # See issue-sentry-unresolved's trigger label comment above — a
          # stalled self-healing routine is itself a bug, and could itself be
          # the nightly sweep, so this can't wait on a human noticing Slack.
          trigger: immediate
        annotations:
          summary: An automated routine fired and never closed out
          description: "The oldest open global.automated_actions row is {{ $values.A }}s old, above the 3h stall threshold."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: automated_action_oldest_open_age_seconds > 10800
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # All three known routines (nightly-maintenance-sweep,
      # ready-issues-executor, red-pr-repair; docs/spec-routine-*.md) run
      # once daily, so one shared 27-hour threshold covers all of them — 3h
      # of buffer past the 24h cadence, mirroring AutomatedActionStalled's
      # own buffer reasoning above. api has no visibility into claude.ai's
      # own schedule, so this threshold (like the routine list itself, in
      # issue_signal_collector.go's knownRoutines) is hardcoded and must be
      # updated by hand if a routine's cadence ever changes or a routine is
      # added/removed.
      - uid: automated-routine-missed
        title: AutomatedRoutineMissed
        condition: C
        labels:
          severity: critical
          # See automated-action-stalled's trigger label comment above — a
          # routine that silently never started could itself be the nightly
          # sweep that would otherwise have caught this.
          trigger: immediate
        annotations:
          summary: A scheduled routine has not opened a run in over 27 hours
          description: >-
            {{ $labels.routine }} last opened a global.automated_actions row
            {{ $values.A }}s ago, above the 27h threshold — its claude.ai
            scheduled trigger may never have fired.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: automated_action_seconds_since_last_open > 97200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
