# Grafana-managed alert rules, routed by policies.yml.
#
# Each rule keeps its threshold inside the PromQL query (refId A, instant)
# and uses a trivial "> 0" threshold expression (refId C) as the alerting
# condition: A returns a 1-valued series only while the condition holds and
# an empty result otherwise, so noDataState=OK means "not breaching".
#
# p95 rules read http_request_duration_seconds (api/internal/middleware/metrics.go),
# job_duration_seconds (api/internal/observability/trackedjob.go) and
# web_vitals_seconds (web/lib/server/metrics.ts). The service-health group
# reads gauges exported by api/internal/observability/jobs/issue_signal_collector.go.
#
# AutomatedActionStalled's 3h threshold: routines finish in minutes, so a
# multi-hour open row is abnormal. AutomatedRoutineMissed catches a routine
# that never fired at all (no row is opened, so Stalled can't see it).
#
# Not covered: ci_duration_high (no Prometheus exporter for workflow
# durations); /monitoring surfaces it from its own source.
apiVersion: 1

groups:
  - orgId: 1
    name: host
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      - uid: host-cpu-high
        title: HostCPUHigh
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage above 80% for 15 minutes
          description: "{{ $values.A }}% CPU usage on the VPS."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: host-memory-high
        title: HostMemoryHigh
        condition: C
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Host memory usage above 85% for 15 minutes
          description: "{{ $values.A }}% memory usage on the VPS."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: host-disk-high
        title: HostDiskHigh
        condition: C
        labels:
          severity: critical
          # Outage-class: posts to Slack (policies.yml). Unlabelled rules
          # only surface in the nightly sweep.
          notify: slack
        annotations:
          summary: Host disk usage above 85%
          description: "{{ $values.A }}% disk usage on the VPS."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: availability
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      # `up == 0` yields one alert instance per failing target, so new scrape
      # targets are covered automatically. noDataState is OK because an empty
      # result is the healthy case.
      - uid: target-down
        title: TargetDown
        condition: C
        for: 2m
        labels:
          severity: critical
          notify: slack
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }}"
          description: >-
            Target {{ $labels.instance }} (job {{ $labels.job }}) has failed to
            scrape for 2 minutes.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # TargetDown can't see a job whose docker_sd_configs discovery yields no
      # targets (bad label, renamed network, unreadable socket): there is no
      # `up` series at all. absent() returns a series exactly then.
      - uid: target-missing
        title: TargetMissing
        condition: C
        for: 5m
        labels:
          severity: critical
          notify: slack
        annotations:
          summary: "No scrape target exists for {{ $labels.job }}"
          description: >-
            Prometheus has discovered no target at all for job
            {{ $labels.job }}. Service discovery is broken (infra/prometheus.yml
            docker_sd_configs), not merely the target — check that the Kamal
            container carries its `service` label, is on the `kamal` network,
            and that Prometheus can read the Docker socket.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: absent(up{job="api"}) or absent(up{job="web"}) or absent(up{job="grafana"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: latency
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      - uid: request-p95-high
        title: RequestP95High
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API request p95 latency above 5s
          description: "p95 request latency is {{ $values.A }}s over the last 10m."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[10m]))) > 5
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: job-p95-high
        title: JobP95High
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Background job p95 duration above 60s
          description: "p95 job duration is {{ $values.A }}s over the last 30m."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(job_duration_seconds_bucket[30m]))) > 60
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: frontend-p95-high
        title: FrontendP95High
        condition: C
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Frontend TTFB p95 above 5s
          description: "p95 browser TTFB is {{ $values.A }}s over the last 30m."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: histogram_quantile(0.95, sum by (le) (rate(web_vitals_seconds_bucket{metric="TTFB"}[30m]))) > 5
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: service-health
    folder: tools.xdoubleu.com
    interval: 1m
    rules:
      - uid: issue-failing-prs
        title: IssueFailingPRs
        condition: C
        labels:
          severity: warning
        annotations:
          summary: One or more open pull requests have failing CI
          description: "{{ $values.A }} open pull request(s) with failing checks."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: github_failing_pull_requests > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # Uses the sentry_unresolved_issues gauge, not the sentry-datasource
      # plugin: its "issues" queryType returns long-format rows that Grafana's
      # SSE layer can't alert on ("input data must be a wide series",
      # grafana/sentry-datasource#266).
      - uid: issue-sentry-unresolved
        title: IssueSentryUnresolved
        condition: C
        labels:
          severity: warning
        annotations:
          summary: Unresolved Sentry issues present
          description: "{{ $values.A }} unresolved Sentry issue(s)."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sentry_unresolved_issues > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: issue-security-alerts
        title: IssueSecurityAlerts
        condition: C
        labels:
          severity: critical
        annotations:
          summary: Open security alerts present
          description: "{{ $values.A }} open security alert(s) across all severities."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(github_open_security_alerts) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: issue-main-ci-red
        title: IssueMainCIRed
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: CI on the main branch is failing
          description: "{{ $values.A }} failed workflow run(s) on main."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: max(github_workflow_run_failed{branch="main"}) > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: issue-orphaned-storage
        title: IssueOrphanedStorage
        condition: C
        labels:
          severity: warning
        annotations:
          summary: Orphaned R2 objects present
          description: "{{ $values.A }} orphaned object(s) in R2 storage."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: r2_orphaned_objects > 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: r2-usage-high
        title: R2UsageHigh
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: R2 storage usage above 9 GiB
          description: "R2 storage is {{ $values.A }} bytes, above the 9 GiB (9663676416) budget; R2 free tier is 10 GB."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: r2_storage_bytes > 9663676416
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: automated-action-stalled
        title: AutomatedActionStalled
        condition: C
        labels:
          severity: critical
          notify: slack
        annotations:
          summary: An automated routine fired and never closed out
          description: "The oldest open global.automated_actions row is {{ $values.A }}s old, above the 3h stall threshold."
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: automated_action_oldest_open_age_seconds > 10800
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # 27h = daily cadence + 3h buffer. Hardcoded, like knownRoutines in
      # issue_signal_collector.go: update both by hand if a routine's cadence
      # changes or a routine is added/removed.
      - uid: automated-routine-missed
        title: AutomatedRoutineMissed
        condition: C
        labels:
          severity: critical
          notify: slack
        annotations:
          summary: A scheduled routine has not opened a run in over 27 hours
          description: >-
            {{ $labels.routine }} last opened a global.automated_actions row
            {{ $values.A }}s ago, above the 27h threshold — its scheduled
            routine workflow may not have run.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: automated_action_seconds_since_last_open > 97200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
