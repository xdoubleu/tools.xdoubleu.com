# Grafana dashboard provider (issue #1527). The dashboard JSON in
# infra/grafana/dashboards/ is the single source of truth: allowUiUpdates is
# false, so an admin editing a panel in the Grafana UI cannot save over the
# provisioned copy — changes are made to the JSON and redeployed (matches
# this repo's "the code is the spec" rule in CLAUDE.md). Grafana is
# admin-only (docs/adr-0021), so there is no non-admin edit path to worry
# about either.
apiVersion: 1

providers:
  - name: tools-xdoubleu-com
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
