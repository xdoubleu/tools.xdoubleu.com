# Grafana dashboard provider. The JSON in infra/grafana/dashboards/ is the
# single source of truth: allowUiUpdates is false, so UI edits can't save over
# it — change the JSON and redeploy.
apiVersion: 1

providers:
  - name: tools-xdoubleu-com
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
