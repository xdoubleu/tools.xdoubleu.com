services:
  prometheus:
    # Internal `kamal` network only, no host port; Grafana and the api's
    # prom_query tool reach it at prometheus:9090.
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    # Runs as `nobody`; needs the host's docker gid (passed in by
    # prometheus-setup.sh) to read the socket for docker_sd_configs.
    group_add:
      - "${DOCKER_GID}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Sized for a single VPS with ~3GB free.
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Bearer token for the `web` scrape job (written by infra/main.tf).
      - ./web_ingest_secret:/etc/prometheus/web_ingest_secret:ro
      - prometheus_data:/prometheus
      # For docker_sd_configs. Socket access is effectively host root; acceptable
      # only while Prometheus has no host port, sits on the internal network, and
      # the VPS is single-tenant. Otherwise add a socket proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kamal

  postgres-exporter:
    # Server-level Postgres stats.
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    env_file: .env
    networks:
      # Reaches `postgres:5432` over the shared network.
      - kamal

networks:
  # Pre-created (infra/README.md); external because Kamal also uses it.
  kamal:
    external: true

volumes:
  prometheus_data:
