# Probe modules for prometheus.yml's blackbox-* jobs.
modules:
  # Straight to the VPS with SNI/Host of the public name. The Cloudflare Origin
  # CA certificate isn't publicly trusted, so verification is off; expiry
  # (probe_ssl_earliest_cert_expiry) and handshake failures are still reported.
  origin:
    prober: http
    timeout: 10s
    http:
      method: GET
      headers:
        Host: tools.xdoubleu.com
      fail_if_not_ssl: true
      tls_config:
        server_name: tools.xdoubleu.com
        insecure_skip_verify: true
  # Through Cloudflare, as users see it. IPv4 only: the kamal network has no
  # IPv6, so a Cloudflare AAAA answer made the probe fail in ~2ms (status 0)
  # while the site was up. The origin probe targets an IPv4 literal.
  edge:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_not_ssl: true
