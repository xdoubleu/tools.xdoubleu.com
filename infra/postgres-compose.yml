services:
  postgres:
    # supabase/postgres, not vanilla postgres: a full dump of the Supabase-
    # managed source DB references Supabase-specific extensions/roles
    # (pgsodium, pgjwt, pgcrypto, pg_net, etc.) that only this image ships.
    # This must stay pinned to the source Supabase project's actual
    # Postgres version (Dashboard → Settings → Infrastructure) — a mismatch
    # here isn't cosmetic: the image bootstraps its own auth/storage/
    # realtime schemas on first start, and an older/newer build has a
    # different column set than the live dump expects, which breaks COPY
    # mid-restore (issue #1031, confirmed the hard way against a real
    # restore attempt with the wrong tag).
    image: supabase/postgres:17.6.1.063
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only — never exposed publicly. Reach it via an SSH tunnel
      # (see infra/README.md) for debugging, or via this compose network
      # once the app is deployed here (future sub-issue).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
