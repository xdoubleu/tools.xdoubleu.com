services:
  postgres:
    # Vanilla postgres: supabase/postgres bootstraps schemas that collide with a
    # restored dump, and its `postgres` role isn't a real superuser.
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    restart: unless-stopped
    # Well above shared_buffers (128 MiB) + max_connections × work_mem
    # (100 × 4 MiB); a cgroup OOM resets every connection.
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    ports:
      # Loopback only; use an SSH tunnel (infra/README.md).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
      # Lets Kamal containers reach `postgres:5432` without a 0.0.0.0 bind
      # (which would bypass ufw).
      - kamal

volumes:
  postgres_data:

networks:
  default: {}
  # Pre-created (infra/README.md); external because Kamal also uses it.
  kamal:
    external: true
