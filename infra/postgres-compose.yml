services:
  postgres:
    # Vanilla postgres, not supabase/postgres (issue #1031): the
    # Supabase-managed image bootstraps its own generic auth/storage/
    # realtime schemas on first start, which collide with — and don't
    # match the column set of — a real dump restored from a live Supabase
    # project (that image's baseline is a starter schema, not a live
    # mirror of any project's actual migration history, and its `postgres`
    # role isn't a real superuser, blocking DROP SCHEMA/ownership fixes
    # too). Confirmed the hard way across several failed restore attempts.
    # A handful of Supabase-specific extension objects (pgsodium/vault
    # encryption, pg_net webhooks, some realtime internals) are lost, but
    # none of that matters until GoTrue/Storage/Realtime actually run
    # against this DB — a separate future sub-issue, which should use
    # Supabase's own self-hosting stack rather than this image anyway.
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only — never exposed publicly. Reach it via an SSH tunnel
      # (see infra/README.md) for debugging.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
      # Shared with the Kamal-deployed app (issue #1033) so it can reach
      # Postgres by container name (`postgres:5432`) instead of a host port
      # — loopback-only binding above means a container on a different
      # Docker network can't reach it at all, and widening the port bind to
      # 0.0.0.0 would risk bypassing ufw (Docker manipulates iptables
      # directly). See infra/README.md's "Deploy the app via Kamal" section
      # for the one-time `docker network create kamal` step this depends on.
      - kamal

  # Self-hosted GoTrue (issue #1032), pointed at the restored `auth` schema
  # above via the compose network hostname `postgres` (not 127.0.0.1) —
  # GOTRUE_DB_DATABASE_URL/GOTRUE_JWT_SECRET/GOTRUE_SMTP_PASS live in .env.
  gotrue:
    image: supabase/gotrue:v2.195.0
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    ports:
      # Loopback only, same convention as Postgres — reach it via an SSH
      # tunnel (see infra/README.md) for the sign-in smoke test.
      - "127.0.0.1:9999:9999"
    environment:
      # GOTRUE_SITE_URL/GOTRUE_SMTP_ADMIN_EMAIL come from .env (env_file
      # above), as does the required API_EXTERNAL_URL — deliberately bare,
      # no GOTRUE_ prefix: GoTrue's envconfig nesting derives GOTRUE_API as
      # the struct prefix, and the field's own envconfig:"API_EXTERNAL_URL"
      # tag gets appended to that verbatim, so GOTRUE_API_EXTERNAL_URL is
      # never read — matches the official supabase/supabase self-hosting
      # compose file. Currently == GOTRUE_SITE_URL since GoTrue isn't
      # proxied publicly yet.
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      # Required for sign-in against migrated rows: GoTrue filters its user
      # lookup by aud, which has no default (empty string) unless set here.
      # Every migrated auth.users row has aud='authenticated' (Supabase's
      # standard convention, confirmed against the restored data) — without
      # this, the lookup query matches zero rows and GoTrue reports a
      # generic "Invalid login credentials" regardless of a correct password.
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_SMTP_HOST: smtp.resend.com
      GOTRUE_SMTP_PORT: "465"
      GOTRUE_SMTP_USER: resend
    networks:
      - default
      # Same reasoning as postgres's `kamal` network entry above.
      - kamal

volumes:
  postgres_data:

networks:
  default: {}
  # Pre-created once via `docker network create kamal` (see
  # infra/README.md) — declared external here since Kamal itself also
  # creates/uses this network for its own app+proxy containers, and this
  # compose file must never race it or try to recreate it.
  kamal:
    external: true
