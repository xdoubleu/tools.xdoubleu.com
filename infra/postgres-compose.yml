services:
  postgres:
    # Vanilla postgres, not supabase/postgres (issue #1031): the
    # Supabase-managed image bootstraps its own generic auth/storage/
    # realtime schemas on first start, which collide with — and don't
    # match the column set of — a real dump restored from a live Supabase
    # project (that image's baseline is a starter schema, not a live
    # mirror of any project's actual migration history, and its `postgres`
    # role isn't a real superuser, blocking DROP SCHEMA/ownership fixes
    # too). Confirmed the hard way across several failed restore attempts.
    # A handful of Supabase-specific extension objects (pgsodium/vault
    # encryption, pg_net webhooks, some realtime internals) are lost, but
    # none of that matters until GoTrue/Storage/Realtime actually run
    # against this DB — a separate future sub-issue, which should use
    # Supabase's own self-hosting stack rather than this image anyway.
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    ports:
      # Loopback only — never exposed publicly. Reach it via an SSH tunnel
      # (see infra/README.md) for debugging.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
      # Shared with the Kamal-deployed app (issue #1033) so it can reach
      # Postgres by container name (`postgres:5432`) instead of a host port
      # — loopback-only binding above means a container on a different
      # Docker network can't reach it at all, and widening the port bind to
      # 0.0.0.0 would risk bypassing ufw (Docker manipulates iptables
      # directly). See infra/README.md's "Deploy the app via Kamal" section
      # for the one-time `docker network create kamal` step this depends on.
      - kamal

  # A self-hosted GoTrue service used to run here — see infra/README.md's
  # "GoTrue is gone" section for the full history.

volumes:
  postgres_data:

networks:
  default: {}
  # Pre-created once via `docker network create kamal` (see
  # infra/README.md) — declared external here since Kamal itself also
  # creates/uses this network for its own app+proxy containers, and this
  # compose file must never race it or try to recreate it.
  kamal:
    external: true
