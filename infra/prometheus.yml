# Uploaded by null_resource.prometheus (infra/main.tf). Prometheus only
# collects; alerting lives in infra/grafana/provisioning/alerting/.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Kamal app containers are found via Docker SD on the `service` label, which
  # Kamal requires on every image; container names are
  # <service>-<role>-<version>, so no stable DNS alias exists. The `job` label
  # matches what dashboards and alert rules expect.
  - job_name: api
    docker_sd_configs: &app_sd
      - host: unix:///var/run/docker.sock
        # Otherwise stopped previous-version containers show as down targets.
        filters:
          - name: status
            values: ["running"]
        # Irrelevant: relabeling rewrites __address__ to the container IP and port.
        port: 0
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service]
        regex: tools-xdoubleu-com-api
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: kamal
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: "$1:8000"
      # Strip Docker's leading slash from the container name.
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: instance
        replacement: "$1"
    # job_duration_seconds' own `job` label collides with the scrape label and
    # would become `exported_job`; rename it for the dashboards.
    metric_relabel_configs:
      - source_labels: [exported_job]
        target_label: job_name
      - regex: exported_job
        action: labeldrop

  - job_name: web
    docker_sd_configs: *app_sd
    # web's /metrics is public via the catch-all, so it's gated on this token.
    # An unset secret fails open on the web side.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/web_ingest_secret
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service]
        regex: tools-xdoubleu-com-web
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: kamal
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: "$1:3000"
      # Strip Docker's leading slash from the container name.
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: instance
        replacement: "$1"

  # /grafana/metrics: GF_SERVER_SERVE_FROM_SUB_PATH also applies to /metrics,
  # even when scraped by container IP.
  - job_name: grafana
    metrics_path: /grafana/metrics
    docker_sd_configs: *app_sd
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service]
        regex: tools-xdoubleu-com-grafana
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: kamal
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: "$1:3000"
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: instance
        replacement: "$1"

  # Compose accessories have stable names, so static_configs suffice.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Postgres server-level stats.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Prometheus's own self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
