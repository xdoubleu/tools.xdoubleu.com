# Uploaded by null_resource.prometheus (infra/main.tf). Prometheus only
# collects; alerting lives in infra/grafana/provisioning/alerting/.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Kamal app containers are found via Docker SD on the `service` label, which
  # Kamal requires on every image; container names are
  # <service>-<role>-<version>, so no stable DNS alias exists. The `job` label
  # matches what dashboards and alert rules expect.
  - job_name: api
    # The api is the root service, so /metrics is public via kamal-proxy and
    # gated on this token. An unset secret fails open on the api side.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/ingest_secret
    docker_sd_configs: &app_sd
      - host: unix:///var/run/docker.sock
        # Otherwise stopped previous-version containers show as down targets.
        filters:
          - name: status
            values: ["running"]
        # Irrelevant: relabeling rewrites __address__ to the container IP and port.
        port: 0
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service]
        regex: tools-xdoubleu-com-api
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: kamal
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: "$1:8000"
      # Strip Docker's leading slash from the container name.
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: instance
        replacement: "$1"
    # job_duration_seconds' own `job` label collides with the scrape label and
    # would become `exported_job`; rename it for the dashboards.
    metric_relabel_configs:
      - source_labels: [exported_job]
        target_label: job_name
      - regex: exported_job
        action: labeldrop

  # /grafana/metrics: GF_SERVER_SERVE_FROM_SUB_PATH also applies to /metrics,
  # even when scraped by container IP.
  - job_name: grafana
    metrics_path: /grafana/metrics
    docker_sd_configs: *app_sd
    relabel_configs:
      - source_labels: [__meta_docker_container_label_service]
        regex: tools-xdoubleu-com-grafana
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: kamal
        action: keep
      - source_labels: [__meta_docker_network_ip]
        target_label: __address__
        replacement: "$1:3000"
      - source_labels: [__meta_docker_container_name]
        regex: "/?(.*)"
        target_label: instance
        replacement: "$1"

  # Compose accessories have stable names, so static_configs suffice.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Postgres server-level stats.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # TLS and reachability probes (blackbox.yml). __SERVER_IP__ is replaced with
  # var.server_ip by main.tf. The origin probe skips Cloudflare, so an expired
  # or failing origin certificate shows here before Cloudflare returns 526.
  - job_name: blackbox-origin
    metrics_path: /probe
    params:
      module: [origin]
    static_configs:
      - targets: ["https://__SERVER_IP__/api/health"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-edge
    metrics_path: /probe
    params:
      module: [edge]
    static_configs:
      - targets: ["https://tools.xdoubleu.com/api/health"]
    relabel_configs: *blackbox_relabel

  # Prometheus's own self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
