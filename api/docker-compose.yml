services:
  db:
    # Matches production; one volume per major (data dirs don't carry over).
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"


volumes:
  postgres17_data:
