services:
  db:
    # Matches production; one volume per major (data dirs don't carry over).
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"


volumes:
  postgres17_data:
