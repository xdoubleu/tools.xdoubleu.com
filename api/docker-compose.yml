services:
  db:
    # Matches production; one volume per major (data dirs don't carry over).
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"


volumes:
  postgres17_data:
