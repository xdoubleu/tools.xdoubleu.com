# gremlins mutation-testing config, shared by `make test/mutation` (full
# baseline) and `make test/mutation/diff`. Mirrors coverage.out's exclusions
# (generated stubs and mocks).
unleash:
  exclude-files:
    - "(^|/)gen/"
    - "_mock\\.go$"
  # Per-mutant timeout is coverage time x this. Coverage reuses cached builds
  # while each mutant recompiles and relinks, so the default 3 reports slow
  # builds as TIMED OUT.
  timeout-coefficient: 10
