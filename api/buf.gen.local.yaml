version: v2
clean: true
inputs:
  - directory: ../proto
plugins:
  # Plugins come from the flake's dev shell; protoc-gen-connect-go's version in
  # flake.nix must match buf.gen.yaml's `remote:` pin (make lint/proto-local-versions).
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative
