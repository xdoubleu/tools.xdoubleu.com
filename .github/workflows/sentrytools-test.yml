name: Sentrytools Test Workflow

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Sentrytools Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: './sentrytools/go.mod'
          cache-dependency-path: './sentrytools/go.sum'
      - run: make test/cov/report
        working-directory: './sentrytools'
      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: sentrytools
