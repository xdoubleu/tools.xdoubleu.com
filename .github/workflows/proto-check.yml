name: Proto Staleness Check Workflow

on:
  workflow_dispatch:
  workflow_call:

jobs:
  proto-check:
    name: Proto Staleness Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Generate Go proto stubs
        run: buf generate
        working-directory: './api'
      - name: Generate TypeScript ConnectRPC clients
        run: buf generate
        working-directory: './web'
      - name: Fail if proto stubs are stale
        run: |
          git diff --exit-code api/gen/ web/lib/gen/ || \
            (echo "Proto stubs are out of date. Run 'make proto/generate' in api/ and 'npm run generate' in web/ then commit the results." && exit 1)
      - name: Check local plugin pins match buf.gen.yaml
        run: ./api/scripts/check_proto_local_versions.sh
      - name: Lint proto files
        run: buf lint
        working-directory: './proto'
