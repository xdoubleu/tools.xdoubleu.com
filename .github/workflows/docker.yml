name: Docker Build & Push Workflow

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_app:
        type: boolean
        default: false
      # false for PR-time build validation (docker-check in main.yml) — same
      # build, same cache scope, just never pushed to ghcr.
      push:
        type: boolean
        default: true
    outputs:
      app_built:
        value: ${{ jobs.docker-app.outputs.built }}

jobs:
  # kobo-gateway ships inside the merged image but needs cgo + AppKit (can't
  # build in the Linux docker-app job below) — built separately on macOS and
  # handed off as an artifact. Always runs when docker-app will, regardless
  # of whether kobo-gateway sources themselves changed or the push only
  # touched api/, since the merged image always bundles this artifact (issue
  # #558 — accepted cost of not changing the auto-update path's release
  # stamping).
  build-kobo-gateway:
    if: github.event_name == 'workflow_dispatch' || inputs.build_app
    name: Build Kobo Gateway
    uses: ./.github/workflows/build-kobo-gateway.yml
    permissions:
      contents: read
    secrets: inherit

  docker-app:
    name: Docker Build & Push App
    needs: build-kobo-gateway
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || inputs.build_app) &&
      needs.build-kobo-gateway.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.build.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      # kobo-gateway.dmg + the raw binary, built on macOS by
      # build-kobo-gateway above (see
      # kobo-gateway/cmd/kobo-gateway/menubar_darwin.go for why). The root
      # Dockerfile COPYs these straight into web/public/downloads/.
      - uses: actions/download-artifact@v8
        with:
          name: kobo-gateway-dist
          path: web/public/downloads/

      - uses: docker/setup-buildx-action@v4

      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          build-args: |
            RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
