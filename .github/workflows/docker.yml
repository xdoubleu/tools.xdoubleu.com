name: Docker Build & Push Workflow

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_app:
        type: boolean
        default: false
      # false for PR-time build validation (docker-check in main.yml) — same
      # build, same cache scope, just never pushed to ghcr.
      push:
        type: boolean
        default: true
    outputs:
      app_built:
        value: ${{ jobs.docker-app.outputs.built }}

jobs:
  # Assembly-only — api/gateway/web/kobo-gateway are each built by their own
  # workflow (build-api.yml/build-gateway.yml/build-web.yml/
  # build-kobo-gateway.yml), which the caller (main.yml) runs before calling
  # this one and hands off as artifacts here. No compilation happens in this
  # job; see root Dockerfile and CLAUDE.md's CI section.
  docker-app:
    name: Docker Build & Push App
    if: github.event_name == 'workflow_dispatch' || inputs.build_app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.build.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: api-bin
          path: bin/

      - uses: actions/download-artifact@v8
        with:
          name: gateway-bin
          path: bin/

      - uses: actions/download-artifact@v8
        with:
          name: web-standalone
          path: web-standalone/

      # kobo-gateway.dmg + the raw binary, built on macOS by
      # build-kobo-gateway.yml (see
      # kobo-gateway/cmd/kobo-gateway/menubar_darwin.go for why). The root
      # Dockerfile COPYs these straight into web/public/downloads/. The
      # RELEASE file records the actual release baked into this artifact —
      # can be older than this deploy's SHA when kobo-gateway/ was
      # unchanged and its build was cache-skipped.
      - uses: actions/download-artifact@v8
        with:
          name: kobo-gateway-dist
          path: web/public/downloads/

      - name: Read kobo-gateway's bundled release
        id: kobo-gateway-release
        run: |
          value=$(cat web/public/downloads/RELEASE)
          echo "value=$value" >> "$GITHUB_OUTPUT"
          rm web/public/downloads/RELEASE

      - uses: docker/setup-buildx-action@v4

      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          build-args: |
            RELEASE=${{ github.sha }}
            KOBO_GATEWAY_RELEASE=${{ steps.kobo-gateway-release.outputs.value }}
