name: Docker Build & Push Workflow

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_app:
        type: boolean
        default: false
      # false for PR-time build validation (docker-check in main.yml) — same
      # build, same cache scope, just never pushed to ghcr.
      push:
        type: boolean
        default: true
    outputs:
      app_built:
        value: ${{ jobs.docker-app.outputs.built }}

jobs:
  # Assembly-only — api/gateway/web are each built and pushed to GHCR by
  # their own workflow (build-api.yml/build-gateway.yml/build-web.yml); the
  # root Dockerfile's `FROM ghcr.io/.../<component>:latest` always resolves
  # to whatever was pushed last time that component's subtree actually
  # changed, so this job needs no cache-key logic for them at all. Only
  # kobo-gateway (macOS-only, can't be a Docker build stage) is fed in here
  # via a restored `actions/cache` entry. No compilation happens in this
  # job; see root Dockerfile and CLAUDE.md's CI section.
  docker-app:
    name: Docker Build & Push App
    if: github.event_name == 'workflow_dispatch' || inputs.build_app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.build.conclusion == 'success' }}
    steps:
      # Same ref as build-kobo-gateway.yml (PR head branch, not the default
      # merge commit) so hashFiles('kobo-gateway/**') below reproduces the
      # exact key that workflow wrote — a mismatched tree would compute a
      # different hash and always cache-miss.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # kobo-gateway.dmg + the raw binary, built on macOS by
      # build-kobo-gateway.yml (see
      # kobo-gateway/cmd/kobo-gateway/menubar_darwin.go for why). The
      # RELEASE file records the actual release baked into this cache
      # entry — can be older than this deploy's SHA when kobo-gateway/ was
      # unchanged and its build was cache-skipped.
      - uses: actions/cache/restore@v6
        id: cache-kobo-gateway
        with:
          path: kobo-gateway/dist/kobo-gateway
          key: build-kobo-gateway-${{ hashFiles('kobo-gateway/**') }}

      - name: Fail if kobo-gateway's build cache is missing
        if: steps.cache-kobo-gateway.outputs.cache-hit != 'true'
        run: |
          echo "::error::kobo-gateway's build cache is missing for the current source (cold cache or eviction) and build-kobo-gateway.yml didn't run in this workflow. Trigger it via workflow_dispatch to repopulate the cache, then re-run this job." >&2
          exit 1

      - name: Arrange kobo-gateway files for the Docker build context
        run: |
          mkdir -p web/public/downloads
          cp -r kobo-gateway/dist/kobo-gateway/. web/public/downloads/

      - name: Read kobo-gateway's bundled release
        id: kobo-gateway-release
        run: |
          value=$(cat web/public/downloads/RELEASE)
          echo "value=$value" >> "$GITHUB_OUTPUT"
          rm web/public/downloads/RELEASE

      - uses: docker/setup-buildx-action@v4

      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          # Kamal's `validate_image` step (kamal build/deploy) rejects any
          # image pulled without this exact label — it normally stamps it
          # itself via `kamal build`, but we build via buildx directly and
          # deploy with --skip-push. Must match `service:` in
          # infra/templates/deploy.yml.tftpl.
          labels: service=tools-xdoubleu-com
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          build-args: |
            RELEASE=${{ github.sha }}
            KOBO_GATEWAY_RELEASE=${{ steps.kobo-gateway-release.outputs.value }}
