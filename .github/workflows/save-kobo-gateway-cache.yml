name: Save Kobo Gateway Cache

# The only writer of build-kobo-gateway.yml's cache (ADR 0002). `workflow_run`
# always runs the default branch's workflow file, so PR runs can't poison
# the cache. Checkouts omit `ref:` so they get the default branch, never the
# triggering run's head_sha (which may be a PR's).
on:
  workflow_run:
    workflows: ['Main Workflow']
    types: [completed]
    branches: [main]

jobs:
  # Cheap Linux lookup first, so the macOS runner only starts on a real miss.
  check-cache:
    if: github.event.workflow_run.conclusion == 'success'
    name: Check kobo-gateway cache (lookup only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: kobo-gateway/dist/kobo-gateway
          key: build-kobo-gateway-${{ hashFiles('kobo-gateway/**') }}
          lookup-only: true

  save:
    needs: check-cache
    if: needs.check-cache.outputs.cache-hit != 'true'
    name: Save kobo-gateway build cache (macOS)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: './kobo-gateway/go.mod'
          cache-dependency-path: './kobo-gateway/go.sum'
      # A writing cache is safe here: unreachable from pull_request/dispatch, and
      # check-cache confirmed a miss.
      - uses: actions/cache@v6
        with:
          path: kobo-gateway/dist/kobo-gateway
          key: build-kobo-gateway-${{ hashFiles('kobo-gateway/**') }}
      - run: |
          make dist RELEASE=${{ github.sha }} SENTRY_DSN=${{ secrets.GATEWAY_SENTRY_DSN }}
          echo -n "${{ github.sha }}" > dist/kobo-gateway/RELEASE
        working-directory: './kobo-gateway'
