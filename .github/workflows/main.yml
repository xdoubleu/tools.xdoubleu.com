name: Main Workflow

permissions:
  actions: write
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      proto: ${{ steps.proto-workflows.outputs.proto }}
      workflows: ${{ steps.proto-workflows.outputs.workflows }}
      kobo_gateway: ${{ steps.filter.outputs.kobo_gateway }}
      gateway: ${{ steps.filter.outputs.gateway }}
      sentrytools: ${{ steps.filter.outputs.sentrytools }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      # 'every' requires a file to match every listed pattern, so
      # '!api/**/*.md' actually scopes to "and isn't an api/ doc". The
      # default ('some', plain OR across all patterns) made a lone negation
      # match any file outside api/ too, since such a file trivially isn't
      # api/**/*.md — that tripped these filters on completely unrelated
      # changes (#740). 'some-with-excludes' would express this more
      # directly but isn't supported by the pinned v4 release.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            api:
              - 'api/**'
              - '!api/**/*.md'
            web:
              - 'web/**'
              - '!web/**/*.md'
            # The kobo-gateway binary ships inside the WEB image (served as
            # a download), so kobo-gateway code changes must rebuild web too.
            # It's its own Go module (kobo-gateway/) — cgo + AppKit, built
            # separately on macOS (see build-kobo-gateway.yml), not part of
            # api/.
            kobo_gateway:
              - 'kobo-gateway/**'
              - '!kobo-gateway/**/*.md'
            # gateway/ is an ordinary Go module (routing + process
            # supervision, no cgo) that builds as a normal Docker stage
            # alongside api/web — unlike kobo_gateway above, it doesn't need
            # to feed build-web.
            gateway:
              - 'gateway/**'
              - '!gateway/**/*.md'
            # sentrytools/ is a standalone Go module (own go.mod) with no
            # deployable artifact of its own — api/ and gateway/ each pull it
            # in via a local `replace` directive, so a change here can break
            # either of them even though neither's own subtree changed. See
            # the api/gateway gates below, which OR this in too.
            sentrytools:
              - 'sentrytools/**'
              - '!sentrytools/**/*.md'
            infra:
              - 'infra/**'
              - '!infra/**/*.md'
      # Separate step: these filters are a plain OR of positive-only
      # patterns, so they need the default 'some' quantifier, not 'every'.
      - uses: dorny/paths-filter@v4
        id: proto-workflows
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'api/buf.gen.yaml'
              - 'web/buf.gen.yaml'
            workflows:
              - '.github/workflows/**'

  proto-check:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Proto Staleness Check Workflow
    uses: ./.github/workflows/proto-check.yml
    secrets: inherit

  # Each build-* job is gated on its OWN subtree only (issue #948) — unlike
  # docker-check/docker below, which still need every job's *result* since
  # the merged image needs a current binary for all four. A job that's
  # skipped here just means docker.yml restores that component's binary
  # straight from its actions/cache entry (same key this workflow writes)
  # instead of a same-run artifact — see docker.yml's docker-app job.
  build-api:
    needs: [changes, proto-check]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build API Workflow
    uses: ./.github/workflows/build-api.yml
    secrets: inherit

  # kobo_gateway is deliberately not in this gate: web's own `npm run
  # build` has no dependency on kobo-gateway/ source (docker.yml copies the
  # .dmg into web/public/downloads AFTER build-web.yml already ran).
  build-web:
    needs: [changes, proto-check]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Web Workflow
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  # gateway/ is a standalone Go module with no proto dependency, unlike
  # api/web — so this doesn't need proto-check as a gate.
  build-gateway:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Gateway Workflow
    uses: ./.github/workflows/build-gateway.yml
    secrets: inherit

  # Builds/packages kobo-gateway on a macOS runner (cgo + AppKit, can't
  # cross-compile from Linux — see build-kobo-gateway.yml).
  build-kobo-gateway:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Kobo Gateway Workflow
    uses: ./.github/workflows/build-kobo-gateway.yml
    secrets: inherit

  api-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: API Lint Workflow
    uses: ./.github/workflows/api-lint.yml
    secrets: inherit

  web-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Web Lint Workflow
    uses: ./.github/workflows/web-lint.yml
    secrets: inherit

  gateway-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Gateway Lint Workflow
    uses: ./.github/workflows/gateway-lint.yml
    secrets: inherit

  kobo-gateway-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Kobo Gateway Lint Workflow
    uses: ./.github/workflows/kobo-gateway-lint.yml
    secrets: inherit

  api-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: API Test Workflow
    uses: ./.github/workflows/api-test.yml
    secrets: inherit

  web-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Web Test Workflow
    uses: ./.github/workflows/web-test.yml
    secrets: inherit

  gateway-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Gateway Test Workflow
    uses: ./.github/workflows/gateway-test.yml
    secrets: inherit

  kobo-gateway-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Kobo Gateway Test Workflow
    uses: ./.github/workflows/kobo-gateway-test.yml
    secrets: inherit

  # sentrytools/ has no deployable artifact of its own (see the `changes`
  # job's sentrytools filter comment) — it's still linted/tested standalone
  # so a break is caught here, in addition to api-test/gateway-test catching
  # it transitively through their own `replace` on this module.
  sentrytools-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Sentrytools Lint Workflow
    uses: ./.github/workflows/sentrytools-lint.yml
    secrets: inherit

  sentrytools-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Sentrytools Test Workflow
    uses: ./.github/workflows/sentrytools-test.yml
    secrets: inherit

  # Build-only (no push) validation of the merged Docker image on PRs, so a
  # break that only shows up inside the Dockerfile's narrower file set (e.g.
  # issue #900 — a test file colocated outside the copied dirs) is caught
  # before merge instead of after, when `docker.yml`'s real push-and-deploy
  # run is the first thing to build it.
  docker-check:
    needs: [changes, build-api, build-web, build-gateway, build-kobo-gateway]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.kobo_gateway == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.sentrytools == 'true' || needs.changes.outputs.workflows == 'true') &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-gateway.result == 'success' || needs.build-gateway.result == 'skipped') &&
      (needs.build-kobo-gateway.result == 'success' || needs.build-kobo-gateway.result == 'skipped')
    name: Docker Build Check Workflow
    uses: ./.github/workflows/docker.yml
    with:
      build_app: true
      push: false
    secrets: inherit

  ci-pass:
    needs:
      [
        proto-check,
        build-api,
        build-web,
        build-gateway,
        build-kobo-gateway,
        docker-check,
        api-lint,
        web-lint,
        gateway-lint,
        kobo-gateway-lint,
        sentrytools-lint,
        api-test,
        web-test,
        gateway-test,
        kobo-gateway-test,
        sentrytools-test,
      ]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done

      # codecov.yml sets `manual_trigger: true`, so Codecov posts no statuses/comment
      # until we tell it to here — once every test job has uploaded. This avoids the
      # stale carried-forward status Codecov used to post off the first upload (#403).
      # `send-notifications` accepting the call doesn't guarantee Codecov's backend
      # actually creates the check-runs — it occasionally no-ops (#540) — so this
      # re-sends the trigger periodically while polling instead of firing it once.
      # Guarded so there's nothing to trigger or wait for when no test job ran.
      - name: Trigger and wait for Codecov to report
        if: |
          needs.api-test.result == 'success' ||
          needs.web-test.result == 'success' ||
          needs.gateway-test.result == 'success' ||
          needs.kobo-gateway-test.result == 'success' ||
          needs.sentrytools-test.result == 'success'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PRs: notify/wait on the head commit, not the merge commit github.sha exposes.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pip install --quiet codecov-cli

          send_notifications() {
            codecovcli send-notifications --commit-sha "$SHA" --slug "$REPO" --git-service github
          }

          # Codecov reports via the Checks API (codecov/patch, codecov/project),
          # not the legacy commit-status API, so poll check-runs.
          send_notifications
          last_trigger=$(date +%s)
          retry_interval=200
          echo "Waiting for Codecov checks on $SHA"
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            checks=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name | startswith("codecov")) | "\(.name)=\(.status):\(.conclusion)"')

            if [[ -z "$checks" ]]; then
              echo "No Codecov checks yet; waiting..."
              if (( $(date +%s) - last_trigger >= retry_interval )); then
                echo "Re-sending Codecov notify trigger..."
                send_notifications
                last_trigger=$(date +%s)
              fi
            else
              echo "$checks"
              if echo "$checks" | grep -qv '=completed:'; then
                echo "Codecov checks still running..."
              elif echo "$checks" | grep -qvE '=completed:(success|neutral|skipped)$'; then
                echo "Codecov reported a failing check."
                exit 1
              else
                echo "All Codecov checks succeeded."
                exit 0
              fi
            fi

            if [[ $(date +%s) -ge $deadline ]]; then
              echo "Timed out waiting for Codecov to report."
              exit 1
            fi
            sleep 15
          done

  docker:
    needs: [changes, build-api, build-web, build-gateway, build-kobo-gateway]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-gateway.result == 'success' || needs.build-gateway.result == 'skipped') &&
      (needs.build-kobo-gateway.result == 'success' || needs.build-kobo-gateway.result == 'skipped')
    name: Docker Build & Push Workflow
    uses: ./.github/workflows/docker.yml
    with:
      # Union of both former conditions (api ∨ web) — one merged image
      # (issue #558) means any change that would have rebuilt either
      # component now rebuilds the single one.
      build_app: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.kobo_gateway == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.sentrytools == 'true' || needs.changes.outputs.workflows == 'true' }}
    secrets: inherit

  # Deploy to the Hetzner VPS via Kamal (issue #1036). Since cutover (#1034)
  # this is the *only* production deploy — DNS resolves here — so it carries
  # no continue-on-error: a failure here means main didn't ship and must be
  # loud. (The DigitalOcean App Platform deploy this replaced was removed in
  # #1113, along with do-app.yaml and the DO_ACCESS_TOKEN/DO_APP_ID secrets.)
  # Requires the host to have been bootstrapped once by a manual
  # `kamal setup` — this job runs `kamal deploy`, not `kamal setup`, and
  # assumes kamal-proxy is already installed. See infra/README.md's "Deploy
  # the app via Kamal" section for that one-time bootstrap.
  deploy-kamal:
    needs: [docker]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker.result == 'success' &&
      needs.docker.outputs.app_built == 'true'
    name: Deploy to Hetzner via Kamal
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      # Not webfactory/ssh-agent: it pipes the secret into `ssh-add -`
      # verbatim, and a secret stored without its trailing newline (GitHub's
      # secret UI strips one on paste) is an unparsable PEM — OpenSSH rejects
      # it with `Error loading key "(stdin)": error in libcrypto` and the
      # deploy never runs (issue #1106). printf restores the newline, tr
      # drops CRs from a Windows-pasted key. The agent is started here rather
      # than dropping the key in ~/.ssh so Kamal's net-ssh never has to parse
      # an ed25519 key itself; SSH_AUTH_SOCK is exported for later steps.
      - name: Load the deploy SSH key
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          if ! printf '%s\n' "$KAMAL_SSH_KEY" | tr -d '\r' | ssh-add -; then
            echo "::error::KAMAL_SSH_KEY is not a loadable unencrypted private key. Re-set it with: gh secret set KAMAL_SSH_KEY < ~/.ssh/kamal_ci_deploy"
            exit 1
          fi
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

      # KAMAL_SERVER_IP/KAMAL_REGISTRY_USERNAME are repo Secrets, not
      # Variables — this repo is public, and GitHub only masks Secrets from
      # workflow logs, not Variables. Every step routes them through `env:`
      # (never inline `${{ }}` in `run:`) so the mask holds; config/deploy.yml
      # reads them from that same environment via ERB.
      # No `-H`: ssh-keyscan salts every hashed line separately, and SSHKit's
      # own known_hosts parser (sshkit/backends/netssh/known_hosts.rb, used
      # instead of net-ssh's) returns the keys of the *first* hashed line
      # whose HMAC matches and stops there — so of keyscan's three lines only
      # ssh-rsa is ever "known", and the ed25519 key the server actually
      # presents fails verification with Net::SSH::HostKeyMismatch. Unhashed
      # entries take the other branch, which unions all keys for the host.
      # Hashing buys nothing on a throwaway runner anyway.
      - name: Trust the VPS host key
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
        run: mkdir -p ~/.ssh && ssh-keyscan "$KAMAL_SERVER_IP" >> ~/.ssh/known_hosts

      # No render step: config/deploy.yml is committed as-is and Kamal
      # evaluates it as ERB itself, pulling the two non-committable values
      # (KAMAL_SERVER_IP/KAMAL_REGISTRY_USERNAME) from the env below.
      - name: Deploy via Kamal
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          # docker.yml's docker/metadata-action step tags images
          # `type=sha,prefix=`, which defaults to a 7-character short SHA —
          # confirmed via `kamal config`'s absolute_image output.
          KAMAL_VERSION: ${{ github.sha }}
          RELEASE: ${{ github.sha }}
          DB_DSN: ${{ secrets.KAMAL_DB_DSN }}
          GOTRUE_URL: http://gotrue:9999
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          SUPABASE_PROJ_REF: ${{ secrets.SUPABASE_PROJ_REF }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Not GITHUB_OAUTH_CLIENT_*: GitHub Actions rejects secret names
          # starting with GITHUB_. The app-level env var name Kamal sets on
          # the container is unaffected — only this secret's storage name
          # needed the prefix.
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.KAMAL_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.KAMAL_GITHUB_OAUTH_CLIENT_SECRET }}
          SENTRY_OAUTH_CLIENT_ID: ${{ secrets.SENTRY_OAUTH_CLIENT_ID }}
          SENTRY_OAUTH_CLIENT_SECRET: ${{ secrets.SENTRY_OAUTH_CLIENT_SECRET }}
          DO_OAUTH_CLIENT_ID: ${{ secrets.DO_OAUTH_CLIENT_ID }}
          DO_OAUTH_CLIENT_SECRET: ${{ secrets.DO_OAUTH_CLIENT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          EMAIL_INBOUND_DOMAIN: ${{ secrets.EMAIL_INBOUND_DOMAIN }}
          EMAIL_INBOUND_SECRET: ${{ secrets.EMAIL_INBOUND_SECRET }}
        run: bundle exec kamal deploy --skip-push --version="${KAMAL_VERSION:0:7}"

  # Applies infra/ (firewall, OS hardening, self-hosted Postgres/GoTrue) on
  # every push to main that touches it (issues #1053/#1057/#1058/#1060) —
  # state lives remotely in Cloudflare R2 (infra/versions.tf's backend
  # block), not on any one laptop. Unlike deploy-kamal above, there's no
  # "swap the container tag back" undo for what this applies: harden.sh and
  # null_resource.postgres SSH into the box and mutate it in place. So this
  # snapshots the VPS via the Hetzner API immediately before applying and,
  # if the apply fails, rebuilds the server from that snapshot automatically
  # — a real but lossy rollback (a few minutes of downtime, and anything
  # written to Postgres between the snapshot and the failure is gone) rather
  # than a "fix forward" model, which can't cleanly undo a broken SSH
  # provisioner run. No manual approval gate: the snapshot/restore is the
  # safety net, not a human click.
  infra-apply:
    needs: changes
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true')
    name: Apply Infra via OpenTofu
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2

      # Same key/mechanism deploy-kamal uses above — it's already one of the
      # authorized deploy_ssh_public_keys entries, so no separate key is
      # needed for Tofu's own SSH provisioners.
      - name: Load the deploy SSH key
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          if ! printf '%s\n' "$KAMAL_SSH_KEY" | tr -d '\r' | ssh-add -; then
            echo "::error::KAMAL_SSH_KEY is not a loadable unencrypted private key."
            exit 1
          fi
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

      - name: Trust the VPS host key
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
        run: mkdir -p ~/.ssh && ssh-keyscan "$KAMAL_SERVER_IP" >> ~/.ssh/known_hosts

      # endpoints.s3 embeds the Cloudflare account ID, which isn't hardcoded
      # in the committed backend block (infra/versions.tf) — see
      # infra/backend.hcl.example.
      - name: tofu init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
        run: |
          cat > backend.hcl <<EOF
          endpoints = { s3 = "$TF_STATE_R2_ENDPOINT" }
          EOF
          tofu init -backend-config=backend.hcl

      # Async: create_image returns immediately with the action still
      # running, and a rebuild later needs the image to actually be ready —
      # so this polls the action instead of assuming it's done. Labeled so
      # the prune step below only ever touches snapshots this job created.
      - name: Snapshot the VPS before applying
        id: snapshot
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          INFRA_SERVER_ID: ${{ secrets.INFRA_SERVER_ID }}
        run: |
          response=$(curl -sf -X POST "https://api.hetzner.cloud/v1/servers/$INFRA_SERVER_ID/actions/create_image" \
            -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
            -d '{"type":"snapshot","description":"ci-pre-apply","labels":{"purpose":"ci-pre-apply"}}')
          image_id=$(echo "$response" | jq -r '.image.id')
          action_id=$(echo "$response" | jq -r '.action.id')
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

          deadline=$(( $(date +%s) + 300 ))
          while true; do
            status=$(curl -sf "https://api.hetzner.cloud/v1/actions/$action_id" \
              -H "Authorization: Bearer $HCLOUD_TOKEN" | jq -r '.action.status')
            [[ "$status" == "success" ]] && break
            if [[ "$status" == "error" || $(date +%s) -ge $deadline ]]; then
              echo "::error::Pre-apply snapshot did not complete (status: $status). Refusing to apply without a rollback point."
              exit 1
            fi
            sleep 10
          done

      - name: tofu apply
        env:
          # apply re-reads/locks state itself — it doesn't inherit the init
          # step's env, so the R2 backend credentials have to be repeated
          # here too (bit us once already: apply failed with "No valid
          # credential sources found" before this was added).
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_server_id: ${{ secrets.INFRA_SERVER_ID }}
          TF_VAR_server_ip: ${{ secrets.KAMAL_SERVER_IP }}
          TF_VAR_deploy_ssh_public_keys: ${{ vars.INFRA_DEPLOY_SSH_PUBLIC_KEYS }}
          TF_VAR_gotrue_jwt_secret: ${{ secrets.GOTRUE_JWT_SECRET }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_gotrue_site_url: ${{ vars.GOTRUE_SITE_URL }}
          TF_VAR_gotrue_smtp_admin_email: ${{ secrets.GOTRUE_SMTP_ADMIN_EMAIL }}
        run: tofu apply -auto-approve -input=false

      # The apply step above already failed the job; this restores the box
      # and stays failed rather than trying to turn the run green.
      - name: Restore snapshot on failure
        if: failure() && steps.snapshot.outputs.image_id != ''
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          INFRA_SERVER_ID: ${{ secrets.INFRA_SERVER_ID }}
          IMAGE_ID: ${{ steps.snapshot.outputs.image_id }}
        run: |
          echo "::error::tofu apply failed — rebuilding the VPS from the pre-apply snapshot ($IMAGE_ID). This is a lossy restore: a few minutes of downtime, and anything written since the snapshot is gone."
          curl -sf -X POST "https://api.hetzner.cloud/v1/servers/$INFRA_SERVER_ID/actions/rebuild" \
            -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
            -d "{\"image\":$IMAGE_ID}"

      # Keeps the newest 5 CI-generated snapshots (label_selector scopes
      # this to ones this job created, never a manual snapshot taken outside
      # CI) so storage cost doesn't grow unbounded. Runs regardless of
      # whether apply succeeded or a restore just happened.
      - name: Prune old CI snapshots
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          curl -sf "https://api.hetzner.cloud/v1/images?type=snapshot&label_selector=purpose=ci-pre-apply&sort=created:desc" \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            | jq -r '.images[5:] | .[].id' \
            | while read -r id; do
                curl -sf -X DELETE "https://api.hetzner.cloud/v1/images/$id" \
                  -H "Authorization: Bearer $HCLOUD_TOKEN"
              done
