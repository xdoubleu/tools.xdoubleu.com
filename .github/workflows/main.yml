name: Main Workflow

permissions:
  actions: write
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      proto: ${{ steps.proto-workflows.outputs.proto }}
      workflows: ${{ steps.proto-workflows.outputs.workflows }}
      kobo_gateway: ${{ steps.filter.outputs.kobo_gateway }}
      gateway: ${{ steps.filter.outputs.gateway }}
      sentrytools: ${{ steps.filter.outputs.sentrytools }}
    steps:
      - uses: actions/checkout@v7
      # 'every' requires a file to match every listed pattern, so
      # '!api/**/*.md' actually scopes to "and isn't an api/ doc". The
      # default ('some', plain OR across all patterns) made a lone negation
      # match any file outside api/ too, since such a file trivially isn't
      # api/**/*.md — that tripped these filters on completely unrelated
      # changes (#740). 'some-with-excludes' would express this more
      # directly but isn't supported by the pinned v4 release.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            api:
              - 'api/**'
              - '!api/**/*.md'
            web:
              - 'web/**'
              - '!web/**/*.md'
            # The kobo-gateway binary ships inside the WEB image (served as
            # a download), so kobo-gateway code changes must rebuild web too.
            # It's its own Go module (kobo-gateway/) — cgo + AppKit, built
            # separately on macOS (see build-kobo-gateway.yml), not part of
            # api/.
            kobo_gateway:
              - 'kobo-gateway/**'
              - '!kobo-gateway/**/*.md'
            # gateway/ is an ordinary Go module (routing + process
            # supervision, no cgo) that builds as a normal Docker stage
            # alongside api/web — unlike kobo_gateway above, it doesn't need
            # to feed build-web.
            gateway:
              - 'gateway/**'
              - '!gateway/**/*.md'
            # sentrytools/ is a standalone Go module (own go.mod) with no
            # deployable artifact of its own — api/ and gateway/ each pull it
            # in via a local `replace` directive, so a change here can break
            # either of them even though neither's own subtree changed. See
            # the api/gateway gates below, which OR this in too.
            sentrytools:
              - 'sentrytools/**'
              - '!sentrytools/**/*.md'
      # Separate step: these filters are a plain OR of positive-only
      # patterns, so they need the default 'some' quantifier, not 'every'.
      - uses: dorny/paths-filter@v4
        id: proto-workflows
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'api/buf.gen.yaml'
              - 'web/buf.gen.yaml'
            workflows:
              - '.github/workflows/**'

  proto-check:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Proto Staleness Check Workflow
    uses: ./.github/workflows/proto-check.yml
    secrets: inherit

  # Each build-* job is gated on its OWN subtree only (issue #948) — unlike
  # docker-check/docker below, which still need every job's *result* since
  # the merged image needs a current binary for all four. A job that's
  # skipped here just means docker.yml restores that component's binary
  # straight from its actions/cache entry (same key this workflow writes)
  # instead of a same-run artifact — see docker.yml's docker-app job.
  build-api:
    needs: [changes, proto-check]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build API Workflow
    uses: ./.github/workflows/build-api.yml
    secrets: inherit

  # kobo_gateway is deliberately not in this gate: web's own `npm run
  # build` has no dependency on kobo-gateway/ source (docker.yml copies the
  # .dmg into web/public/downloads AFTER build-web.yml already ran).
  build-web:
    needs: [changes, proto-check]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Web Workflow
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  # gateway/ is a standalone Go module with no proto dependency, unlike
  # api/web — so this doesn't need proto-check as a gate.
  build-gateway:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Gateway Workflow
    uses: ./.github/workflows/build-gateway.yml
    secrets: inherit

  # Builds/packages kobo-gateway on a macOS runner (cgo + AppKit, can't
  # cross-compile from Linux — see build-kobo-gateway.yml).
  build-kobo-gateway:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Kobo Gateway Workflow
    uses: ./.github/workflows/build-kobo-gateway.yml
    secrets: inherit

  api-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: API Lint Workflow
    uses: ./.github/workflows/api-lint.yml
    secrets: inherit

  web-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Web Lint Workflow
    uses: ./.github/workflows/web-lint.yml
    secrets: inherit

  gateway-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Gateway Lint Workflow
    uses: ./.github/workflows/gateway-lint.yml
    secrets: inherit

  kobo-gateway-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Kobo Gateway Lint Workflow
    uses: ./.github/workflows/kobo-gateway-lint.yml
    secrets: inherit

  api-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: API Test Workflow
    uses: ./.github/workflows/api-test.yml
    secrets: inherit

  web-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Web Test Workflow
    uses: ./.github/workflows/web-test.yml
    secrets: inherit

  gateway-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Gateway Test Workflow
    uses: ./.github/workflows/gateway-test.yml
    secrets: inherit

  kobo-gateway-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Kobo Gateway Test Workflow
    uses: ./.github/workflows/kobo-gateway-test.yml
    secrets: inherit

  # sentrytools/ has no deployable artifact of its own (see the `changes`
  # job's sentrytools filter comment) — it's still linted/tested standalone
  # so a break is caught here, in addition to api-test/gateway-test catching
  # it transitively through their own `replace` on this module.
  sentrytools-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Sentrytools Lint Workflow
    uses: ./.github/workflows/sentrytools-lint.yml
    secrets: inherit

  sentrytools-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Sentrytools Test Workflow
    uses: ./.github/workflows/sentrytools-test.yml
    secrets: inherit

  # Build-only (no push) validation of the merged Docker image on PRs, so a
  # break that only shows up inside the Dockerfile's narrower file set (e.g.
  # issue #900 — a test file colocated outside the copied dirs) is caught
  # before merge instead of after, when `docker.yml`'s real push-and-deploy
  # run is the first thing to build it.
  docker-check:
    needs: [changes, build-api, build-web, build-gateway, build-kobo-gateway]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.kobo_gateway == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.sentrytools == 'true' || needs.changes.outputs.workflows == 'true') &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-gateway.result == 'success' || needs.build-gateway.result == 'skipped') &&
      (needs.build-kobo-gateway.result == 'success' || needs.build-kobo-gateway.result == 'skipped')
    name: Docker Build Check Workflow
    uses: ./.github/workflows/docker.yml
    with:
      build_app: true
      push: false
    secrets: inherit

  ci-pass:
    needs:
      [
        proto-check,
        build-api,
        build-web,
        build-gateway,
        build-kobo-gateway,
        docker-check,
        api-lint,
        web-lint,
        gateway-lint,
        kobo-gateway-lint,
        sentrytools-lint,
        api-test,
        web-test,
        gateway-test,
        kobo-gateway-test,
        sentrytools-test,
      ]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done

      # codecov.yml sets `manual_trigger: true`, so Codecov posts no statuses/comment
      # until we tell it to here — once every test job has uploaded. This avoids the
      # stale carried-forward status Codecov used to post off the first upload (#403).
      # `send-notifications` accepting the call doesn't guarantee Codecov's backend
      # actually creates the check-runs — it occasionally no-ops (#540) — so this
      # re-sends the trigger periodically while polling instead of firing it once.
      # Guarded so there's nothing to trigger or wait for when no test job ran.
      - name: Trigger and wait for Codecov to report
        if: |
          needs.api-test.result == 'success' ||
          needs.web-test.result == 'success' ||
          needs.gateway-test.result == 'success' ||
          needs.kobo-gateway-test.result == 'success' ||
          needs.sentrytools-test.result == 'success'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PRs: notify/wait on the head commit, not the merge commit github.sha exposes.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pip install --quiet codecov-cli

          send_notifications() {
            codecovcli send-notifications --commit-sha "$SHA" --slug "$REPO" --git-service github
          }

          # Codecov reports via the Checks API (codecov/patch, codecov/project),
          # not the legacy commit-status API, so poll check-runs.
          send_notifications
          last_trigger=$(date +%s)
          retry_interval=200
          echo "Waiting for Codecov checks on $SHA"
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            checks=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name | startswith("codecov")) | "\(.name)=\(.status):\(.conclusion)"')

            if [[ -z "$checks" ]]; then
              echo "No Codecov checks yet; waiting..."
              if (( $(date +%s) - last_trigger >= retry_interval )); then
                echo "Re-sending Codecov notify trigger..."
                send_notifications
                last_trigger=$(date +%s)
              fi
            else
              echo "$checks"
              if echo "$checks" | grep -qv '=completed:'; then
                echo "Codecov checks still running..."
              elif echo "$checks" | grep -qvE '=completed:(success|neutral|skipped)$'; then
                echo "Codecov reported a failing check."
                exit 1
              else
                echo "All Codecov checks succeeded."
                exit 0
              fi
            fi

            if [[ $(date +%s) -ge $deadline ]]; then
              echo "Timed out waiting for Codecov to report."
              exit 1
            fi
            sleep 15
          done

  docker:
    needs: [changes, build-api, build-web, build-gateway, build-kobo-gateway]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-gateway.result == 'success' || needs.build-gateway.result == 'skipped') &&
      (needs.build-kobo-gateway.result == 'success' || needs.build-kobo-gateway.result == 'skipped')
    name: Docker Build & Push Workflow
    uses: ./.github/workflows/docker.yml
    with:
      # Union of both former conditions (api ∨ web) — one merged image
      # (issue #558) means any change that would have rebuilt either
      # component now rebuilds the single one.
      build_app: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.kobo_gateway == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.sentrytools == 'true' || needs.changes.outputs.workflows == 'true' }}
    secrets: inherit

  deploy:
    needs: [docker]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker.result == 'success' &&
      needs.docker.outputs.app_built == 'true'
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Digital Ocean deployment and wait for it to finish
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          deployment=$(curl -sf -X POST \
            -H "Authorization: Bearer $DO_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments")
          deployment_id=$(echo "$deployment" | jq -r '.deployment.id')
          echo "Triggered deployment $deployment_id"

          # Poll until the deployment reaches a terminal phase so a failed
          # rollout fails this job instead of only firing a DO alert.
          deadline=$(( $(date +%s) + 1200 ))
          while true; do
            phase=$(curl -sf \
              -H "Authorization: Bearer $DO_ACCESS_TOKEN" \
              "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments/$deployment_id" \
              | jq -r '.deployment.phase')
            echo "Deployment phase: $phase"
            case "$phase" in
              ACTIVE|SUPERSEDED)
                echo "Deployment finished."
                exit 0
                ;;
              ERROR|CANCELED)
                echo "Deployment failed with phase $phase."
                exit 1
                ;;
            esac
            if [[ $(date +%s) -ge $deadline ]]; then
              echo "Timed out waiting for deployment to finish."
              exit 1
            fi
            sleep 15
          done

  # Parallel deploy to the Hetzner VPS via Kamal (issue #1036), alongside
  # the DO deploy above — DO stays the traffic-serving deploy until the
  # Cutover issue (#1034), so this job's own failure doesn't fail the whole
  # workflow (continue-on-error) and isn't a dependency of anything else.
  # Requires infra/'s null_resource.kamal_deploy (or a manual `kamal setup`)
  # to have bootstrapped the host at least once already — this job runs
  # `kamal deploy`, not `kamal setup`, and assumes kamal-proxy is already
  # installed.
  deploy-kamal:
    needs: [docker]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker.result == 'success' &&
      needs.docker.outputs.app_built == 'true'
    name: Deploy to Hetzner via Kamal
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Ubuntu runners generally ship gettext-base already, but don't rely
      # on it — apt-get is fast and idempotent either way.
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Load the deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_KEY }}

      - name: Trust the VPS host key
        run: mkdir -p ~/.ssh && ssh-keyscan -H "${{ vars.KAMAL_SERVER_IP }}" >> ~/.ssh/known_hosts

      # Same template infra/main.tf's local_file.kamal_deploy_config renders
      # via Terraform's templatefile() — see that template's own header
      # comment for why envsubst produces an identical result here.
      - name: Render config/deploy.yml
        env:
          server_ip: ${{ vars.KAMAL_SERVER_IP }}
          ghcr_username: ${{ vars.KAMAL_REGISTRY_USERNAME }}
        run: envsubst < infra/templates/deploy.yml.tftpl > config/deploy.yml

      - name: Deploy via Kamal
        env:
          RELEASE: ${{ github.sha }}
          DB_DSN: ${{ secrets.KAMAL_DB_DSN }}
          GOTRUE_URL: http://gotrue:9999
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          SUPABASE_PROJ_REF: ${{ secrets.SUPABASE_PROJ_REF }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Not GITHUB_OAUTH_CLIENT_*: GitHub Actions rejects secret names
          # starting with GITHUB_. The app-level env var name Kamal sets on
          # the container is unaffected — only this secret's storage name
          # needed the prefix.
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.KAMAL_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.KAMAL_GITHUB_OAUTH_CLIENT_SECRET }}
          SENTRY_OAUTH_CLIENT_ID: ${{ secrets.SENTRY_OAUTH_CLIENT_ID }}
          SENTRY_OAUTH_CLIENT_SECRET: ${{ secrets.SENTRY_OAUTH_CLIENT_SECRET }}
          DO_OAUTH_CLIENT_ID: ${{ secrets.DO_OAUTH_CLIENT_ID }}
          DO_OAUTH_CLIENT_SECRET: ${{ secrets.DO_OAUTH_CLIENT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          EMAIL_INBOUND_DOMAIN: ${{ secrets.EMAIL_INBOUND_DOMAIN }}
          EMAIL_INBOUND_SECRET: ${{ secrets.EMAIL_INBOUND_SECRET }}
        # No --version pin: an earlier version used github.sha's short form
        # to match docker.yml's tag, but that's fragile (depends on
        # docker/metadata-action's default format staying 7 chars) for no
        # real benefit. No --version falls back to Kamal's own "latest"
        # tag, which docker.yml always pushes right before this job runs —
        # and reusing that name across deploys doesn't skip the
        # health-gated blue-green swap (Kamal renames a same-named existing
        # container aside first — see infra/main.tf's
        # null_resource.kamal_deploy for the full explanation, verified by
        # reading Kamal::Cli::App::Boot's source).
        run: bundle exec kamal deploy --skip-push
