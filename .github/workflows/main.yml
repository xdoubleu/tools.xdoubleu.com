name: Main Workflow

permissions:
  actions: write
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      proto: ${{ steps.proto-workflows.outputs.proto }}
      workflows: ${{ steps.proto-workflows.outputs.workflows }}
      kobo_gateway: ${{ steps.filter.outputs.kobo_gateway }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v7
      # 'every' requires a file to match every listed pattern, so
      # '!api/**/*.md' actually scopes to "and isn't an api/ doc". The
      # default ('some', plain OR across all patterns) made a lone negation
      # match any file outside api/ too, since such a file trivially isn't
      # api/**/*.md — that tripped these filters on completely unrelated
      # changes (#740). 'some-with-excludes' would express this more
      # directly but isn't supported by the pinned v4 release.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            api:
              - 'api/**'
              - '!api/**/*.md'
            web:
              - 'web/**'
              - '!web/**/*.md'
            # The kobo-gateway binary ships inside the WEB image (served as
            # a download), so kobo-gateway code changes must rebuild web too.
            # It's its own Go module (kobo-gateway/) — cgo + AppKit, built
            # separately on macOS (see build-kobo-gateway.yml), not part of
            # api/.
            kobo_gateway:
              - 'kobo-gateway/**'
              - '!kobo-gateway/**/*.md'
            # gateway/ is an ordinary Go module (routing + process
            # supervision, no cgo) that builds as a normal Docker stage
            # alongside api/web — unlike kobo_gateway above, it doesn't need
            # to feed build-web.
            gateway:
              - 'gateway/**'
              - '!gateway/**/*.md'
      # Separate step: these filters are a plain OR of positive-only
      # patterns, so they need the default 'some' quantifier, not 'every'.
      - uses: dorny/paths-filter@v4
        id: proto-workflows
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'api/buf.gen.yaml'
              - 'web/buf.gen.yaml'
            workflows:
              - '.github/workflows/**'

  proto-check:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Proto Staleness Check Workflow
    uses: ./.github/workflows/proto-check.yml
    secrets: inherit

  # Each build-* job is gated on its OWN subtree only (issue #948) — unlike
  # docker-check/docker below, which still need every job's *result* since
  # the merged image needs a current binary for all four. A job that's
  # skipped here just means docker.yml restores that component's binary
  # straight from its actions/cache entry (same key this workflow writes)
  # instead of a same-run artifact — see docker.yml's docker-app job.
  build-api:
    needs: [changes, proto-check]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build API Workflow
    uses: ./.github/workflows/build-api.yml
    secrets: inherit

  # kobo_gateway is deliberately not in this gate: web's own `npm run
  # build` has no dependency on kobo-gateway/ source (docker.yml copies the
  # .dmg into web/public/downloads AFTER build-web.yml already ran).
  build-web:
    needs: [changes, proto-check]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Web Workflow
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  # gateway/ is a standalone Go module with no proto dependency, unlike
  # api/web — so this doesn't need proto-check as a gate.
  build-gateway:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Gateway Workflow
    uses: ./.github/workflows/build-gateway.yml
    secrets: inherit

  # Builds/packages kobo-gateway on a macOS runner (cgo + AppKit, can't
  # cross-compile from Linux — see build-kobo-gateway.yml).
  build-kobo-gateway:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Kobo Gateway Workflow
    uses: ./.github/workflows/build-kobo-gateway.yml
    secrets: inherit

  api-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: API Lint Workflow
    uses: ./.github/workflows/api-lint.yml
    secrets: inherit

  web-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Web Lint Workflow
    uses: ./.github/workflows/web-lint.yml
    secrets: inherit

  gateway-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Gateway Lint Workflow
    uses: ./.github/workflows/gateway-lint.yml
    secrets: inherit

  kobo-gateway-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Kobo Gateway Lint Workflow
    uses: ./.github/workflows/kobo-gateway-lint.yml
    secrets: inherit

  api-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: API Test Workflow
    uses: ./.github/workflows/api-test.yml
    secrets: inherit

  web-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Web Test Workflow
    uses: ./.github/workflows/web-test.yml
    secrets: inherit

  gateway-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.gateway == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Gateway Test Workflow
    uses: ./.github/workflows/gateway-test.yml
    secrets: inherit

  kobo-gateway-test:
    needs: changes
    # Runs on push to main too (in parallel with docker/deploy, which do not
    # depend on it) purely to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Kobo Gateway Test Workflow
    uses: ./.github/workflows/kobo-gateway-test.yml
    secrets: inherit

  # Build-only (no push) validation of the merged Docker image on PRs, so a
  # break that only shows up inside the Dockerfile's narrower file set (e.g.
  # issue #900 — a test file colocated outside the copied dirs) is caught
  # before merge instead of after, when `docker.yml`'s real push-and-deploy
  # run is the first thing to build it.
  docker-check:
    needs: [changes, build-api, build-web, build-gateway, build-kobo-gateway]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.kobo_gateway == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.workflows == 'true') &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-gateway.result == 'success' || needs.build-gateway.result == 'skipped') &&
      (needs.build-kobo-gateway.result == 'success' || needs.build-kobo-gateway.result == 'skipped')
    name: Docker Build Check Workflow
    uses: ./.github/workflows/docker.yml
    with:
      build_app: true
      push: false
    secrets: inherit

  ci-pass:
    needs:
      [
        proto-check,
        build-api,
        build-web,
        build-gateway,
        build-kobo-gateway,
        docker-check,
        api-lint,
        web-lint,
        gateway-lint,
        kobo-gateway-lint,
        api-test,
        web-test,
        gateway-test,
        kobo-gateway-test,
      ]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done

      # codecov.yml sets `manual_trigger: true`, so Codecov posts no statuses/comment
      # until we tell it to here — once every test job has uploaded. This avoids the
      # stale carried-forward status Codecov used to post off the first upload (#403).
      # `send-notifications` accepting the call doesn't guarantee Codecov's backend
      # actually creates the check-runs — it occasionally no-ops (#540) — so this
      # re-sends the trigger periodically while polling instead of firing it once.
      # Guarded so there's nothing to trigger or wait for when no test job ran.
      - name: Trigger and wait for Codecov to report
        if: |
          needs.api-test.result == 'success' ||
          needs.web-test.result == 'success' ||
          needs.gateway-test.result == 'success' ||
          needs.kobo-gateway-test.result == 'success'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PRs: notify/wait on the head commit, not the merge commit github.sha exposes.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pip install --quiet codecov-cli

          send_notifications() {
            codecovcli send-notifications --commit-sha "$SHA" --slug "$REPO" --git-service github
          }

          # Codecov reports via the Checks API (codecov/patch, codecov/project),
          # not the legacy commit-status API, so poll check-runs.
          send_notifications
          last_trigger=$(date +%s)
          retry_interval=200
          echo "Waiting for Codecov checks on $SHA"
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            checks=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name | startswith("codecov")) | "\(.name)=\(.status):\(.conclusion)"')

            if [[ -z "$checks" ]]; then
              echo "No Codecov checks yet; waiting..."
              if (( $(date +%s) - last_trigger >= retry_interval )); then
                echo "Re-sending Codecov notify trigger..."
                send_notifications
                last_trigger=$(date +%s)
              fi
            else
              echo "$checks"
              if echo "$checks" | grep -qv '=completed:'; then
                echo "Codecov checks still running..."
              elif echo "$checks" | grep -qvE '=completed:(success|neutral|skipped)$'; then
                echo "Codecov reported a failing check."
                exit 1
              else
                echo "All Codecov checks succeeded."
                exit 0
              fi
            fi

            if [[ $(date +%s) -ge $deadline ]]; then
              echo "Timed out waiting for Codecov to report."
              exit 1
            fi
            sleep 15
          done

  docker:
    needs: [changes, build-api, build-web, build-gateway, build-kobo-gateway]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-gateway.result == 'success' || needs.build-gateway.result == 'skipped') &&
      (needs.build-kobo-gateway.result == 'success' || needs.build-kobo-gateway.result == 'skipped')
    name: Docker Build & Push Workflow
    uses: ./.github/workflows/docker.yml
    with:
      # Union of both former conditions (api ∨ web) — one merged image
      # (issue #558) means any change that would have rebuilt either
      # component now rebuilds the single one.
      build_app: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.proto == 'true' || needs.changes.outputs.kobo_gateway == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.workflows == 'true' }}
    secrets: inherit

  deploy:
    needs: [docker]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker.result == 'success' &&
      needs.docker.outputs.app_built == 'true'
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Digital Ocean deployment and wait for it to finish
        env:
          DO_ACCESS_TOKEN: ${{ secrets.DO_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          deployment=$(curl -sf -X POST \
            -H "Authorization: Bearer $DO_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments")
          deployment_id=$(echo "$deployment" | jq -r '.deployment.id')
          echo "Triggered deployment $deployment_id"

          # Poll until the deployment reaches a terminal phase so a failed
          # rollout fails this job instead of only firing a DO alert.
          deadline=$(( $(date +%s) + 1200 ))
          while true; do
            phase=$(curl -sf \
              -H "Authorization: Bearer $DO_ACCESS_TOKEN" \
              "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments/$deployment_id" \
              | jq -r '.deployment.phase')
            echo "Deployment phase: $phase"
            case "$phase" in
              ACTIVE|SUPERSEDED)
                echo "Deployment finished."
                exit 0
                ;;
              ERROR|CANCELED)
                echo "Deployment failed with phase $phase."
                exit 1
                ;;
            esac
            if [[ $(date +%s) -ge $deadline ]]; then
              echo "Timed out waiting for deployment to finish."
              exit 1
            fi
            sleep 15
          done
