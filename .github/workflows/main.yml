name: Main Workflow

permissions:
  actions: write
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      proto: ${{ steps.proto-workflows.outputs.proto }}
      workflows: ${{ steps.proto-workflows.outputs.workflows }}
      kobo_gateway: ${{ steps.filter.outputs.kobo_gateway }}
      sentrytools: ${{ steps.filter.outputs.sentrytools }}
      infra: ${{ steps.filter.outputs.infra }}
      config_api: ${{ steps.filter.outputs.config_api }}
      config_web: ${{ steps.filter.outputs.config_web }}
      config_grafana: ${{ steps.filter.outputs.config_grafana }}
      grafana_dockerfile: ${{ steps.proto-workflows.outputs.grafana_dockerfile }}
    steps:
      - uses: actions/checkout@v7
      # 'every' makes '!api/**/*.md' mean "and isn't an api/ doc"; under the
      # default 'some', a lone negation matches every file outside api/.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            api:
              - 'api/**'
              - '!api/**/*.md'
            web:
              - 'web/**'
              - '!web/**/*.md'
            # The kobo-gateway binary ships inside the web image, so it rebuilds web.
            kobo_gateway:
              - 'kobo-gateway/**'
              - '!kobo-gateway/**/*.md'
            # Standalone module pulled into api/ via `replace`; the api gate ORs it in.
            sentrytools:
              - 'sentrytools/**'
              - '!sentrytools/**/*.md'
            infra:
              - 'infra/**'
              - '!infra/**/*.md'
            # Config-only changes still need a fresh :<sha> image for Kamal to deploy.
            config_api:
              - 'config/deploy.api.yml'
            config_web:
              - 'config/deploy.web.yml'
            # Also gates build-grafana and api-lint's `make lint/kamal-secrets`.
            config_grafana:
              - 'config/deploy.grafana.yml'
      # Positive-only multi-pattern filters need 'some': under 'every' they
      # can never match.
      - uses: dorny/paths-filter@v4
        id: proto-workflows
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'api/buf.gen.yaml'
              - 'web/buf.gen.yaml'
            workflows:
              - '.github/workflows/**'
            # Rebuilds the Grafana wrapper image when its Dockerfile or baked-in
            # provisioning changes.
            grafana_dockerfile:
              - 'infra/grafana.Dockerfile'
              - 'infra/grafana/**'
              - 'scripts/validate_grafana_dashboards.py'
              - 'scripts/verify_grafana_image.sh'

  proto-check:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Proto Staleness Check Workflow
    uses: ./.github/workflows/proto-check.yml
    secrets: inherit

  # Each build-* job is gated on its own subtree; a skipped build leaves Kamal
  # deploying the last pushed tag for that component.
  build-api:
    needs: [changes, proto-check]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.config_api == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build API Workflow
    uses: ./.github/workflows/build-api.yml
    secrets: inherit

  # Grafana wrapper image (see infra/grafana.Dockerfile).
  build-grafana:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.grafana_dockerfile == 'true' ||
      needs.changes.outputs.config_grafana == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Grafana Workflow
    uses: ./.github/workflows/build-grafana.yml
    secrets: inherit

  # build-web stages the kobo-gateway-dist artifact into the image, so it
  # needs build-kobo-gateway to have succeeded (not skipped); that job's gate
  # is a superset of this one.
  build-web:
    needs: [changes, proto-check, build-kobo-gateway]
    if: |
      always() &&
      (needs.proto-check.result == 'success' || needs.proto-check.result == 'skipped') &&
      needs.build-kobo-gateway.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.config_web == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Web Workflow
    uses: ./.github/workflows/build-web.yml
    secrets: inherit

  # macOS runner (cgo + AppKit). Gated like build-web so it never skips when
  # build-web needs its artifact; unchanged sources cache-hit.
  build-kobo-gateway:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.config_web == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Build Kobo Gateway Workflow
    uses: ./.github/workflows/build-kobo-gateway.yml
    secrets: inherit

  api-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.config_api == 'true' ||
      needs.changes.outputs.config_web == 'true' ||
      needs.changes.outputs.config_grafana == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: API Lint Workflow
    uses: ./.github/workflows/api-lint.yml
    secrets: inherit

  web-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Web Lint Workflow
    uses: ./.github/workflows/web-lint.yml
    secrets: inherit

  kobo-gateway-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Kobo Gateway Lint Workflow
    uses: ./.github/workflows/kobo-gateway-lint.yml
    secrets: inherit

  api-test:
    needs: changes
    # Also runs on main to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: API Test Workflow
    uses: ./.github/workflows/api-test.yml
    secrets: inherit

  web-test:
    needs: changes
    # Also runs on main to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.proto == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Web Test Workflow
    uses: ./.github/workflows/web-test.yml
    secrets: inherit

  kobo-gateway-test:
    needs: changes
    # Also runs on main to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kobo_gateway == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Kobo Gateway Test Workflow
    uses: ./.github/workflows/kobo-gateway-test.yml
    secrets: inherit

  # No deployable artifact, but linted/tested standalone.
  sentrytools-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Sentrytools Lint Workflow
    uses: ./.github/workflows/sentrytools-lint.yml
    secrets: inherit

  # Pre-merge gate: infra-apply would not fail on a malformed prometheus.yml
  # (Prometheus just crash-loops).
  infra-lint:
    needs: changes
    if: |
      github.event_name != 'push' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.infra == 'true' ||
      needs.changes.outputs.workflows == 'true')
    name: Infra Lint Workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # tofu_wrapper off so lint_infra.sh sees real exit codes.
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: make lint/infra
        run: make lint/infra

  sentrytools-test:
    needs: changes
    # Also runs on main to refresh Codecov's default-branch baseline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.sentrytools == 'true' ||
      needs.changes.outputs.workflows == 'true'
    name: Sentrytools Test Workflow
    uses: ./.github/workflows/sentrytools-test.yml
    secrets: inherit

  # Unconditional: a conflict marker can land in any file type.
  conflict-markers:
    if: github.event_name != 'push'
    name: Conflict Marker Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: make lint/conflict-markers
        run: make lint/conflict-markers

  # Unconditional: workflow edits can land alongside any change.
  workflow-lint:
    if: github.event_name != 'push'
    name: GitHub Actions Workflow Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: make lint/workflows
        run: make lint/workflows

  # Unconditional: invalid frontmatter makes harnesses silently drop a skill.
  skills-lint:
    if: github.event_name != 'push'
    name: Agent Skill Frontmatter Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: make lint/skills
        run: make lint/skills

  docs-lint:
    if: github.event_name != 'push'
    name: Docs and Comments Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: make lint/docs
        run: make lint/docs
        env:
          BASE_REF: origin/${{ github.base_ref }}

  ci-pass:
    needs:
      [
        proto-check,
        build-api,
        build-web,
        build-grafana,
        build-kobo-gateway,
        api-lint,
        web-lint,
        kobo-gateway-lint,
        sentrytools-lint,
        infra-lint,
        api-test,
        web-test,
        kobo-gateway-test,
        sentrytools-test,
        conflict-markers,
        workflow-lint,
        skills-lint,
        docs-lint,
      ]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done

      # codecov.yml sets `manual_trigger: true`, so Codecov reports nothing until
      # triggered here. The trigger sometimes no-ops, so it's re-sent while polling.
      - name: Trigger and wait for Codecov to report
        if: |
          needs.api-test.result == 'success' ||
          needs.web-test.result == 'success' ||
          needs.kobo-gateway-test.result == 'success' ||
          needs.sentrytools-test.result == 'success'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PRs: use the head commit, not the merge commit.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pip install --quiet codecov-cli

          send_notifications() {
            codecovcli send-notifications --commit-sha "$SHA" --slug "$REPO" --git-service github
          }

          # Codecov reports via the Checks API, so poll check-runs.
          send_notifications
          last_trigger=$(date +%s)
          retry_interval=200
          echo "Waiting for Codecov checks on $SHA"
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            checks=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name | startswith("codecov")) | "\(.name)=\(.status):\(.conclusion)"')

            if [[ -z "$checks" ]]; then
              echo "No Codecov checks yet; waiting..."
              if (( $(date +%s) - last_trigger >= retry_interval )); then
                echo "Re-sending Codecov notify trigger..."
                send_notifications
                last_trigger=$(date +%s)
              fi
            else
              echo "$checks"
              if echo "$checks" | grep -qv '=completed:'; then
                echo "Codecov checks still running..."
              elif echo "$checks" | grep -qvE '=completed:(success|neutral|skipped)$'; then
                echo "Codecov reported a failing check."
                exit 1
              else
                echo "All Codecov checks succeeded."
                exit 0
              fi
            fi

            if [[ $(date +%s) -ge $deadline ]]; then
              echo "Timed out waiting for Codecov to report."
              exit 1
            fi
            sleep 15
          done

  # The only production deploy. Runs `kamal deploy`, so the host must have been
  # bootstrapped once with `kamal setup` (infra/README.md). Waits for the build
  # jobs and infra-apply (success-or-skipped). The concurrency group is not
  # ref-scoped: concurrent `kamal deploy`s on one host fail on the lock or
  # racing pulls, and cancelling mid-deploy would leave a half-applied release.
  deploy-kamal:
    needs: [build-api, build-web, build-grafana, infra-apply]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-grafana.result == 'success' || needs.build-grafana.result == 'skipped') &&
      (needs.infra-apply.result == 'success' || needs.infra-apply.result == 'skipped')
    concurrency:
      group: hetzner-vps-deploy
      cancel-in-progress: false
    name: Deploy to Hetzner via Kamal
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true

      # Not webfactory/ssh-agent: it breaks on a secret missing its trailing
      # newline. printf restores it, tr drops CRs; the agent keeps net-ssh from
      # parsing the ed25519 key itself.
      - name: Load the deploy SSH key
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          if ! printf '%s\n' "$KAMAL_SSH_KEY" | tr -d '\r' | ssh-add -; then
            echo "::error::KAMAL_SSH_KEY is not a loadable unencrypted private key. Re-set it with: gh secret set KAMAL_SSH_KEY < ~/.ssh/kamal_ci_deploy"
            exit 1
          fi
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

      # KAMAL_SERVER_IP/KAMAL_REGISTRY_USERNAME are Secrets (public repo; only
      # Secrets are masked), always routed through `env:`.
      # No `-H`: SSHKit's known_hosts parser stops at the first matching hashed
      # line, so only ssh-rsa would be trusted.
      - name: Trust the VPS host key
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
        run: mkdir -p ~/.ssh && ssh-keyscan "$KAMAL_SERVER_IP" >> ~/.ssh/known_hosts

      # Kamal evaluates config/deploy.*.yml as ERB with the env below; --version
      # is the full commit SHA the build jobs tag with.
      # web deploys first (ADR 0001): kamal-proxy needs TLS established by the
      # root-path service before api can register. Skipped when build-web didn't
      # run, since no web:<sha> tag exists.
      - name: Deploy web via Kamal
        if: needs.build-web.result == 'success'
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_VERSION: ${{ github.sha }}
          RELEASE: ${{ github.sha }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
          # See config/deploy.web.yml.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          # Gates GET /metrics on web; see config/deploy.web.yml.
          OBSERVABILITY_INGEST_SECRET: ${{ secrets.OBSERVABILITY_INGEST_SECRET }}
        run: bundle exec kamal deploy -c config/deploy.web.yml --skip-push --version="$KAMAL_VERSION"

      # After web (see above); skipped when build-api didn't run.
      - name: Deploy api via Kamal
        if: needs.build-api.result == 'success'
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_VERSION: ${{ github.sha }}
          RELEASE: ${{ github.sha }}
          DB_DSN: ${{ secrets.KAMAL_DB_DSN }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          # See config/deploy.api.yml.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH_HMAC_SECRET: ${{ secrets.OAUTH_HMAC_SECRET }}
          # See config/deploy.api.yml.
          OAUTH_OIDC_PRIVATE_KEY: ${{ secrets.OAUTH_OIDC_PRIVATE_KEY }}
          OAUTH_GRAFANA_CLIENT_SECRET: ${{ secrets.OAUTH_GRAFANA_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
          BMC_PARTNER_KEY: ${{ secrets.BMC_PARTNER_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # GitHub Actions rejects secret names starting with GITHUB_.
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.KAMAL_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.KAMAL_GITHUB_OAUTH_CLIENT_SECRET }}
          SENTRY_OAUTH_CLIENT_ID: ${{ secrets.SENTRY_OAUTH_CLIENT_ID }}
          SENTRY_OAUTH_CLIENT_SECRET: ${{ secrets.SENTRY_OAUTH_CLIENT_SECRET }}
          TODOIST_OAUTH_CLIENT_ID: ${{ secrets.TODOIST_OAUTH_CLIENT_ID }}
          TODOIST_OAUTH_CLIENT_SECRET: ${{ secrets.TODOIST_OAUTH_CLIENT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          EMAIL_INBOUND_DOMAIN: ${{ secrets.EMAIL_INBOUND_DOMAIN }}
          EMAIL_INBOUND_SECRET: ${{ secrets.EMAIL_INBOUND_SECRET }}
          # See config/deploy.api.yml.
          OBSERVABILITY_INGEST_SECRET: ${{ secrets.OBSERVABILITY_INGEST_SECRET }}
          # Grafana's admin password; get_grafana_alerts authenticates with it.
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          # See config/deploy.api.yml.
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          # notify_slack's webhook; distinct from GRAFANA_SLACK_WEBHOOK_URL.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec kamal deploy -c config/deploy.api.yml --skip-push --version="$KAMAL_VERSION"

      # Order vs api/web doesn't matter; last so its OAuth login hits the newest
      # api. Skipped when build-grafana didn't run.
      - name: Deploy grafana via Kamal
        if: needs.build-grafana.result == 'success'
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_VERSION: ${{ github.sha }}
          RELEASE: ${{ github.sha }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          # Same secret as OAUTH_GRAFANA_CLIENT_SECRET (see .kamal/secrets).
          GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GRAFANA_CLIENT_SECRET }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          # Reuses the api mailer's Resend account.
          GF_SMTP_PASSWORD: ${{ secrets.RESEND_API_KEY }}
          GF_SMTP_FROM_ADDRESS: ${{ secrets.EMAIL_FROM }}
          # Consumed by infra/grafana/provisioning/alerting/contactpoints.yml.
          GRAFANA_SLACK_WEBHOOK_URL: ${{ secrets.GRAFANA_SLACK_WEBHOOK_URL }}
          # Consumed by infra/grafana/provisioning/datasources/issue-signals.yml.
          GRAFANA_GITHUB_DATASOURCE_TOKEN: ${{ secrets.GRAFANA_GITHUB_DATASOURCE_TOKEN }}
          GRAFANA_SENTRY_DATASOURCE_TOKEN: ${{ secrets.GRAFANA_SENTRY_DATASOURCE_TOKEN }}
          # Consumed by contactpoints.yml's "routine-fire" contact point.
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: bundle exec kamal deploy -c config/deploy.grafana.yml --skip-push --version="$KAMAL_VERSION"

  # Applies infra/ (state in Cloudflare R2). harden.sh and the Postgres
  # provisioner mutate the box in place, so this snapshots the VPS first and
  # rebuilds from the snapshot if apply fails (lossy rollback, no approval
  # gate). Waits for build jobs only; test flakiness says nothing about infra.
  infra-apply:
    needs: [changes, build-api, build-web, build-kobo-gateway]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true') &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-kobo-gateway.result == 'success' || needs.build-kobo-gateway.result == 'skipped')
    # Shares deploy-kamal's group: both SSH into the same host.
    concurrency:
      group: hetzner-vps-deploy
      cancel-in-progress: false
    name: Apply Infra via OpenTofu
    runs-on: ubuntu-latest
    # Bounds a stuck snapshot poll holding the concurrency group.
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2

      # Same key as deploy-kamal; already authorized for Tofu's provisioners.
      - name: Load the deploy SSH key
        env:
          KAMAL_SSH_KEY: ${{ secrets.KAMAL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          if ! printf '%s\n' "$KAMAL_SSH_KEY" | tr -d '\r' | ssh-add -; then
            echo "::error::KAMAL_SSH_KEY is not a loadable unencrypted private key."
            exit 1
          fi
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

      - name: Trust the VPS host key
        env:
          KAMAL_SERVER_IP: ${{ secrets.KAMAL_SERVER_IP }}
        run: mkdir -p ~/.ssh && ssh-keyscan "$KAMAL_SERVER_IP" >> ~/.ssh/known_hosts

      # endpoints.s3 embeds the Cloudflare account ID (see infra/backend.hcl.example).
      - name: tofu init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
        run: |
          cat > backend.hcl <<EOF
          endpoints = { s3 = "$TF_STATE_R2_ENDPOINT" }
          EOF
          tofu init -backend-config=backend.hcl

      # create_image is async: poll until ready (can take >5 minutes) before
      # publishing image_id, so a restore never uses a half-built image. Labeled
      # so pruning only touches CI snapshots.
      - name: Snapshot the VPS before applying
        id: snapshot
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          INFRA_SERVER_ID: ${{ secrets.INFRA_SERVER_ID }}
        run: |
          response=$(curl -sf -X POST "https://api.hetzner.cloud/v1/servers/$INFRA_SERVER_ID/actions/create_image" \
            -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
            -d '{"type":"snapshot","description":"ci-pre-apply","labels":{"purpose":"ci-pre-apply"}}')
          image_id=$(echo "$response" | jq -r '.image.id')
          action_id=$(echo "$response" | jq -r '.action.id')

          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            status=$(curl -sf "https://api.hetzner.cloud/v1/actions/$action_id" \
              -H "Authorization: Bearer $HCLOUD_TOKEN" | jq -r '.action.status')
            [[ "$status" == "success" ]] && break
            if [[ "$status" == "error" || $(date +%s) -ge $deadline ]]; then
              echo "::error::Pre-apply snapshot did not complete (status: $status). Refusing to apply without a rollback point."
              exit 1
            fi
            sleep 10
          done

          # Only publish once ready (see above).
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: tofu apply
        env:
          # apply doesn't inherit init's env, so repeat the R2 credentials.
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_server_id: ${{ secrets.INFRA_SERVER_ID }}
          TF_VAR_server_ip: ${{ secrets.KAMAL_SERVER_IP }}
          TF_VAR_deploy_ssh_public_keys: ${{ vars.INFRA_DEPLOY_SSH_PUBLIC_KEYS }}
          TF_VAR_release_check_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_release_check_email_from: ${{ secrets.EMAIL_FROM }}
          TF_VAR_release_check_email_to: ${{ secrets.NOTIFY_EMAIL_TO }}
          # Lets infra/prometheus.yml's `web` job authenticate GET /metrics.
          TF_VAR_observability_ingest_secret: ${{ secrets.OBSERVABILITY_INGEST_SECRET }}
        run: tofu apply -auto-approve -input=false

      # The job stays failed; this only restores the box.
      - name: Restore snapshot on failure
        if: failure() && steps.snapshot.outputs.image_id != ''
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          INFRA_SERVER_ID: ${{ secrets.INFRA_SERVER_ID }}
          IMAGE_ID: ${{ steps.snapshot.outputs.image_id }}
        run: |
          echo "::error::tofu apply failed — rebuilding the VPS from the pre-apply snapshot ($IMAGE_ID). This is a lossy restore: a few minutes of downtime, and anything written since the snapshot is gone."
          curl -sf -X POST "https://api.hetzner.cloud/v1/servers/$INFRA_SERVER_ID/actions/rebuild" \
            -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
            -d "{\"image\":$IMAGE_ID}"

      # Keep the newest 5 CI snapshots (label-scoped, never manual ones).
      - name: Prune old CI snapshots
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          curl -sf "https://api.hetzner.cloud/v1/images?type=snapshot&label_selector=purpose=ci-pre-apply&sort=created:desc" \
            -H "Authorization: Bearer $HCLOUD_TOKEN" \
            | jq -r '.images[5:] | .[].id' \
            | while read -r id; do
                curl -sf -X DELETE "https://api.hetzner.cloud/v1/images/$id" \
                  -H "Authorization: Bearer $HCLOUD_TOKEN"
              done

  # main deploys without re-testing, so a red push-to-main job fires the
  # red-pr-repair routine immediately via /webhooks/grafana-alert
  # (api/cmd/api/routines_webhook.go) rather than waiting for its schedule.
  # `needs` lists every push-to-main job so `always()` waits for all of them.
  notify-main-ci-red:
    needs:
      [
        build-api,
        build-web,
        build-grafana,
        build-kobo-gateway,
        api-test,
        web-test,
        kobo-gateway-test,
        sentrytools-test,
        infra-apply,
        deploy-kamal,
      ]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.*.result, 'failure')
    name: Notify red-pr-repair of a red main branch
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      # labels.routine picks the routine to fire; same payload shape as
      # contactpoints.yml's routine-fire contact point.
      - name: POST failing-job context to the routine-fire webhook
        env:
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          NEEDS_JSON: ${{ toJson(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          failing_jobs=$(echo "$NEEDS_JSON" | jq -r '
            to_entries | map(select(.value.result == "failure")) | map(.key) | join(", ")
          ')
          payload=$(jq -n \
            --arg summary "main branch CI is red" \
            --arg description "Push to main at $COMMIT_SHA failed. Failing job(s): $failing_jobs. Run: $RUN_URL" \
            --arg url "$RUN_URL" \
            '{
              status: "firing",
              alerts: [{
                status: "firing",
                labels: {alertname: "MainCIRed", routine: "red-pr-repair"},
                annotations: {summary: $summary, description: $description},
                generatorURL: $url
              }]
            }')
          curl -sf -X POST "https://tools.xdoubleu.com/api/webhooks/grafana-alert" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"
