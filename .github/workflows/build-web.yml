name: Build Web Workflow

# No workflow_dispatch: the kobo-gateway-dist artifact only exists when
# main.yml ran build-kobo-gateway in the same run. Dispatch main.yml instead.
on:
  workflow_call:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Built on macOS by build-kobo-gateway in this run. Its RELEASE file may be
      # older than this SHA when that build cache-hit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kobo-gateway-dist
          path: kobo-gateway/dist/kobo-gateway

      - name: Arrange kobo-gateway files for the Docker build context
        run: |
          mkdir -p web/public/downloads
          cp -r kobo-gateway/dist/kobo-gateway/. web/public/downloads/

      - name: Read kobo-gateway's bundled release
        id: kobo-gateway-release
        run: |
          value=$(cat web/public/downloads/RELEASE)
          echo "value=$value" >> "$GITHUB_OUTPUT"
          rm web/public/downloads/RELEASE

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Only needed to push; PRs build without pushing.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # next.config.ts inlines RELEASE into NEXT_PUBLIC_RELEASE for Sentry.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          # Kamal's `validate_image` requires this label (we build with buildx and
          # deploy with --skip-push). Must match `service:` in config/deploy.web.yml.
          labels: service=tools-xdoubleu-com-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            KOBO_GATEWAY_RELEASE=${{ steps.kobo-gateway-release.outputs.value }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
