name: Build Web Workflow

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # kobo-gateway.dmg + the raw binary, built on macOS by
      # build-kobo-gateway.yml earlier in this same workflow run (see
      # kobo-gateway/cmd/kobo-gateway/menubar_darwin.go for why it can't
      # build here). The RELEASE file records the actual release baked into
      # this artifact — can be older than this build's SHA when
      # kobo-gateway/ was unchanged and its build was cache-skipped.
      # Downloaded as an artifact rather than restored from
      # build-kobo-gateway.yml's own cache key: that used to race the other
      # job's cache-populating save, which only ran in its post-job step at
      # the very end of its run, while this restore fired almost
      # immediately (issue #1192). An artifact produced by a job this one
      # `needs:` (main.yml) has no such race — it's simply unavailable
      # until that job finishes, same as any other build dependency.
      # Staged here (rather than in the now-deleted docker.yml assembly
      # job) since web/Dockerfile is the sole assembler of web/public/
      # since #1038.
      - uses: actions/download-artifact@v8
        with:
          name: kobo-gateway-dist
          path: kobo-gateway/dist/kobo-gateway

      - name: Arrange kobo-gateway files for the Docker build context
        run: |
          mkdir -p web/public/downloads
          cp -r kobo-gateway/dist/kobo-gateway/. web/public/downloads/

      - name: Read kobo-gateway's bundled release
        id: kobo-gateway-release
        run: |
          value=$(cat web/public/downloads/RELEASE)
          echo "value=$value" >> "$GITHUB_OUTPUT"
          rm web/public/downloads/RELEASE

      - uses: docker/setup-buildx-action@v4
      # Only needed to push — PRs build (validating the image compiles) but
      # never push, and node:24-alpine is public, so no auth is needed to
      # pull it.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # web reads RELEASE from the container env at runtime (web/lib/env.ts)
      # for its own app code, but next.config.ts still inlines it into
      # NEXT_PUBLIC_RELEASE for the Sentry release tag on server/edge error
      # reports — so a reused (unchanged) image correctly keeps tagging
      # errors with whatever release web/ last actually changed at, same
      # per-component-release philosophy as web/components/Footer.tsx.
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          # Kamal's `validate_image` step (kamal build/deploy) rejects any
          # image pulled without this exact label — it normally stamps it
          # itself via `kamal build`, but we build via buildx directly and
          # deploy with --skip-push. Must match `service:` in
          # config/deploy.web.yml.
          labels: service=tools-xdoubleu-com-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            KOBO_GATEWAY_RELEASE=${{ steps.kobo-gateway-release.outputs.value }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
