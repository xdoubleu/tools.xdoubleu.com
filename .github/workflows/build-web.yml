name: Build Web Workflow

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: docker/setup-buildx-action@v4
      # Only needed to push — PRs build (validating the image compiles) but
      # never push, and node:24-alpine is public, so no auth is needed to
      # pull it.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # web reads RELEASE from the container env at runtime (web/lib/env.ts)
      # for its own app code, but next.config.ts still inlines it into
      # NEXT_PUBLIC_RELEASE for the Sentry release tag on server/edge error
      # reports — so a reused (unchanged) image correctly keeps tagging
      # errors with whatever release web/ last actually changed at, same
      # per-component-release philosophy as web/components/Footer.tsx.
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
