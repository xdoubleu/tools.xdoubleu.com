name: Build Kobo Gateway Workflow

# macOS runner: cgo + AppKit can't cross-compile from Linux.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-kobo-gateway:
    name: Build kobo-gateway (macOS)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: './kobo-gateway/go.mod'
          cache-dependency-path: './kobo-gateway/go.sum'
      # Restore only: PR and dispatch runs control their build outputs, so writing
      # the cache here is poisoning-prone (ADR 0002); save-kobo-gateway-cache.yml
      # writes it. A hit reuses the last build's RELEASE stamp; a miss rebuilds.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: kobo-gateway/dist/kobo-gateway
          # The public key is compiled in, so it's part of the key.
          key: build-kobo-gateway-${{ hashFiles('kobo-gateway/**') }}-${{ vars.KOBO_GATEWAY_UPDATE_PUBKEY }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make dist RELEASE=${{ github.sha }} SENTRY_DSN=${{ secrets.GATEWAY_SENTRY_DSN }} \
            UPDATE_PUBLIC_KEY=${{ vars.KOBO_GATEWAY_UPDATE_PUBKEY }}
          echo -n "${{ github.sha }}" > dist/kobo-gateway/RELEASE
        working-directory: './kobo-gateway'
      # Gateways only install self-updates signed by the release key. Signed
      # only for main (what deploys), after any cache hit, never inside the
      # cached build, so PR code never sees the key.
      - name: Sign the self-update binary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KOBO_GATEWAY_SIGNING_KEY: ${{ secrets.KOBO_GATEWAY_SIGNING_KEY }}
        working-directory: './kobo-gateway'
        run: |
          if [ -z "$KOBO_GATEWAY_SIGNING_KEY" ]; then
            echo "::warning::KOBO_GATEWAY_SIGNING_KEY is unset; gateway self-update stays disabled."
            exit 0
          fi
          go run ./cmd/kobo-sign sign dist/kobo-gateway/kobo-gateway-darwin-arm64
      # build-web downloads this artifact rather than racing a cache save.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kobo-gateway-dist
          path: kobo-gateway/dist/kobo-gateway
          retention-days: 1
