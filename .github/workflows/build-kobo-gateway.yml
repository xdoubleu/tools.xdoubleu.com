name: Build Kobo Gateway Workflow

# kobo-gateway needs cgo + the real AppKit/Xcode SDK for its menu bar (see
# kobo-gateway/cmd/kobo-gateway/menubar_darwin.go), so it can't cross-compile
# from the Linux runners the rest of CI uses — this workflow runs on
# macos-14 (native Apple Silicon) to both compile-check it on PRs and
# produce the .dmg plus raw binary the web image bundles on push to main.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-kobo-gateway:
    name: Build kobo-gateway (macOS)
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: './kobo-gateway/go.mod'
          cache-dependency-path: './kobo-gateway/go.sum'
      # kobo-gateway's RELEASE stamp is baked in at compile time (it's a
      # downloaded binary that runs on a user's machine, no deploy-env to
      # read a version from at runtime — unlike api/gateway/web). A cache
      # hit reuses whatever was built (and stamped) the last time
      # kobo-gateway/ source actually changed, including the RELEASE file
      # below — docker.yml reads that file's contents into the separate
      # KOBO_GATEWAY_RELEASE image env var so downstream consumers (the web
      # update-check) compare against what's actually bundled, not this
      # deploy's overall SHA. See root CLAUDE.md's CI section.
      #
      # Restore and save are split (rather than one actions/cache@v6 step)
      # because this job runs on pull_request with no fork restriction: a
      # pull_request run executes the workflow and build steps from the
      # PR's own head ref, so a fork PR fully controls what ends up in
      # kobo-gateway/dist/kobo-gateway before a save step would persist it
      # — even one that leaves kobo-gateway/**'s tracked source untouched,
      # so the hash key still matches main. Restoring stays unconditional
      # (PR builds, including forks, still get a legitimate cache hit's
      # speed-up); saving is gated to contexts whose build output can be
      # trusted (CodeQL alert #35, actions/cache-poisoning/direct-cache).
      #
      # The save gate also excludes a bare workflow_dispatch run against a
      # non-default ref (CodeQL alert #36, same rule): this workflow's own
      # `workflow_dispatch:` trigger lets anyone with write access pick any
      # branch to dispatch against, including one that never went through
      # review, so an unreviewed branch's build output must not be allowed
      # to poison the shared cache entry either — only a workflow_dispatch
      # explicitly targeting the default branch counts as trusted here.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: kobo-gateway/dist/kobo-gateway
          key: build-kobo-gateway-${{ hashFiles('kobo-gateway/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make dist RELEASE=${{ github.sha }} SENTRY_DSN=${{ secrets.GATEWAY_SENTRY_DSN }}
          echo -n "${{ github.sha }}" > dist/kobo-gateway/RELEASE
        working-directory: './kobo-gateway'
      - if: |
          steps.cache.outputs.cache-hit != 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@v6
        with:
          path: kobo-gateway/dist/kobo-gateway
          key: ${{ steps.cache.outputs.cache-primary-key }}
