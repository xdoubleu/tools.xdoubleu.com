name: Factory Runner Test Workflow

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Factory Runner Test
    runs-on: macos-26
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('factory-runner/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: make test/cov/report
        working-directory: './factory-runner'
      - run: make test/cov/report
        working-directory: './selfupdate'
      - run: make test/cov/report
        working-directory: './wardcase'
      - name: Patch coverage (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        run: |
          for dir in factory-runner selfupdate wardcase; do
            (cd "$dir" && ../scripts/diff_coverage.sh go coverage.out)
          done
