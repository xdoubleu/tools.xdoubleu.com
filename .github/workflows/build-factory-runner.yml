name: Build Factory Runner Workflow

# macOS runner, like kobo-gateway. No build cache: the module is pure Go and
# builds in seconds, so the release stamp is always this commit.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-factory-runner:
    name: Build factory-runner (macOS)
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: './factory-runner/go.mod'
          cache-dependency-path: './factory-runner/go.sum'
      - name: Build
        working-directory: './factory-runner'
        run: |
          make dist RELEASE=${{ github.sha }} \
            UPDATE_PUBLIC_KEY=${{ vars.FACTORY_RUNNER_UPDATE_PUBKEY }}
          echo -n "${{ github.sha }}" > dist/factory-runner-release.txt
      # Runners only install self-updates signed by the release key. Signed only
      # for main (what deploys), by kobo-sign: it signs any file with the key in
      # KOBO_GATEWAY_SIGNING_KEY, and this job points that at the runner's own
      # key, so PR code never sees it.
      - name: Sign the self-update binary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FACTORY_RUNNER_SIGNING_KEY: ${{ secrets.FACTORY_RUNNER_SIGNING_KEY }}
        working-directory: './kobo-gateway'
        run: |
          if [ -z "$FACTORY_RUNNER_SIGNING_KEY" ]; then
            echo "::warning::FACTORY_RUNNER_SIGNING_KEY is unset; runner self-update stays disabled."
            exit 0
          fi
          KOBO_GATEWAY_SIGNING_KEY="$FACTORY_RUNNER_SIGNING_KEY" \
            go run ./cmd/kobo-sign sign ../factory-runner/dist/factory-runner-darwin-arm64
      # build-api downloads this artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-runner-dist
          path: factory-runner/dist
          retention-days: 1

  # The job image (adr-0043). Its ~1.6 GB archive is a release asset keyed by a
  # hash of its inputs plus the ISO week (plugin marketplaces are unpinned),
  # rebuilt only on a miss. Each commit gets a small signed manifest and a .url
  # pointer that build-api stages; the api redirects the archive to it (adr-0042).
  # arm64: the runner Macs are Apple silicon. Signed on main with the runner key.
  build-factory-job-image:
    name: Build factory job image (arm64)
    # Native arm64: no QEMU, so it also builds on PRs to catch a broken image.
    runs-on: ubuntu-26.04-arm
    permissions:
      # Main creates the release holding the archive; PRs only read.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Key the image by its inputs
        id: key
        run: |
          week=$(date -u +%G-%V)
          key=$( (cat factory-runner/Containerfile \
            selfupdate/go.mod selfupdate/go.sum api/go.mod api/go.sum \
            factory-runner/go.mod factory-runner/go.sum \
            kobo-gateway/go.mod kobo-gateway/go.sum \
            web/package.json web/package-lock.json; echo "$week") \
            | sha256sum | cut -c1-16)
          echo "tag=factory-job-image-$key" >> "$GITHUB_OUTPUT"
          if gh release view "factory-job-image-$key" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.key.outputs.hit != 'true'
      - name: Build the OCI archive
        if: steps.key.outputs.hit != 'true'
        run: |
          mkdir -p factory-runner/image
          docker buildx build \
            --platform linux/arm64 \
            --tag factory-job:${{ github.sha }} \
            --output type=oci,dest=factory-runner/image/factory-job-image.tar \
            -f factory-runner/Containerfile .
          sha256sum factory-runner/image/factory-job-image.tar | awk '{print $1}' \
            > factory-runner/image/factory-job-image.sha256
      - name: Publish the archive
        if: steps.key.outputs.hit != 'true' && env.PUBLISH == 'true'
        run: |
          gh release create "${{ steps.key.outputs.tag }}" \
            factory-runner/image/factory-job-image.tar \
            factory-runner/image/factory-job-image.sha256 \
            --target "${{ github.sha }}" --latest=false \
            --title "${{ steps.key.outputs.tag }}" \
            --notes "Factory job image archive (docs/adr-0042). Built by build-factory-runner.yml."
      - name: Fetch the published checksum
        if: steps.key.outputs.hit == 'true'
        run: |
          mkdir -p factory-runner/image
          gh release download "${{ steps.key.outputs.tag }}" \
            -p factory-job-image.sha256 -D factory-runner/image
      - name: Write the manifest and pointer
        run: |
          mkdir -p factory-runner/dist
          sum=$(tr -d '[:space:]' < factory-runner/image/factory-job-image.sha256)
          printf '%s %s\n' "${{ github.sha }}" "$sum" > factory-runner/dist/factory-job-image.txt
          echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.key.outputs.tag }}/factory-job-image.tar" \
            > factory-runner/dist/factory-job-image.tar.url
      - name: Sign the job-image manifest
        if: env.PUBLISH == 'true'
        env:
          FACTORY_RUNNER_SIGNING_KEY: ${{ secrets.FACTORY_RUNNER_SIGNING_KEY }}
        working-directory: './kobo-gateway'
        run: |
          if [ -z "$FACTORY_RUNNER_SIGNING_KEY" ]; then
            echo "::warning::FACTORY_RUNNER_SIGNING_KEY is unset; the job image stays unsigned."
            exit 0
          fi
          KOBO_GATEWAY_SIGNING_KEY="$FACTORY_RUNNER_SIGNING_KEY" \
            go run ./cmd/kobo-sign sign ../factory-runner/dist/factory-job-image.txt
      # build-api stages these small files; the archive is not among them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-runner-image-dist
          path: factory-runner/dist/factory-job-image.*
          retention-days: 1
