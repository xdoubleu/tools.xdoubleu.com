name: Build Factory Runner Workflow

# macOS runner, like kobo-gateway. No build cache: the module is pure Go and
# builds in seconds, so the release stamp is always this commit.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-factory-runner:
    name: Build factory-runner (macOS)
    runs-on: macos-26
    # No `nix develop` shell: its cgo toolchain links /nix/store dylibs that
    # users' Macs lack. Shipped binaries build with the system clang.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: './factory-runner/go.mod'
          cache-dependency-path: './factory-runner/go.sum'
      - name: Build
        working-directory: './factory-runner'
        run: |
          # Jobs run in wardcase's base image of the newest wardcase-v* tag (adr-0043).
          version=$(git ls-remote --tags --refs origin 'wardcase-v*' \
            | sed 's|.*refs/tags/wardcase-v||' | sort -V | tail -n 1)
          # A release must name an image Macs can pull without credentials, never
          # `dev` (adr-0042). Pull requests don't ship, so they may build with it.
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ -z "$version" ]; then
              echo "::error::No wardcase-v* tag exists; publish the wardcase image first (adr-0042)."
              exit 1
            fi
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:xdoubleu/wardcase:pull" \
              | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
            if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' \
              "https://ghcr.io/v2/xdoubleu/wardcase/manifests/$version"; then
              echo "::error::ghcr.io/xdoubleu/wardcase:$version is not pullable anonymously; publish it and make the package public (adr-0042)."
              exit 1
            fi
          fi
          make dist RELEASE=${{ github.sha }} WARDCASE_VERSION="${version:-dev}" \
            UPDATE_PUBLIC_KEY=${{ vars.FACTORY_RUNNER_UPDATE_PUBKEY }}
          echo -n "${{ github.sha }}" > dist/factory-runner-release.txt
      # Runners only install self-updates signed by the release key. Signed only
      # for main (what deploys), by kobo-sign: it signs any file with the key in
      # KOBO_GATEWAY_SIGNING_KEY, and this job points that at the runner's own
      # key, so PR code never sees it.
      - name: Sign the self-update binary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FACTORY_RUNNER_SIGNING_KEY: ${{ secrets.FACTORY_RUNNER_SIGNING_KEY }}
        working-directory: './kobo-gateway'
        run: |
          if [ -z "$FACTORY_RUNNER_SIGNING_KEY" ]; then
            echo "::warning::FACTORY_RUNNER_SIGNING_KEY is unset; runner self-update stays disabled."
            exit 0
          fi
          KOBO_GATEWAY_SIGNING_KEY="$FACTORY_RUNNER_SIGNING_KEY" \
            go run ./cmd/kobo-sign sign ../factory-runner/dist/factory-runner-darwin-arm64
      # build-api downloads this artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: factory-runner-dist
          path: factory-runner/dist
          retention-days: 1
