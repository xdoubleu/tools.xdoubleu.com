name: "CodeQL"

on:
  push:
    branches: ["main"]
    paths: &codeql-paths
      - "api/**"
      - "web/**"
      - "gateway/**"
      - ".github/workflows/**"
      - "!**/*.md"
  pull_request:
    branches: ["main"]
    paths: *codeql-paths

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
