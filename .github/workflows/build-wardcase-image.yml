name: Build Wardcase Image Workflow

# One base image per wardcase release (adr-0055), tagged with the release's
# version: push a tag `wardcase-v<version>`. wardcase always runs the image of its
# own version. A manual run builds without publishing.

on:
  workflow_dispatch:
  push:
    tags:
      - 'wardcase-v*'

jobs:
  build-wardcase-image:
    name: Build wardcase image (arm64)
    # Native arm64: the Macs running wardcase are Apple silicon.
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.ref_type == 'tag' }}
      IMAGE: ghcr.io/xdoubleu/wardcase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the image
        run: |
          out=(--output type=cacheonly)
          if [ "$PUBLISH" = true ]; then
            out=(--push --tag "$IMAGE:${GITHUB_REF_NAME#wardcase-v}")
          fi
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            "${out[@]}" \
            -f wardcase/Containerfile .
