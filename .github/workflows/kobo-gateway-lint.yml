name: Kobo Gateway Lint Workflow

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  lint-go:
    name: Kobo Gateway Go Lint
    # menubar_darwin.go is darwin-only; Linux would lint only the stub.
    runs-on: macos-26
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('kobo-gateway/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Run golangci-lint
        run: golangci-lint run
        working-directory: './kobo-gateway'
      - name: Run golangci-lint on the shared selfupdate module
        run: golangci-lint run
        working-directory: './selfupdate'
