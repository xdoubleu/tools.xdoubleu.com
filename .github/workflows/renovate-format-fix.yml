name: Renovate Format Fix

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/renovate-format-fix.yml'

jobs:
  format:
    # Only Renovate's own same-repo branches — never forks or human PRs.
    if: |
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: './web/package.json'
          cache-dependency-path: './web/package-lock.json'
      - run: npm ci
        working-directory: './web'
      - run: npm run lint:fix
        working-directory: './web'
      - name: Commit and push formatting fix if needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: auto-format via prettier"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No formatting changes needed."
          fi
