name: Routine — red PR repair

permissions:
  contents: read

# The schedule only runs while ROUTINE_RED_PR_REPAIR_ENABLED is "true".
on:
  schedule:
    # 05:07 UTC: 07:07 Brussels summer time, 06:07 in winter.
    - cron: '7 5 * * *'
  workflow_dispatch:

jobs:
  red-pr-repair:
    if: github.event_name == 'workflow_dispatch' || vars.ROUTINE_RED_PR_REPAIR_ENABLED == 'true'
    uses: ./.github/workflows/agent-routine.yml
    secrets: inherit
    with:
      routine: red-pr-repair
      prompt: >-
        Run the red-pr-repair skill (.claude/skills/red-pr-repair/SKILL.md);
        if the skill tool can't load it, read that file and follow it by hand.
        Pull get_failing_pull_requests and keep only red PRs in the skill's scope
        (same-repo head, trusted author, dependencies label or claude/ branch).
        For each, check out the PR's existing branch (never start-task),
        diagnose from the failing job's logs, and do exactly one of: (a) ci-pass
        "Timed out waiting for Codecov to report" → push a trivial non-empty
        commit, never re-run the check; (b) a transient infrastructure flake
        → list the run id in the outcome file's rerun_run_ids; (c) a
        determinable fix → fix, verify locally (including after any
        merge-conflict resolution), push; (d) otherwise leave the PR open and
        post a gh pr comment explaining what was investigated and why — never
        close or abandon it. Never merge. Write the outcome file only once
        every push has landed.

  rerun:
    needs: red-pr-repair
    if: always() && needs.red-pr-repair.outputs.rerun_run_ids != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.red-pr-repair.outputs.rerun_run_ids }}
        run: |
          for id in $RUNS; do
            gh workflow run rerun-failed-jobs.yml --repo "$GITHUB_REPOSITORY" \
              --ref main -f run_id="$id"
          done
