name: API Vulnerability Scan

permissions:
  contents: read

# Scheduled rather than per PR, so a new disclosure fails this run instead of
# every open PR.
on:
  schedule:
    # 04:17 UTC daily, clear of the routines.
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  govulncheck:
    name: API govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Run govulncheck
        run: make -o tools/vuln lint/vuln
        working-directory: './api'
