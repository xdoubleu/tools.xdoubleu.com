name: Build API Workflow

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: docker/setup-buildx-action@v4
      # Only needed to push; PRs build without pushing.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          # Repo root: api/go.mod's `replace` needs ../sentrytools in the context.
          context: .
          file: ./api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          # Kamal's `validate_image` requires this label (we build with buildx and
          # deploy with --skip-push). Must match `service:` in config/deploy.api.yml.
          labels: service=tools-xdoubleu-com-api
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
