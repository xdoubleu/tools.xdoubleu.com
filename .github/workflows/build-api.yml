name: Build API Workflow

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: docker/setup-buildx-action@v4
      # Only needed to push — PRs build (validating the image compiles) but
      # never push, and the base images (golang:1.26-alpine,
      # gcr.io/distroless/...) are public, so no auth is needed to pull them.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          # Repo-root context (not ./api) — api/go.mod's local `replace
          # tools.xdoubleu.com/sentrytools => ../sentrytools` needs that
          # sibling directory inside the build context too; see
          # api/Dockerfile's comment.
          context: .
          file: ./api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          # Kamal's `validate_image` step (kamal build/deploy) rejects any
          # image pulled without this exact label — it normally stamps it
          # itself via `kamal build`, but we build via buildx directly and
          # deploy with --skip-push. Must match `service:` in
          # config/deploy.api.yml.
          labels: service=tools-xdoubleu-com-api
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
