name: API Lint Workflow

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  lint-go:
    name: API Go Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Run golangci-lint
        run: golangci-lint run
        working-directory: './api'
      # The flake's golines is not the pinned 0.13.0 and formats tags differently, so
      # the Makefile installs the pin into GOPATH/bin, which must lead PATH.
      - name: Check golines drift
        run: PATH="$(go env GOPATH)/bin:$PATH" make lint/golines
        working-directory: './api'

  lint-sql:
    name: API SQL Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Run sqlfluff
        run: sqlfluff lint --dialect postgres .
        working-directory: './api'

  lint-migrations:
    name: API Migration Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Fetch main
        run: git fetch origin main
      - name: Check migration versions
        run: make lint/migrations
        working-directory: './api'

  lint-kamal-secrets:
    name: API Kamal Secrets Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Kamal deploy-secret consistency
        run: make lint/kamal-secrets
        working-directory: './api'

  lint-cross-schema:
    name: API Cross-Schema SQL Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check cross-schema SQL direction
        run: make lint/cross-schema
        working-directory: './api'

  lint-scalar-subqueries:
    name: API Scalar Subquery Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check scalar subqueries are unique by constraint
        run: make lint/scalar-subqueries
        working-directory: './api'
