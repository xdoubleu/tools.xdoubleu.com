name: API Test Workflow

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: API Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: './api/go.mod'
          cache-dependency-path: './api/go.sum'
      # A transient proxy.golang.org error mid-test fails whole binaries at
      # setup, so fetch modules up front and retry that.
      - name: Download modules
        working-directory: './api'
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - run: make test/cov/report
        working-directory: './api'
      # Upload only the deduped coverage.out; the pre-dedup intermediates would
      # make Codecov report covered lines as missed.
      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api
          files: ./api/coverage.out
          disable_search: true
