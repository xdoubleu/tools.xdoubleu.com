name: API Test Workflow

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: API Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop --command bash -euo pipefail {0}
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      # A transient proxy.golang.org error mid-test fails whole binaries at
      # setup, so fetch modules up front and retry that.
      - name: Download modules
        working-directory: './api'
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - run: make test/cov/report
        working-directory: './api'
      - name: Reads on messy data
        run: make test/reads
        working-directory: './api'
      - name: Patch coverage (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        working-directory: './api'
        run: |
          ../scripts/diff_coverage.sh go coverage.out
