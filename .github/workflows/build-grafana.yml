name: Build Grafana Workflow

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-grafana:
    name: Build Grafana
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Baked-in provisioning is validated nowhere else: static check, then boot.
      - run: make lint/grafana
      - run: make grafana/verify
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Only needed to push; PRs build without pushing.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./infra/grafana.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/grafana:latest
            ghcr.io/${{ github.repository }}/grafana:${{ github.sha }}
          # Required by Kamal's `validate_image`; must match config/deploy.grafana.yml.
          labels: service=tools-xdoubleu-com-grafana
          cache-from: type=gha,scope=grafana
          cache-to: type=gha,scope=grafana,mode=max
