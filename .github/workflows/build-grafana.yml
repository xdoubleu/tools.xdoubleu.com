name: Build Grafana Workflow

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-grafana:
    name: Build Grafana
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: docker/setup-buildx-action@v4
      # Only needed to push — PRs build (validating the wrapper still
      # builds) but never push, and grafana/grafana-oss is a public Docker
      # Hub image, so no auth is needed to pull it as our own base.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./infra/grafana.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}/grafana:latest
            ghcr.io/${{ github.repository }}/grafana:${{ github.sha }}
          # Kamal's `validate_image` step (see build-api.yml's identical
          # comment) rejects any image pulled without this exact label.
          # Must match `service:` in config/deploy.grafana.yml.
          labels: service=tools-xdoubleu-com-grafana
          cache-from: type=gha,scope=grafana
          cache-to: type=gha,scope=grafana,mode=max
