name: tools-xdoubleu-com
region: ams

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: tools.xdoubleu.com
    type: PRIMARY

ingress:
  rules:
    # Everything goes to the single merged component now (issue #558) — the
    # component's own gateway binary (gateway/internal/gateway) replicates
    # the /api-stripping and /health routing these two ingress rules used to
    # do.
    - component:
        name: app
      match:
        path:
          prefix: /

services:
  - name: app
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: xdoubleu/tools.xdoubleu.com/app
      tag: latest
    http_port: 8000
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      failure_threshold: 3
    envs:
      - key: ENV
        scope: RUN_TIME
        value: production
      - key: WEB_URL
        scope: RUN_TIME
        value: https://tools.xdoubleu.com
      - key: API_URL
        scope: RUN_TIME
        value: https://tools.xdoubleu.com/api
      # Soft ceiling so the Go GC(s) don't crowd out the Node child before it
      # can allocate, paired with gateway's own
      # NODE_OPTIONS=--max-old-space-size=192 (gateway/internal/gateway/children.go).
      # Split into 3 processes in #904 (was 2) — this hasn't been re-tuned
      # for the extra Go runtime's overhead yet; watch `docker stats` on the
      # deployed image after that change lands.
      - key: GOMEMLIMIT
        scope: RUN_TIME
        value: 300MiB
      - key: DB_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_PROJ_REF
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STEAM_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: HARDCOVER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: R2_ACCOUNT_ID
        scope: RUN_TIME
        type: SECRET
      - key: R2_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
      - key: R2_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: R2_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      # DSN for the bundled Next.js child's own Sentry project — kept separate
      # from SENTRY_DSN (the api's) so frontend and backend errors don't land
      # in the same project. Forwarded to the child as its own SENTRY_DSN env
      # var by gateway (gateway/internal/gateway/children.go).
      - key: SENTRY_DSN_WEB
        scope: RUN_TIME
        type: SECRET
      # Used server-side by the OAuth 2.1 consent page (/oauth/consent) to
      # drive the Supabase authorization endpoints, and passed through to the
      # Next.js child by gateway (gateway/internal/gateway/children.go).
      # SUPABASE_URL is https://<SUPABASE_PROJ_REF>.supabase.co; the anon key
      # is publishable.
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_ANON_KEY
        scope: RUN_TIME
        type: SECRET
      # OAuth app registration credentials for the admin-configurable
      # GitHub/Sentry/DigitalOcean observability integrations (issue #440).
      # These are the app's own OAuth client id/secret, registered once with
      # each provider — the resulting per-connection tokens, plus the
      # admin-picked repo/org/projects/app ID, are stored encrypted in the
      # database, not here. Until an admin connects and configures each
      # provider from the /monitoring page, that section stays degraded.
      - key: GITHUB_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: DO_OAUTH_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: DO_OAUTH_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      # 32 raw bytes, base64-standard-encoded (e.g. `openssl rand -base64 32`).
      # Encrypts stored OAuth tokens at rest (global.oauth_connections).
      - key: ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      # New-issue notification emails (issue #561): the notify-new-issues job
      # emails NOTIFY_EMAIL_TO via the Resend API when a new Sentry issue or
      # failed DigitalOcean deployment is seen. Unset means the job runs but
      # never sends (mailer.ErrNotConfigured).
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_FROM
        scope: RUN_TIME
        type: SECRET
      - key: NOTIFY_EMAIL_TO
        scope: RUN_TIME
        type: SECRET
      # Email-relay newsletter feeds (issue #595): EMAIL_INBOUND_DOMAIN builds
      # each feed's "reading+<token>@domain" inbound alias; EMAIL_INBOUND_SECRET
      # verifies the Resend inbound-webhook signature. Either unset disables
      # the feature (CreateFeed(kind=EMAIL) fails, the webhook rejects all
      # requests). Also requires RESEND_API_KEY (above) to fetch each
      # received email's body.
      - key: EMAIL_INBOUND_DOMAIN
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_INBOUND_SECRET
        scope: RUN_TIME
        type: SECRET
