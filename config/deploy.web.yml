# Kamal config for the web service; see config/deploy.api.yml's header.

service: tools-xdoubleu-com-web
image: xdoubleu/tools.xdoubleu.com/web

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>

ssh:
  user: deploy

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch:
    - amd64

proxy:
  # web is the root/catch-all service, so it declares `ssl` (see deploy.api.yml)
  # and deploys first.
  host: tools.xdoubleu.com
  ssl: true
  app_port: 3000
  healthcheck:
    # Not `/`: the homepage SSR-fetches from api, coupling this check to api's
    # own rolling deploy.
    path: /health
    interval: 10
    timeout: 5

env:
  clear:
    ENV: production
    WEB_URL: https://tools.xdoubleu.com
    API_URL: https://tools.xdoubleu.com/api
    # PostHog Cloud EU ingestion host.
    POSTHOG_HOST: https://eu.i.posthog.com
  secret:
    # Deploy-time SHA (Kamal doesn't inject one); CI passes github.sha.
    - RELEASE
    - SENTRY_DSN_WEB
    # Ships in the browser bundle anyway, like SENTRY_DSN_WEB.
    - POSTHOG_KEY
    # Gates GET /metrics (otherwise public on the catch-all); Prometheus sends it
    # as a bearer token. Same Secret as the api's and Tofu's.
    - OBSERVABILITY_INGEST_SECRET
