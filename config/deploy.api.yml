# Kamal config for the api service; Kamal evaluates it as ERB. The server IP
# and registry user come from the environment (Secrets, since the repo is
# public); CI supplies them, export them for a manual deploy.
# api is the root service on the shared kamal-proxy: it serves the built web app
# and the API, and Grafana sits beside it at /grafana (ADR 0034).
# Postgres is Tofu-managed (infra/postgres-compose.yml), bound to 127.0.0.1
# and reached over the external `kamal` Docker network as host `postgres`.

service: tools-xdoubleu-com-api
# No `ghcr.io/` prefix: Kamal prepends registry.server itself.
image: xdoubleu/tools.xdoubleu.com/api
# Kamal prunes at the end of each deploy but keeps this many old containers
# (and their images); the default 5 costs several GB on the 40GB VPS.
retain_containers: 2

# The 4 GB host has no swap, so each role has a hard cap: a runaway job is
# OOM-killed alone instead of starving the host. GOMEMLIMIT (soft) sits below
# the cap and the heap watchdog threshold (cmd/api/main.go) between the two.
# workers runs the memory-heavy jobs (book figure analysis, KEPUB conversion)
# and has no proxy: Prometheus finds it via
# the shared `service` label, so TargetDown / ApiRestartLoop cover it.
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>
    options:
      memory: 512m
  workers:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>
    options:
      memory: 1536m
    env:
      clear:
        ROLE: workers
        GOMEMLIMIT: 1100MiB

# No ssh.key_data: auth goes through ssh-agent (CI starts one).
ssh:
  user: deploy

# Kamal's schema requires credentials even for a public package.
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Required by Kamal's schema; unused since deploys pass --skip-push.
builder:
  arch:
    - amd64

proxy:
  # The root path service declares `ssl`; Grafana's /grafana service must not.
  host: tools.xdoubleu.com
  ssl: true
  app_port: 8000
  # No path_prefix: every path reaches the api, which serves web's files and
  # strips /api itself (kamal_proxy_shim.go) because /.well-known/* must arrive
  # unmodified.
  healthcheck:
    path: /health
    interval: 10
    timeout: 5

# Docker's default json-file driver never rotates; unbounded container logs
# fill the VPS disk.
logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

env:
  clear:
    ENV: production
    # CORS allowedOrigins and mailer links need it.
    WEB_URL: https://tools.xdoubleu.com
    # Also the base URL the browser calls (web's /env.js).
    API_URL: https://tools.xdoubleu.com/api
    # PostHog Cloud EU ingestion host.
    POSTHOG_HOST: https://eu.i.posthog.com
    GOMEMLIMIT: 380MiB
  secret:
    # Deploy-time SHA (Kamal doesn't inject one); CI passes github.sha.
    - RELEASE
    # Tofu generates the password (random_password.postgres); it was copied into
    # the KAMAL_DB_DSN secret once, so rotating means updating both.
    - DB_DSN
    # Signs session JWTs; rotating it signs everyone out.
    - JWT_SECRET
    # fosite HMAC key, separate from JWT_SECRET; rotating it invalidates every
    # MCP OAuth token.
    - OAUTH_HMAC_SECRET
    # Signs OIDC ID tokens (public half at /oauth2/jwks). Unset: an ephemeral
    # key per boot.
    - OAUTH_OIDC_PRIVATE_KEY
    # Its bcrypt hash is reconciled into auth.oauth2_clients on startup.
    - OAUTH_GRAFANA_CLIENT_SECRET
    # The "routines" machine client's secret, reconciled the same way.
    - OAUTH_ROUTINES_CLIENT_SECRET
    # Repo Secrets read by main.yml's deploy-kamal job, not tfvars: Tofu
    # provisions the host, it doesn't deploy the app.
    - STEAM_API_KEY
    - HARDCOVER_API_KEY
    - TMDB_API_KEY
    - OPENROUTER_API_KEY
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_BUCKET
    - SENTRY_DSN
    - GITHUB_OAUTH_CLIENT_ID
    - GITHUB_OAUTH_CLIENT_SECRET
    - SENTRY_OAUTH_CLIENT_ID
    - SENTRY_OAUTH_CLIENT_SECRET
    - TODOIST_OAUTH_CLIENT_ID
    - TODOIST_OAUTH_CLIENT_SECRET
    - ENCRYPTION_KEY
    - RESEND_API_KEY
    - EMAIL_FROM
    - NOTIFY_EMAIL_TO
    - EMAIL_INBOUND_DOMAIN
    - EMAIL_INBOUND_SECRET
    # Bearer token GET /metrics requires (the api is publicly reachable);
    # Prometheus sends it. Same Secret as Tofu's. Empty leaves /metrics open.
    - OBSERVABILITY_INGEST_SECRET
    # Browser Sentry DSN and PostHog key, served as /env.js. Both ship in the
    # bundle's runtime config anyway.
    - SENTRY_DSN_WEB
    - POSTHOG_KEY
    # Same as grafana's GF_SECURITY_ADMIN_PASSWORD; get_grafana_alerts logs in as
    # `admin` via the public host.
    - GRAFANA_ADMIN_PASSWORD
