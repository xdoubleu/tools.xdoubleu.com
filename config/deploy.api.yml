# Kamal's deploy config for the api service. Read directly by `kamal` via
# `-c config/deploy.api.yml` — there is no render step: Kamal evaluates this
# file as ERB before parsing the YAML (Kamal::Configuration.load_config_file),
# so the two values that can't be committed literally are pulled straight
# from the environment below.
#
# They're env vars rather than hardcoded because this repo is public and
# GitHub masks only Secrets: KAMAL_SERVER_IP in particular is echoed into an
# ssh-keyscan command, so leaking it into a log is a real concern. CI's
# deploy-kamal job supplies both from repo Secrets; export them yourself for
# a manual deploy.
#
# api and web deploy as two fully independent Kamal apps (#1038, replacing
# the single merged gateway+api+web image from issue #558/#1033/#1036) —
# see config/deploy.web.yml for the other half and root CLAUDE.md's Deploy
# shape section for why. Both share the same kamal-proxy instance and
# domain on the Hetzner VPS (infra/), routed by kamal-proxy's own
# path-based routing (proxy.path_prefix below) instead of a hand-rolled
# gateway/ process. Since cutover (#1034) this serves production traffic on
# the real domain: `proxy.host`/`proxy.ssl` below let kamal-proxy run Let's
# Encrypt's HTTP-01 challenge and terminate TLS itself, which only works
# because Cloudflare's A/AAAA records for that name already resolve to this
# box.
#
# Postgres and GoTrue stay exactly as OpenTofu already manages them
# (infra/postgres-compose.yml, issues #1031/#1032) — plain docker-compose
# containers, no Kamal accessories here. This is the one part of the stack
# Tofu still owns end to end. Both are bound to 127.0.0.1 only on the host
# (never exposed publicly) and reachable from the Kamal-deployed app
# container by joining the same `kamal` Docker network (created by
# null_resource.kamal_network in infra/main.tf before Postgres/GoTrue come
# up, since postgres-compose.yml declares it `external: true`) — DB_DSN/
# GOTRUE_URL below use the container names (`postgres`/`gotrue`) as
# hostnames, exactly like GOTRUE_DB_DATABASE_URL already does internally.

service: tools-xdoubleu-com-api
# No `ghcr.io/` prefix here — registry.server below already supplies it.
# Kamal concatenates registry.server + image itself; including it in both
# places doubles up into ghcr.io/ghcr.io/... (confirmed via `kamal config`).
image: xdoubleu/tools.xdoubleu.com/api

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>

# No ssh.key_data here — authentication goes through ssh-agent instead: the
# operator's own agent for a manual deploy, and in CI an agent the
# deploy-kamal job starts itself, loading KAMAL_SSH_KEY with
# `printf '%s\n' | ssh-add -` (issue #1106 — webfactory/ssh-agent fed the
# secret to ssh-add verbatim, and a secret stored without its trailing
# newline is an unparsable PEM).
ssh:
  user: deploy

# Required even though ghcr.io/xdoubleu/tools.xdoubleu.com/api is a public
# package (no docker login needed to actually pull it) — Kamal's own config
# schema unconditionally requires registry.username/password, confirmed via
# `kamal config` erroring without them regardless of image visibility. A
# GHCR PAT with read:packages works fine even against a public package.
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Hetzner CX22/23 is x86_64 — also required by Kamal's config schema, unused
# in practice since every deploy here passes --skip-push (image is already
# built and pushed by CI, see infra/main.tf/#1036's CI workflow).
builder:
  arch:
    - amd64

proxy:
  # Hardcoded, not an interpolation: this repo deploys exactly one domain
  # (shared with deploy.web.yml), and keeping it literal means neither
  # render path needs a third variable. No `ssl` key here on purpose:
  # kamal-proxy requires TLS to be declared on the root path service only
  # (deploy.web.yml, no path_prefix) — a path-prefixed service like this one
  # inherits the host's TLS from the root instead of declaring its own.
  # Declaring `ssl: true` here again gets rejected with "TLS settings must
  # be specified on the root path service" (issue #1132). web deploys first
  # (see .github/workflows/main.yml's deploy-kamal job) so it's the one that
  # ends up owning initial cert issuance for the shared host.
  host: tools.xdoubleu.com
  app_port: 8000
  # /api/* and /.well-known/* both route here — everything else falls
  # through to web's catch-all registration (deploy.web.yml). Unstripped:
  # kamal-proxy can't strip only one of several prefixes on a single
  # service, and /.well-known/* (RFC 9728/8414 OAuth discovery) must reach
  # api unmodified — so api/cmd/api/kamal_proxy_shim.go does the /api
  # stripping in Go instead, replicating what gateway/'s proxy.go used to
  # do before it was retired (#1038).
  path_prefix: "/api,/.well-known"
  strip_path_prefix: false
  healthcheck:
    # Checked directly against this container over the internal Docker
    # network, bypassing the public path_prefix routing entirely — so this
    # keeps working unchanged regardless of path_prefix/strip_path_prefix
    # above.
    path: /health
    interval: 10
    timeout: 5

env:
  clear:
    ENV: production
    # api's own CORS allowedOrigins and mailer/contacts links
    # (config.WebURL) need this even though api never serves web's UI.
    WEB_URL: https://tools.xdoubleu.com
    API_URL: https://tools.xdoubleu.com/api
    # Leftover from when api shared one container's memory with the Node
    # web child (pre-#1038) — sized to leave the Node child headroom, which
    # no longer applies now that api runs in its own container. Carried
    # over unchanged rather than re-tuned; see root README.md's Deploy
    # Notes section.
    GOMEMLIMIT: 300MiB
  secret:
    # Deploy-time SHA — Kamal doesn't inject one, so the deploy-kamal CI job
    # passes github.sha explicitly (export it yourself for a manual
    # deploy). Feeds Sentry release tagging and web/components/Footer.tsx's
    # version display (web has its own RELEASE, set in deploy.web.yml —
    # each image bakes it in independently now, no cross-process
    # forwarding needed).
    - RELEASE
    # postgres://postgres:<password>@postgres:5432/postgres — same
    # OpenTofu-managed Postgres from infra/postgres-compose.yml, reached
    # over the shared `kamal` Docker network (see file header), not
    # Supabase. Comes from the KAMAL_DB_DSN repo secret — Tofu generates the
    # password (random_password.postgres) but nothing outside Tofu can read
    # its state, so the value was copied into that secret once via
    # `tofu output -raw postgres_password`. Rotating the password means
    # updating both.
    - DB_DSN
    # http://gotrue:9999 — same network. Makes api/cmd/api/main.go call
    # WithCustomAuthURL, pointing sign-in at self-hosted GoTrue instead of
    # Supabase-hosted GoTrue. Static, not a secret — hardcoded by the
    # deploy-kamal job.
    # SUPABASE_PROJ_REF/SUPABASE_API_KEY stay set too but are otherwise
    # unused once this is set — they only ever mattered for the MCP OAuth
    # authorization-server issuer (api/cmd/api/mcp.go), a deliberate
    # exception that stays pointed at Supabase per #1032's own scoping
    # note. If Supabase isn't in use at all, dummy values are fine — MCP
    # sign-in just stays broken until the future "retire GoTrue entirely"
    # issue (#1039) replaces that flow properly.
    - GOTRUE_URL
    # Everything below is a repo Secret read by .github/workflows/main.yml's
    # deploy-kamal job (export the same names by hand for a manual deploy).
    # They are deliberately NOT tfvars: Tofu provisions the host, it doesn't
    # deploy the app, so there's exactly one place to rotate each value.
    - SUPABASE_PROJ_REF
    - SUPABASE_API_KEY
    - STEAM_API_KEY
    - HARDCOVER_API_KEY
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_BUCKET
    - SENTRY_DSN
    - GITHUB_OAUTH_CLIENT_ID
    - GITHUB_OAUTH_CLIENT_SECRET
    - SENTRY_OAUTH_CLIENT_ID
    - SENTRY_OAUTH_CLIENT_SECRET
    - DO_OAUTH_CLIENT_ID
    - DO_OAUTH_CLIENT_SECRET
    - ENCRYPTION_KEY
    - RESEND_API_KEY
    - EMAIL_FROM
    - NOTIFY_EMAIL_TO
    - EMAIL_INBOUND_DOMAIN
    - EMAIL_INBOUND_SECRET
