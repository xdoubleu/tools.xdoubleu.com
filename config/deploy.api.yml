# Kamal config for the api service; Kamal evaluates it as ERB. The server IP
# and registry user come from the environment (Secrets, since the repo is
# public); CI supplies them, export them for a manual deploy.
# api and web are two Kamal apps sharing one kamal-proxy and domain (ADR 0001).
# Postgres is Tofu-managed (infra/postgres-compose.yml), bound to 127.0.0.1
# and reached over the external `kamal` Docker network as host `postgres`.

service: tools-xdoubleu-com-api
# No `ghcr.io/` prefix: Kamal prepends registry.server itself.
image: xdoubleu/tools.xdoubleu.com/api

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>

# No ssh.key_data: auth goes through ssh-agent (CI starts one).
ssh:
  user: deploy

# Kamal's schema requires credentials even for a public package.
registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Required by Kamal's schema; unused since deploys pass --skip-push.
builder:
  arch:
    - amd64

proxy:
  # No `ssl` key: TLS is declared only on the root path service
  # (deploy.web.yml); declaring it here is rejected.
  host: tools.xdoubleu.com
  app_port: 8000
  # Unstripped: kamal-proxy can't strip one of several prefixes, and
  # /.well-known/* must reach api unmodified, so kamal_proxy_shim.go strips /api.
  path_prefix: "/api,/.well-known"
  strip_path_prefix: false
  healthcheck:
    # Checked over the internal Docker network, bypassing path_prefix.
    path: /health
    interval: 10
    timeout: 5

env:
  clear:
    ENV: production
    # CORS allowedOrigins and mailer links need it.
    WEB_URL: https://tools.xdoubleu.com
    API_URL: https://tools.xdoubleu.com/api
    # Not re-tuned since api got its own container.
    GOMEMLIMIT: 300MiB
  secret:
    # Deploy-time SHA (Kamal doesn't inject one); CI passes github.sha.
    - RELEASE
    # Tofu generates the password (random_password.postgres); it was copied into
    # the KAMAL_DB_DSN secret once, so rotating means updating both.
    - DB_DSN
    # Signs session JWTs; rotating it signs everyone out.
    - JWT_SECRET
    # fosite HMAC key, separate from JWT_SECRET; rotating it invalidates every
    # MCP OAuth token.
    - OAUTH_HMAC_SECRET
    # Signs OIDC ID tokens (public half at /oauth2/jwks). Unset: an ephemeral
    # key per boot.
    - OAUTH_OIDC_PRIVATE_KEY
    # Its bcrypt hash is reconciled into auth.oauth2_clients on startup.
    - OAUTH_GRAFANA_CLIENT_SECRET
    # The "routines" machine client's secret, reconciled the same way.
    - OAUTH_ROUTINES_CLIENT_SECRET
    # Repo Secrets read by main.yml's deploy-kamal job, not tfvars: Tofu
    # provisions the host, it doesn't deploy the app.
    - STEAM_API_KEY
    - HARDCOVER_API_KEY
    # SNCB GTFS feed key, sent as bmc-partner-key.
    - BMC_PARTNER_KEY
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_BUCKET
    - SENTRY_DSN
    - GITHUB_OAUTH_CLIENT_ID
    - GITHUB_OAUTH_CLIENT_SECRET
    - SENTRY_OAUTH_CLIENT_ID
    - SENTRY_OAUTH_CLIENT_SECRET
    - TODOIST_OAUTH_CLIENT_ID
    - TODOIST_OAUTH_CLIENT_SECRET
    - ENCRYPTION_KEY
    - RESEND_API_KEY
    - EMAIL_FROM
    - NOTIFY_EMAIL_TO
    - EMAIL_INBOUND_DOMAIN
    - EMAIL_INBOUND_SECRET
    # Authenticates web's POSTs to /api/observability/logs; empty rejects every
    # batch.
    - OBSERVABILITY_INGEST_SECRET
    # Same as grafana's GF_SECURITY_ADMIN_PASSWORD; get_grafana_alerts logs in as
    # `admin` via the public host.
    - GRAFANA_ADMIN_PASSWORD
    # Authenticates routine-fire outbound and POST /webhooks/grafana-alert
    # inbound; empty rejects every inbound request.
    - ROUTINE_FIRE_TOKEN
    # notify_slack's webhook; distinct from GRAFANA_SLACK_WEBHOOK_URL.
    - SLACK_WEBHOOK_URL
