# Kamal config for Grafana; see config/deploy.api.yml's header.
# Deploys a thin wrapper image (infra/grafana.Dockerfile) because Kamal
# requires a `service` label the upstream image lacks. Grafana is a Kamal
# service (not a compose accessory like Prometheus) so kamal-proxy can route
# /grafana to it.

service: tools-xdoubleu-com-grafana
# No registry prefix or tag: Kamal adds both.
image: xdoubleu/tools.xdoubleu.com/grafana

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>

ssh:
  user: deploy

builder:
  arch:
    - amd64

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

proxy:
  # No `ssl` key: TLS is declared on the root path service (deploy.web.yml).
  host: tools.xdoubleu.com
  app_port: 3000
  # Not stripped: Grafana serves from the sub path (GF_SERVER_SERVE_FROM_SUB_PATH)
  # and the seeded OAuth redirect URI (migration 00045) includes /grafana.
  path_prefix: "/grafana"
  strip_path_prefix: false
  healthcheck:
    # Checked over the internal Docker network, bypassing path_prefix.
    path: /grafana/api/health
    interval: 10
    timeout: 5

env:
  clear:
    GF_SERVER_ROOT_URL: https://tools.xdoubleu.com/grafana
    GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    # Login form stays enabled as break-glass if the api's OIDC is unreachable.
    GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
    GF_AUTH_GENERIC_OAUTH_NAME: "tools.xdoubleu.com"
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
    # Must carry /api: a bare /oauth2/... hits the web catch-all and 404s.
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://tools.xdoubleu.com/api/oauth2/authorize
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://tools.xdoubleu.com/api/oauth2/token
    GF_AUTH_GENERIC_OAUTH_API_URL: ""
    # Read from ID token claims (ADR 0021). Only admins get a `role` claim, so
    # role_attribute_strict makes Grafana admin-only.
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "role"
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
    GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
    # Resend's SMTP relay accepts the api's Resend API key as the password.
    GF_SMTP_ENABLED: "true"
    GF_SMTP_HOST: smtp.resend.com:587
    GF_SMTP_USER: resend
  secret:
    # Deploy-time SHA, kept for parity with api/web.
    - RELEASE
    # Grafana only reads GF_-prefixed vars, so the api's OAUTH_GRAFANA_CLIENT_SECRET
    # is stored here under this name (same repo Secret).
    - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
    # Break-glass local admin password.
    - GF_SECURITY_ADMIN_PASSWORD
    # Same Resend key the api uses.
    - GF_SMTP_PASSWORD
    - GF_SMTP_FROM_ADDRESS
    # Non-GF_ names below are read via $__env{} in infra/grafana/provisioning/,
    # not by Grafana settings.
    - GRAFANA_SLACK_WEBHOOK_URL
    # GitHub PAT (repo read + alerts read) and Sentry token
    # (org:read, project:read, event:read) for issue-signals.yml.
    - GRAFANA_GITHUB_DATASOURCE_TOKEN
    - GRAFANA_SENTRY_DATASOURCE_TOKEN
